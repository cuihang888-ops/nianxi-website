<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>瑞丽 · 组装试玩</title>
<style>
  :root{
    --paper:#F3EEE2; --ink:#4C4B40; --muted:#8E8C7B;
    --green:#7FA65C; --green-d:#5F8442; --panel:#FBF8F0; --pline:#C8D7B0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#EFE9D6;color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer}
  /* ---------- top HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:8px 12px;background:rgba(251,248,240,.94);border-bottom:1.5px solid var(--pline);
    box-shadow:0 2px 10px rgba(90,100,60,.08);flex-wrap:wrap}
  #hud .ttl{font-size:17px;font-weight:700;letter-spacing:1px;color:#44543A;white-space:nowrap}
  #zone{font-size:13px;color:#5F7247;background:#EDF3DF;border:1px solid var(--pline);
    border-radius:999px;padding:4px 12px;white-space:nowrap}
  #hud .sp{flex:1}
  .tbtn{font:inherit;font-size:13px;color:#54683F;background:#fff;border:1px solid var(--pline);
    border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
  .tbtn:hover{background:#EDF3DF}
  .tbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  #compass{width:46px;height:46px;flex:none}
  /* ---------- hint / toast ---------- */
  #hint{position:fixed;left:12px;bottom:12px;z-index:25;font-size:12.5px;color:#6B7256;
    background:rgba(251,248,240,.88);border:1px solid var(--pline);border-radius:999px;padding:5px 13px;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:40;
    background:rgba(66,74,52,.92);color:#FBF7EC;font-size:14.5px;border-radius:999px;padding:9px 20px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #saveNote{position:fixed;right:14px;bottom:12px;z-index:25;font-size:12.5px;color:#7A8B62;
    opacity:0;transition:opacity .4s;pointer-events:none}
  #saveNote.show{opacity:1}
  /* ---------- enter temple ---------- */
  #enterBtn{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:35;display:none;
    font:inherit;font-size:17px;font-weight:700;letter-spacing:4px;color:#FBF3DC;cursor:pointer;
    background:linear-gradient(180deg,#8A6D3B,#6F5636);border:1.5px solid #D9BC7A;border-radius:14px;
    padding:12px 42px;box-shadow:0 6px 18px rgba(80,60,20,.35)}
  #enterBtn.show{display:block}
  /* ---------- temple action bar ---------- */
  #templeBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:none;
    align-items:center;gap:8px;background:rgba(43,38,30,.88);border:1px solid rgba(217,188,122,.5);
    border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(30,25,15,.4);max-width:96vw;flex-wrap:wrap;justify-content:center}
  #templeBar.show{display:flex}
  .act{font:inherit;font-size:14.5px;color:#F3EAD2;background:rgba(255,250,235,.08);
    border:1px solid rgba(217,188,122,.45);border-radius:12px;padding:9px 15px;cursor:pointer;white-space:nowrap}
  .act:hover{background:rgba(255,250,235,.18)}
  .act.on{background:#B08A4E;color:#FFF7E2;border-color:#D9BC7A}
  .act .cnt{font-size:12px;color:#D9BC7A;margin-left:5px}
  .act.exit{background:rgba(160,61,49,.25);border-color:rgba(220,140,120,.5)}
  /* ---------- wardrobe panel ---------- */
  #panel{position:fixed;top:60px;right:12px;z-index:45;width:302px;max-width:92vw;
    max-height:calc(100% - 84px);overflow-y:auto;background:var(--panel);
    border:1.5px solid var(--pline);border-radius:20px;box-shadow:0 14px 34px rgba(90,100,60,.22);
    padding:16px 16px 14px;transform:translateX(115%);transition:transform .32s cubic-bezier(.2,.8,.25,1)}
  #panel.open{transform:translateX(0)}
  #panel h2{margin:0;font-size:19px;color:#44543A;letter-spacing:1px}
  #panel .sub{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
  #panel .rowlabel{font-size:12px;color:var(--muted);letter-spacing:2px;margin:13px 0 6px}
  #closePanel{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;border:0;
    background:#F0EBD9;color:#8E8C7B;font-size:16px;cursor:pointer;line-height:1}
  #nameInput{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 11px;outline:none}
  #nameInput:focus{border-color:var(--green)}
  .sws{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(140,130,105,.25);cursor:pointer;position:relative;padding:0}
  .sw.on::after{content:"";position:absolute;inset:-4.5px;border-radius:50%;border:1.5px solid #9BB578}
  #colorName{font-size:13px;color:#6B7256;margin-left:2px}
  .hats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .hat{font:inherit;font-size:12.5px;color:#6B6248;border:1px solid #E7E1D0;background:#FFFDF7;
    border-radius:12px;padding:8px 2px 6px;cursor:pointer;text-align:center}
  .hat .ic{display:block;font-size:17px;line-height:1.25}
  .hat.on{border-color:#9BB578;background:#F0F5E4;box-shadow:inset 0 0 0 1px #9BB578}
  #moodSelect{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 10px;outline:none}
  #storyInput{width:100%;font:inherit;font-size:14px;line-height:1.55;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 11px;outline:none;resize:vertical;min-height:58px}
  #storyInput:focus{border-color:var(--green)}
  .storyfoot{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
  #storyCount{font-size:12px;color:var(--muted)}
  .mini{font:inherit;font-size:12.5px;color:#5F7247;background:#EDF3DF;border:1px solid var(--pline);
    border-radius:999px;padding:4px 12px;cursor:pointer}
  #doneBtn{width:100%;margin-top:15px;font:inherit;font-size:15.5px;font-weight:600;letter-spacing:2px;
    color:#FFFDF4;background:var(--green);border:0;border-radius:12px;padding:11px 0;cursor:pointer}
  #doneBtn:hover{background:var(--green-d)}
  #panelSaved{font-size:12px;color:#93A87B;text-align:center;margin-top:8px;min-height:15px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="ttl">瑞丽 · 组装试玩</div>
  <div id="zone">瑞丽大道</div>
  <canvas id="compass" width="108" height="108" title="北向罗盘"></canvas>
  <div class="sp"></div>
  <button class="tbtn" id="gotoPen" type="button">羊圈 · 试玩传送</button>
  <button class="tbtn" id="gotoTemple" type="button">山寺 · 试玩传送</button>
  <button class="tbtn" id="viewAll" type="button">全图</button>
  <button class="tbtn" id="viewPen" type="button">回到羊圈</button>
  <button class="tbtn" id="soundBtn" type="button" title="声音开关">🔊</button>
</div>

<div id="hint">点羊开衣橱 · WASD 朝向走 · 点按移动 · 拖动转视角 · 滚轮缩放</div>
<div id="toast"></div>
<div id="saveNote">小羊的样子，已经记住</div>
<button id="enterBtn" type="button">进 寺</button>

<div id="templeBar">
  <button class="act" data-act="pray" type="button">合掌</button>
  <button class="act" data-act="bow" type="button">拜佛<span class="cnt" id="bowCnt">0 / 108</span></button>
  <button class="act" data-act="fish" type="button">木鱼</button>
  <button class="act" data-act="autofish" type="button" id="autoFishBtn">连敲 · 开</button>
  <button class="act" data-act="beads" type="button">念珠<span class="cnt" id="beadCnt">0 / 108</span></button>
  <button class="act" data-act="sit" type="button" id="sitBtn">静坐</button>
  <button class="act exit" data-act="exit" type="button">出寺</button>
</div>

<aside id="panel">
  <button id="closePanel" type="button" title="关闭">✕</button>
  <h2 id="panelName">小羊的衣橱</h2>
  <div class="sub">给它换个样子，慢慢来。</div>
  <div class="rowlabel">名字</div>
  <input id="nameInput" maxlength="6" autocomplete="off">
  <div class="rowlabel">毛色 · <span id="colorName"></span></div>
  <div class="sws" id="swWrap"></div>
  <div class="rowlabel">配饰</div>
  <div class="hats" id="hatWrap"></div>
  <div class="rowlabel">性格</div>
  <select id="moodSelect"></select>
  <div class="rowlabel">它的小故事</div>
  <textarea id="storyInput" maxlength="80"></textarea>
  <div class="storyfoot">
    <span id="storyCount">0 / 80</span>
    <button class="mini" id="reroll" type="button">换一句</button>
  </div>
  <button id="doneBtn" type="button">好啦</button>
  <div id="panelSaved"></div>
</aside>

}

  var ex=(x-LAKE.cx)/(LAKE.rx+r),ez=(z-LAKE.cz)/(LAKE.rz+r),q=ex*ex+ez*ez;
  if(q<1){var s=1/Math.sqrt(q||1e-6);x=LAKE.cx+ex*s*(LAKE.rx+r);z=LAKE.cz+ez*s*(LAKE.rz+r)}
  return [x,z];
}
function collideMap(x,z,r){
  x=clamp(x,MAP.bounds.minX+r,MAP.bounds.maxX-r);
  z=clamp(z,MAP.bounds.minZ+r,MAP.bounds.maxZ-r);
  var p=pushLake(x,z,r);x=p[0];z=p[1];
  for(var i=0;i<FENCES.length;i++){p=pushSeg(x,z,r,FENCES[i]);x=p[0];z=p[1]}
  p=pushRect(x,z,r,SHED_R);x=p[0];z=p[1];
  p=pushRect(x,z,r,HALL_R);x=p[0];z=p[1];
  p=pushRect(x,z,r,BELL_R);x=p[0];z=p[1];
  p=pushCircle(x,z,r,PAGODA);x=p[0];z=p[1];
  p=pushCircle(x,z,r,TROUGH_W);x=p[0];z=p[1];
  p=pushCircle(x,z,r,TROUGH_F);x=p[0];z=p[1];
  p=pushCircle(x,z,r,HAY);x=p[0];z=p[1];
  return [x,z];
}
function inPen(x,z,m){
  m=m||0;
  return x>PEN.minX+m&&x<PEN.maxX-m&&z>PEN.minZ+m&&z<PEN.maxZ-m;
}
function pointInRect(x,z,R,m){m=m||0;return x>R.minX+m&&x<R.maxX-m&&z>R.minZ+m&&z<R.maxZ-m}

/* ================= sheep behaviour (mood drives it) ================= */
function sheepTargetOK(x,z){
  if(!inPen(x,z,1.7))return false;
  if(pointInRect(x,z,SHED_R,-1.4))return false;
  if(hyp(x-TROUGH_W.x,z-TROUGH_W.z)<3)return false;
  if(hyp(x-TROUGH_F.x,z-TROUGH_F.z)<3)return false;
  if(hyp(x-HAY.x,z-HAY.z)<3.4)return false;
  return true;
}
function startWander(sp){
  var m=MOODS[sp.mood],rad=m.rad*2.3;
  for(var a=0;a<12;a++){
    var ang=Math.random()*TAU,r=.4+Math.random()*rad;
    var nx=sp.x+Math.cos(ang)*r,nz=sp.z+Math.sin(ang)*r;
    if(!sheepTargetOK(nx,nz))continue;
    sp.tx=nx;sp.tz=nz;sp.state='walk';sp.t=8;return;
  }
  sp.state='idle';sp.t=1+Math.random()*1.6;
}
function updateSheep(dt){
  for(var i=0;i<sheep.length;i++){
    var sp=sheep[i];
    if(dragSheep===sp){sp.bob+=dt*2;continue}
    sp.t-=dt;
    if(sp.hopT>0)sp.hopT=Math.max(0,sp.hopT-dt*1.4);
    if(sp.state==='walk'){
      var dx=sp.tx-sp.x,dz=sp.tz-sp.z,d=hyp(dx,dz);
      var spd=MOODS[sp.mood].speed*2.6;
      if(d<.15||sp.t<=0){
        if(d<1.2&&Math.random()<.45){sp.state='graze';sp.t=1.4+Math.random()*1.8}
        else{sp.state='idle';var im=MOODS[sp.mood].idle;sp.t=im[0]+Math.random()*(im[1]-im[0])}
      }else{
        var step=Math.min(d,spd*dt);
        sp.x+=dx/d*step;sp.z+=dz/d*step;
        if(Math.abs(dx)>.05)sp.dir=dx>0?1:-1;
        sp.bob+=dt*6.5;
      }
    }else if(sp.state==='graze'){
      sp.grazeDip=Math.min(1,sp.grazeDip+dt*3);
      sp.bob+=dt*1.1;
      if(sp.t<=0){sp.state='idle';var im2=MOODS[sp.mood].idle;sp.t=(im2[0]+Math.random()*(im2[1]-im2[0]))*.7}
    }else{ /* idle */
      sp.grazeDip=Math.max(0,sp.grazeDip-dt*3);
      sp.bob+=dt*1.25;
      if(sp.t<=0)startWander(sp);
    }
    /* hard containment: fence is a wall for sheep too */
    var p=[sp.x,sp.z];
    for(var f=0;f<FENCES.length;f++)p=pushSeg(p[0],p[1],1.05,FENCES[f]);
    p=pushRect(p[0],p[1],1.05,SHED_R);
    p=pushCircle(p[0],p[1],1.0,TROUGH_W);
    p=pushCircle(p[0],p[1],1.0,TROUGH_F);
    p=pushCircle(p[0],p[1],1.0,HAY);
    sp.x=clamp(p[0],PEN.minX+1.05,PEN.maxX-1.05);
    sp.z=clamp(p[1],PEN.minZ+1.05,PEN.maxZ-1.05);
  }
  /* gentle separation so they don't stack */
  for(var a=0;a<sheep.length;a++)for(var b=a+1;b<sheep.length;b++){
    var A=sheep[a],B=sheep[b],ox=B.x-A.x,oz=B.z-A.z,d=hyp(ox,oz);
    if(d>0.01&&d<1.7){var push=(1.7-d)/2;A.x-=ox/d*push;A.z-=oz/d*push;B.x+=ox/d*push;B.z+=oz/d*push}
  }
  for(var k=0;k<sheep.length;k++){
    sheep[k].x=clamp(sheep[k].x,PEN.minX+1.05,PEN.maxX-1.05);
    sheep[k].z=clamp(sheep[k].z,PEN.minZ+1.05,PEN.maxZ-1.05);
  }
}

/* ================= player movement ================= */
function setMoveTarget(x,z){
  player.wp.length=0;
  var pin=inPen(player.x,player.z),tin=inPen(x,z);
  if(pin!==tin){
    if(pin){player.wp.push([-106,-2])}
    player.wp.push([-100.2,-2]);
    if(!pin){player.wp.push([-106,-2])}
  }
  player.tx=x;player.tz=z;player.stuckT=0;player.lastX=player.x;player.lastZ=player.z;
}
function clearTarget(){player.tx=null;player.tz=null;player.wp.length=0}
function moveToward(dt,px,pz,getPos,setPos,speed,radius,collideFn){
  var dx=px-getPos.x,dz=pz-getPos.z,d=hyp(dx,dz);
  if(d<.25)return true;
  var remain=speed*dt,guard=0;
  while(remain>0&&guard++<24){
    var step=Math.min(remain,d,.45);
    var nx=getPos.x+dx/d*step,nz=getPos.z+dz/d*step;
    var p=collideFn(nx,nz,radius);
    setPos(p[0],p[1]);
    remain-=step;
    dx=px-getPos.x;dz=pz-getPos.z;d=hyp(dx,dz);
    if(d<.25)return true;
  }
  return d<.25;
}
function angDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function movePlayerBy(wx,wz,dt){
  var remain=14*dt,guard=0;
  while(remain>0&&guard++<24){
    var step=Math.min(remain,.45);
    var p=collideMap(player.x+wx*step,player.z+wz*step,.9);
    player.x=p[0];player.z=p[1];remain-=step;
  }
}
function updatePlayer(dt){
  var typing=isTyping(),ix=0,iz=0;
  if(!typing){
    if(keys.ArrowLeft||keys.KeyA)ix-=1;
    if(keys.ArrowRight||keys.KeyD)ix+=1;
    if(keys.ArrowUp||keys.KeyW)iz+=1;
    if(keys.ArrowDown||keys.KeyS)iz-=1;
  }
  player.moving=false;
  if(ix||iz){
    clearTarget();
    var wx,wz;
    if(viewMode==='follow'){wx=Math.cos(yaw)*ix+Math.sin(yaw)*iz;wz=Math.sin(yaw)*ix-Math.cos(yaw)*iz}
    else{wx=ix;wz=-iz}
    var L=hyp(wx,wz);wx/=L;wz/=L;
    movePlayerBy(wx,wz,dt);
    /* forward input turns the avatar (camera follows); pure back/strafe keeps facing (backpedal) */
    if(iz>0)player.headingTarget=Math.atan2(wx,-wz);
    player.moving=true;player.walkPh+=dt*9;
    if(Math.abs(wx)>.1)player.face=wx>0?1:-1;
  }else if(player.tx!==null){
    var goal=player.wp.length?player.wp[0]:[player.tx,player.tz];
    var arrived=moveToward(dt,goal[0],goal[1],player,function(x,z){player.x=x;player.z=z},14,.9,collideMap);
    player.moving=true;player.walkPh+=dt*9;
    var dxg=goal[0]-player.x,dzg=goal[1]-player.z;
    if(hyp(dxg,dzg)>.3){player.headingTarget=Math.atan2(dxg,-dzg);if(Math.abs(dxg)>.3)player.face=dxg>0?1:-1}
    if(arrived){
      if(player.wp.length){player.wp.shift();player.stuckT=0;player.lastX=player.x;player.lastZ=player.z}
      else clearTarget();
    }else{
      player.stuckT+=dt;
      if(player.stuckT>.55){
        if(hyp(player.x-player.lastX,player.z-player.lastZ)<.12){clearTarget()}
        else{player.lastX=player.x;player.lastZ=player.z;player.stuckT=0}
      }
    }
  }
  if(player.moving){
    player.heading+=angDiff(player.headingTarget,player.heading)*(1-Math.exp(-dt/0.09));
    yawT=player.heading;
  }
  updateZone();
}
function distToRoad(x,z,pts){
  var best=1e9;
  for(var i=0;i<pts.length-1;i++){
    var s=[pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]];
    var dx=s[2]-s[0],dz=s[3]-s[1],L2=dx*dx+dz*dz;
    var t=L2?clamp(((x-s[0])*dx+(z-s[1])*dz)/L2,0,1):0;
    best=Math.min(best,hyp(x-(s[0]+t*dx),z-(s[1]+t*dz)));
  }
  return best;
}
function roadById(id){for(var i=0;i<MAP.roads.length;i++)if(MAP.roads[i].id===id)return MAP.roads[i];return null}
function updateZone(){
  var x=player.x,z=player.z,nz;
  if(inPen(x,z))nz='弄莫湖北岸 · 绵绵牧场羊圈';
  else if(pointInRect(x,z,HOUSE))nz='预留宅地 · 等你建房';
  else if(pointInRect(x,z,TERR))nz='姐勒金塔山 · 山寺';
  else if(hyp((x-LAKE.cx)/LAKE.rx,(z-LAKE.cz)/LAKE.rz)<1.35)nz='弄莫湖畔';
  else if(distToRoad(x,z,roadById('ruili-avenue').points)<8.5)nz='瑞丽大道';
  else if(distToRoad(x,z,roadById('taxia-road').points)<6)nz='塔下路 · 去金塔山';
  else if(hyp(x-0,z-2)<46)nz='瑞丽（勐卯）';
  else nz='瑞丽坝 · 田野';
  if(nz!==zoneName){zoneName=nz;document.getElementById('zone').textContent=nz}
  var onHouse=pointInRect(x,z,HOUSE);
  if(onHouse&&houseToastArmed){houseToastArmed=false;toast('这是给你留的宅地（30×32），房子你来建')}
  if(!onHouse)houseToastArmed=true;
  var eb=document.getElementById('enterBtn');
  if(pointInRect(x,z,TERR,-1))eb.classList.add('show');else eb.classList.remove('show');
}
function isTyping(){
  var a=document.activeElement;
  return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
}
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2400);
}

/* ================= audio — WebAudio synthesis, ported from sansa-temple ================= */
var actx=null,master=null,windGain=null,soundOn=true;
function initAudio(){
  if(actx){if(actx.resume)actx.resume();return}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{actx=new AC()}catch(e){return}
  master=actx.createGain();master.gain.value=soundOn?.9:0;master.connect(actx.destination);
  try{
    var sr=actx.sampleRate;
    var buf=actx.createBuffer(1,sr*5,sr),d=buf.getChannelData(0),last=0;
    for(var i=0;i<d.length;i++){var wv=Math.random()*2-1;last=last*.988+wv*.012;d[i]=last*3.2}
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=540;lp.Q.value=.35;
    var hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;
    windGain=actx.createGain();windGain.gain.value=.05;
    src.connect(lp);lp.connect(hp);hp.connect(windGain);windGain.connect(master);src.start();
    var lfo=actx.createOscillator();lfo.frequency.value=.045;
    var lg=actx.createGain();lg.gain.value=.02;lfo.connect(lg);lg.connect(windGain.gain);lfo.start();
  }catch(e){}
}
function bellTone(mul){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var parts=[[1,.14],[2.02,.075],[2.76,.05],[4.07,.03],[5.43,.018]];
  for(var i=0;i<parts.length;i++){
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(132*parts[i][0],now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(parts[i][1]*(mul||1),now+.02);
    g.gain.exponentialRampToValueAtTime(.0001,now+7/(1+i*.5));
    o.connect(g);g.connect(master);o.start(now);o.stop(now+8);
  }
}
function woodFish(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain(),bp=actx.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(340,now);
  o.frequency.exponentialRampToValueAtTime(180,now+.10);
  bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.2;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.13,now+.005);
  g.gain.exponentialRampToValueAtTime(.0001,now+.22);
  o.connect(bp);bp.connect(g);g.connect(master);
  o.start(now);o.stop(now+.26);
  var sb=actx.createBuffer(1,600,actx.sampleRate),sd=sb.getChannelData(0);
  for(var i=0;i<sd.length;i++)sd[i]=(Math.random()*2-1)*Math.pow(1-i/sd.length,6);
  var ns=actx.createBufferSource();ns.buffer=sb;
  var ng=actx.createGain();ng.gain.value=.10;
  ns.connect(ng);ng.connect(master);ns.start(now);
}
function beadClick(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=1550+Math.random()*260;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.030,now+.004);
  g.gain.exponentialRampToValueAtTime(.0001,now+.075);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+.09);
}
function prayTone(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(523.25,now);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.040,now+.09);
  g.gain.exponentialRampToValueAtTime(.0001,now+1.6);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+1.7);
}

/* ================= temple mode ================= */
var TCOLL={minX:-15.6,maxX:15.6,minZ:-12.2,maxZ:10.6};
var THALL={minX:-11,maxX:11,minZ:-13,maxZ:-6};
var TFISH={minX:5.9,maxX:9.6,minZ:-3.6,maxZ:-.4};
var TBEAD={minX:11.6,maxX:14.4,minZ:1.6,maxZ:4.4};
function collideTemple(x,z,r){
  x=clamp(x,TCOLL.minX+r,TCOLL.maxX-r);
  z=clamp(z,TCOLL.minZ+r,TCOLL.maxZ-r);
  var p=pushRect(x,z,r,THALL);x=p[0];z=p[1];
  p=pushCircle(x,z,r,{x:-8.5,z:0,r:2.3});x=p[0];z=p[1];
  p=pushRect(x,z,r,TFISH);x=p[0];z=p[1];
  p=pushRect(x,z,r,TBEAD);x=p[0];z=p[1];
  return [x,z];
}
function enterTemple(){
  if(mode==='temple')return;
  mode='temple';
  temple.tx=0;temple.tz=7.2;temple.mtx=null;temple.mtz=null;temple.sitting=false;
  document.getElementById('templeBar').classList.add('show');
  document.getElementById('enterBtn').classList.remove('show');
  document.getElementById('hint').textContent='在寺里慢慢走 · 木鱼可以点着敲 · 静坐没有时间限制';
  zoneName='姐勒金塔山 · 山寺';document.getElementById('zone').textContent=zoneName;
  syncTempleUI();
  toast('山寺 · 慢慢来');
}
function exitTemple(){
  if(mode!=='temple')return;
  mode='map';temple.autoFish=false;
  document.getElementById('templeBar').classList.remove('show');
  document.getElementById('autoFishBtn').classList.remove('on');
  document.getElementById('autoFishBtn').textContent='连敲 · 开';
  document.getElementById('hint').textContent='点羊开衣橱 · WASD 朝向走 · 点按移动 · 拖动转视角 · 滚轮缩放';
  player.x=152;player.z=-112;clearTarget();
  viewMode='follow';document.getElementById('viewAll').classList.remove('on');
  player.heading=0;player.headingTarget=0;yaw=0;yawT=0;
  cam.x=player.x;cam.z=player.z;cam.follow=true;
  updateZone();
}
function syncTempleUI(){
  document.getElementById('bowCnt').textContent=(temple.bow%108)+' / 108';
  document.getElementById('beadCnt').textContent=(temple.beads%108)+' / 108';
  var sb=document.getElementById('sitBtn');
  sb.textContent=temple.sitting?'起身':'静坐';
  sb.classList.toggle('on',temple.sitting);
}
function doPray(){
  initAudio();if(mode!=='temple')return;
  temple.prayAnim=1;prayTone();toast('合掌 · 心里安静一下');
}
function doBow(){
  initAudio();if(mode!=='temple')return;
  if(temple.sitting){temple.sitting=false;syncTempleUI()}
  temple.bowAnim=1;temple.bow++;beadClick();syncTempleUI();
  if(temple.bow%108===0){bellTone(1.1);toast('一零八拜 · 圆满')}
}
function doFish(){
  initAudio();if(mode!=='temple')return;
  temple.fishAnim=1;woodFish();
}
function doBeads(){
  initAudio();if(mode!=='temple')return;
  temple.beads++;temple.beadPh+=TAU/12;beadClick();syncTempleUI();
  if(temple.beads%108===0){bellTone(.7);toast('一百零八颗 · 放下')}
}
function doSit(){
  initAudio();if(mode!=='temple')return;
  temple.sitting=!temple.sitting;syncTempleUI();
  if(temple.sitting)toast('静坐 · 想坐多久坐多久');
}
function updateTemple(dt){
  if(temple.fishAnim>0)temple.fishAnim=Math.max(0,temple.fishAnim-dt*3.4);
  if(temple.bowAnim>0)temple.bowAnim=Math.max(0,temple.bowAnim-dt*.62);
  if(temple.prayAnim>0)temple.prayAnim=Math.max(0,temple.prayAnim-dt*.7);
  if(temple.autoFish){
    temple.fishT-=dt;
    if(temple.fishT<=0){temple.fishT=.48;temple.fishAnim=1;woodFish()}
  }
  var vx=0,vz=0;
  if(!isTyping()){
    if(keys.ArrowLeft||keys.KeyA)vx-=1;
    if(keys.ArrowRight||keys.KeyD)vx+=1;
    if(keys.ArrowUp||keys.KeyW)vz-=1;
    if(keys.ArrowDown||keys.KeyS)vz+=1;
  }
  temple.moving=false;
  if(vx||vz){
    temple.mtx=null;
    if(temple.sitting){temple.sitting=false;syncTempleUI()}
    var L=hyp(vx,vz);vx/=L;vz/=L;
    var remain=8.5*dt,guard=0;
    while(remain>0&&guard++<20){
      var step=Math.min(remain,.4);
      var p=collideTemple(temple.tx+vx*step,temple.tz+vz*step,.8);
      temple.tx=p[0];temple.tz=p[1];remain-=step;
    }
    temple.moving=true;temple.walkPh+=dt*8;
    if(Math.abs(vx)>.1)temple.dir=vx>0?1:-1;
  }else if(temple.mtx!==null&&temple.mtx!==undefined){
    var arrived=moveToward(dt,temple.mtx,temple.mtz,temple,function(x,z){temple.tx=x;temple.tz=z},8.5,.8,collideTemple);
    temple.moving=true;temple.walkPh+=dt*8;
    var dxg=temple.mtx-temple.tx;if(Math.abs(dxg)>.3)temple.dir=dxg>0?1:-1;
    if(arrived)temple.mtx=null;
  }
}

/* ================= drawing helpers ================= */
function w2sX(x){return (x-cam.x)*cam.scale+view.w/2}
function w2sY(z){return (z-cam.z)*cam.scale+view.h/2}
function s2wX(px){return (px-view.w/2)/cam.scale+cam.x}
function s2wY(py){return (py-view.h/2)/cam.scale+cam.z}
function anchorX(){return view.w/2}
function anchorY(){return view.h*.65}
function worldToScreen(x,z){
  if(viewMode==='follow'){
    var dx=x-player.x,dz=z-player.z,cY=Math.cos(yaw),sY=Math.sin(yaw);
    var vx=dx*cY+dz*sY,vf=dx*sY-dz*cY;
    return {x:anchorX()+vx*fov.scale,y:anchorY()-vf*fov.scale,vf:vf};
  }
  return {x:w2sX(x),y:w2sY(z),vf:0};
}
function screenToWorld(px,py){
  if(viewMode==='follow'){
    var vx=(px-anchorX())/fov.scale,vf=(anchorY()-py)/fov.scale,cY=Math.cos(yaw),sY=Math.sin(yaw);

  ctx.beginPath();
  ctx.moveTo(-13.4,-10.4);ctx.lineTo(13.4,-10.4);ctx.lineTo(10.6,-13.1);ctx.lineTo(-10.6,-13.1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#54483A';
  ctx.beginPath();ctx.moveTo(-13.4,-10.4);ctx.lineTo(13.4,-10.4);ctx.lineTo(12.2,-11.15);ctx.lineTo(-12.2,-11.15);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#D9A441';ctx.lineWidth=.16;
  ctx.beginPath();ctx.moveTo(-10.6,-13.1);ctx.lineTo(10.6,-13.1);ctx.stroke();
  /* hall plaque */
  ctx.fillStyle='#2E2822';ctx.fillRect(-2.3,-12.35,4.6,1.5);
  ctx.strokeStyle='#D9A441';ctx.lineWidth=.07;ctx.strokeRect(-2.3,-12.35,4.6,1.5);
  ctx.font='700 1.02px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#E9D9AE';ctx.fillText('山 寺',0,-11.28);
  /* stone pagoda (5 tiers) */
  ctx.save();ctx.translate(-8.5,1.8);
  ctx.fillStyle='rgba(60,50,40,.2)';ell(0,.4,2.5,.6);ctx.fill();
  var tw=[3.9,3.15,2.45,1.8,1.2];
  for(var ti=0;ti<5;ti++){
    ctx.fillStyle=ti%2?'#A79E90':'#B5AC9C';
    ctx.fillRect(-tw[ti]/2,-1.1-ti*1.12,tw[ti],1.02);
    ctx.fillStyle='#8A8172';ctx.fillRect(-tw[ti]/2-.28,-1.22-ti*1.12,tw[ti]+.56,.24);
  }
  ctx.fillStyle='#8A8172';ctx.beginPath();ctx.moveTo(0,-7.3);ctx.lineTo(-.42,-5.45);ctx.lineTo(.42,-5.45);ctx.closePath();ctx.fill();
  ctx.restore();
  /* wooden fish table */
  ctx.save();ctx.translate(7.75,0);
  ctx.fillStyle='rgba(60,50,40,.2)';ell(0,1.9,2.3,.5);ctx.fill();
  ctx.fillStyle='#7C5C33';ctx.fillRect(-1.9,.4,3.8,1.15);
  ctx.fillStyle='#654A28';ctx.fillRect(-1.7,1.5,.3,.6);ctx.fillRect(1.4,1.5,.3,.6);
  var fp=temple.fishAnim>0?Math.sin(temple.fishAnim*Math.PI):0;
  ctx.fillStyle='#8A5A34';ell(0,-.4,1.55,1.25);ctx.fill();
  ctx.fillStyle='#A06A3C';ell(-.25,-.6,1.15,.9);ctx.fill();
  ctx.strokeStyle='#5D3D20';ctx.lineWidth=.14;
  ctx.beginPath();ctx.arc(.1,-.55,.62,.3,Math.PI-.3);ctx.stroke();
  ctx.save();ctx.translate(1.15,-1.5);ctx.rotate(-.5-fp*.75);
  ctx.fillStyle='#C9A86A';ctx.fillRect(-.11,0,.22,1.9);
  ctx.fillStyle='#8A5A34';circ(0,0,.26);ctx.fill();
  ctx.restore();
  if(fp>0){
    ctx.strokeStyle='rgba(255,230,170,'+(0.65*fp)+')';ctx.lineWidth=.1;
    circ(0,-.5,1.9+(1-fp)*1.1);ctx.stroke();
  }
  ctx.restore();
  /* bead stand: string of 12 beads, one advances per click */
  ctx.save();ctx.translate(13,3);
  ctx.fillStyle='#7C5C33';ctx.fillRect(-1.15,-1.7,.24,3.6);ctx.fillRect(1.15,-1.7,.24,3.6);
  ctx.fillRect(-1.3,-1.85,2.85,.26);
  for(var bi=0;bi<12;bi++){
    var ba=temple.beadPh+bi*(TAU/12);
    var bx=Math.cos(ba)*1.05,by=Math.sin(ba)*1.3-.1;
    ctx.fillStyle=bi===0?'#C99A44':'#8A5A34';
    circ(bx,by,.27);ctx.fill();
    ctx.fillStyle='rgba(255,240,210,.35)';circ(bx-.08,by-.08,.09);ctx.fill();
  }
  ctx.restore();
  /* stone lanterns */
  [[-13.5,-5],[13.5,-5],[-13.5,5.5],[13.5,5.5]].forEach(function(L){
    ctx.save();ctx.translate(L[0],L[1]);
    ctx.fillStyle='#8A8172';ctx.fillRect(-.28,.1,.56,1.5);
    ctx.fillStyle='#9A917F';ctx.fillRect(-.55,-.75,1.1,.85);
    ctx.fillStyle='#FFD98A';ctx.fillRect(-.34,-.58,.68,.52);
    ctx.fillStyle='#776E5E';ctx.beginPath();ctx.moveTo(-.75,-.75);ctx.lineTo(.75,-.75);ctx.lineTo(0,-1.35);ctx.closePath();ctx.fill();
    ctx.restore();
  });
  /* pines */
  [[-15.8,-9.5],[15.8,-9.5],[15.8,8.6]].forEach(function(T){
    ctx.fillStyle='#5D4A38';ctx.fillRect(T[0]-.16,T[1],.32,2.4);
    ctx.fillStyle='rgba(70,120,66,.95)';circ(T[0],T[1]-.6,1.9);ctx.fill();
    ctx.fillStyle='rgba(96,150,85,.9)';circ(T[0]-1,T[1]-1.4,1.3);ctx.fill();circ(T[0]+1.1,T[1]-1.2,1.2);ctx.fill();
  });
  /* actors */
  var tActors=MONKS.map(function(m){return {z:m.z,f:function(){drawMonk(m)}}});
  tActors.push({z:temple.tz,f:function(){
    var kneelA=temple.bowAnim>0?Math.sin((1-temple.bowAnim)*Math.PI):0;
    drawVillager(temple.tx,temple.tz,temple.dir,
      {walk:temple.moving,walkPh:temple.walkPh,sit:temple.sitting,kneel:kneelA>.25,pray:temple.prayAnim>0});
  }});
  tActors.sort(function(a,b){return a.z-b.z});
  tActors.forEach(function(a){a.f()});
  /* sitting breath light */
  if(temple.sitting){
    var bp=(Math.sin(tNow*1.7)+1)/2;
    var gr2=ctx.createRadialGradient(temple.tx,temple.tz-.4,0,temple.tx,temple.tz-.4,2.6+bp*1.2);
    gr2.addColorStop(0,'rgba(255,220,150,'+(0.10+bp*.13)+')');gr2.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=gr2;circ(temple.tx,temple.tz-.4,3.8);ctx.fill();
  }
  ctx.restore();
  txt3('合掌 · 礼拜 · 木鱼 · 念珠 · 静坐 —— 都不急，慢慢来',view.w/2,view.h-118,14.5,'rgba(243,234,210,.85)','center','400');
}
function txt3(str,x,y,size,color,align,weight){
  ctx.font=(weight||'500')+' '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle=color;ctx.fillText(str,x,y);
}

/* ================= wardrobe panel ================= */
var panel=document.getElementById('panel'),
  nameInput=document.getElementById('nameInput'),
  swWrap=document.getElementById('swWrap'),
  hatWrap=document.getElementById('hatWrap'),
  moodSelect=document.getElementById('moodSelect'),
  storyInput=document.getElementById('storyInput'),
  storyCount=document.getElementById('storyCount'),
  colorName=document.getElementById('colorName');
(function buildPanel(){
  COLORS.forEach(function(c,i){
    var b=document.createElement('button');b.className='sw';b.type='button';
    b.dataset.ci=i;b.title=c.n;b.style.background=c.base;swWrap.appendChild(b);
  });
  HATS.forEach(function(h){
    var b=document.createElement('button');b.className='hat';b.type='button';
    b.dataset.hat=h.key;
    b.innerHTML='<span class="ic">'+h.ic+'</span>'+h.label;hatWrap.appendChild(b);
  });
  MOODS.forEach(function(m,i){
    var op=document.createElement('option');op.value=i;op.textContent=m.name;moodSelect.appendChild(op);
  });
})();
function syncPanel(){
  if(!selected)return;
  document.getElementById('panelName').textContent=selected.name+' 的衣橱';
  nameInput.value=selected.name;
  storyInput.value=selected.story;
  storyCount.textContent=selected.story.length+' / 80';
  moodSelect.value=selected.mood;
  colorName.textContent=COLORS[selected.ci].n;
  for(var i=0;i<swWrap.children.length;i++)
    swWrap.children[i].classList.toggle('on',i===selected.ci);
  for(var j=0;j<hatWrap.children.length;j++)
    hatWrap.children[j].classList.toggle('on',hatWrap.children[j].dataset.hat===selected.hat);
  document.getElementById('panelSaved').textContent='';
}
function selectSheep(sp,open){
  selected=sp;
  if(sp){sp.hopT=1;if(open!==false){panel.classList.add('open');syncPanel()}}
}
function closePanelFn(){panel.classList.remove('open');selected=null}
swWrap.addEventListener('click',function(e){
  var el=e.target.closest('.sw');if(!el||!selected)return;
  selected.ci=+el.dataset.ci;syncPanel();debounceSave();
});
hatWrap.addEventListener('click',function(e){
  var el=e.target.closest('.hat');if(!el||!selected)return;
  selected.hat=el.dataset.hat;syncPanel();debounceSave();
});
nameInput.addEventListener('input',function(){
  if(!selected)return;
  selected.name=nameInput.value.slice(0,6)||'小羊';
  document.getElementById('panelName').textContent=selected.name+' 的衣橱';
  debounceSave();
});
nameInput.addEventListener('change',function(){if(selected&&!nameInput.value)syncPanel()});
storyInput.addEventListener('input',function(){
  if(!selected)return;
  selected.story=storyInput.value.slice(0,80);
  storyCount.textContent=selected.story.length+' / 80';
  debounceSave();
});
moodSelect.addEventListener('change',function(){
  if(!selected)return;
  selected.mood=+moodSelect.value;selected.t=0;selected.state='idle';
  debounceSave();
});
document.getElementById('reroll').addEventListener('click',function(){
  if(!selected)return;
  var pool=STORIES.filter(function(s){return s!==selected.story});
  selected.story=pool[Math.floor(Math.random()*pool.length)];
  storyInput.value=selected.story;
  storyCount.textContent=selected.story.length+' / 80';
  debounceSave();
});
document.getElementById('doneBtn').addEventListener('click',function(){closePanelFn();saveState()});
document.getElementById('closePanel').addEventListener('click',closePanelFn);

/* ================= input ================= */
var ptr={down:false,sx:0,sy:0,moved:false,panning:false,panCamX:0,panCamZ:0,downSheep:null};
function evPos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function hitSheep(wx,wz){
  var best=null,bd=1.9;
  for(var i=sheep.length-1;i>=0;i--){
    var d=hyp(sheep[i].x-wx,sheep[i].z-wz);
    if(d<bd){bd=d;best=sheep[i]}
  }
  return best;
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  var p=evPos(e);
  ptr.down=true;ptr.moved=false;ptr.panning=false;ptr.sx=p.x;ptr.sy=p.y;ptr.lastX=p.x;
  ptr.panCamX=cam.x;ptr.panCamZ=cam.z;ptr.downSheep=null;
  if(mode==='map'){
    var w=screenToWorld(p.x,p.y);
    var sp=hitSheep(w.x,w.z);
    if(sp){ptr.downSheep=sp;dragSheep=null}
  }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!ptr.down)return;
  var p=evPos(e);
  var dx=p.x-ptr.sx,dy=p.y-ptr.sy;
  if(!ptr.moved&&hyp(dx,dy)>6)ptr.moved=true;
  if(ptr.moved){
    if(ptr.downSheep){
      dragSheep=ptr.downSheep;dragSheep.lift=Math.min(1,dragSheep.lift+.12);
      var w=screenToWorld(p.x,p.y);
      dragSheep.x=clamp(w.x,PEN.minX+1.2,PEN.maxX-1.2);
      dragSheep.z=clamp(w.z,PEN.minZ+1.2,PEN.maxZ-1.2);
      if(pointInRect(dragSheep.x,dragSheep.z,SHED_R,-1)){
        dragSheep.x=SHED_R.maxX+1.6;
      }
      dragSheep.tx=dragSheep.x;dragSheep.tz=dragSheep.z;
      dragSheep.state='idle';dragSheep.t=1.2;
    }else if(mode==='map'){
      if(viewMode==='follow'){
        /* drag-look: horizontal drag turns the camera */
        yaw+=(p.x-ptr.lastX)*0.0055;
        yawT=yaw;
      }else{
        ptr.panning=true;cam.follow=false;
        cam.x=ptr.panCamX-dx/cam.scale;
        cam.z=ptr.panCamZ-dy/cam.scale;
      }
    }
  }
  ptr.lastX=p.x;
});
cv.addEventListener('pointerup',function(e){
  var p=evPos(e);
  if(dragSheep){dragSheep.lift=0;dragSheep=null;saveState()}
  if(!ptr.moved){
    if(mode==='map'){
      var w=screenToWorld(p.x,p.y);
      var sp=hitSheep(w.x,w.z);
      if(sp){selectSheep(sp)}
      else{
        if(viewMode==='overview'){
          viewMode='follow';
          document.getElementById('viewAll').classList.remove('on');
        }
        setMoveTarget(w.x,w.z);
      }
    }else{
      /* temple: click fish / beads / ground */
      var tS=tScale,tx2=(p.x-view.w/2)/tS, tz2=(p.y-(view.h/2+10))/tS-1;
      if(hyp(tx2-7.75,tz2-(-.4))<2.1){doFish()}
      else if(hyp(tx2-13,tz2-3)<2.1){doBeads()}
      else{temple.mtx=clamp(tx2,TCOLL.minX+.8,TCOLL.maxX-.8);temple.mtz=clamp(tz2,TCOLL.minZ+.8,TCOLL.maxZ-.8)}
    }
  }
  ptr.down=false;ptr.downSheep=null;ptr.panning=false;
});
cv.addEventListener('pointercancel',function(){
  if(dragSheep){dragSheep.lift=0;dragSheep=null}
  ptr.down=false;ptr.downSheep=null;
});
cv.addEventListener('wheel',function(e){
  if(mode!=='map')return;
  e.preventDefault();
  var f=e.deltaY<0?1.13:0.885;
  if(viewMode==='follow'){
    fov.scale=clamp(fov.scale*f,12,44);
  }else{
    var p=evPos(e),wx=s2wX(p.x),wz=s2wY(p.y);
    cam.scale=clamp(cam.scale*f,.5,16);
    cam.x=wx-(p.x-view.w/2)/cam.scale;
    cam.z=wz-(p.y-view.h/2)/cam.scale;
    cam.follow=false;
  }
},{passive:false});
window.addEventListener('keydown',function(e){
  if(isTyping())return;
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==='Space'&&mode==='temple')doBow();
  if(mode==='map'&&viewMode==='overview'&&
     (e.code==='KeyW'||e.code==='KeyA'||e.code==='KeyS'||e.code==='KeyD'||e.code.indexOf('Arrow')===0)){
    viewMode='follow';
    document.getElementById('viewAll').classList.remove('on');
  }
});
window.addEventListener('keyup',function(e){keys[e.code]=false});
window.addEventListener('blur',function(){keys={}});

/* ================= HUD buttons ================= */
function setHeading(h){player.heading=h;player.headingTarget=h;yaw=h;yawT=h}
function teleport(x,z){
  if(mode==='temple')exitTemple();
  viewMode='follow';
  document.getElementById('viewAll').classList.remove('on');
  player.x=x;player.z=z;clearTarget();
  cam.x=x;cam.z=z;cam.follow=true;
  updateZone();
}
document.getElementById('gotoPen').addEventListener('click',function(){
  teleport(-97,20);setHeading(0);toast('试玩传送 · 到了羊圈门口');
});
document.getElementById('gotoTemple').addEventListener('click',function(){
  teleport(152,-106);setHeading(0);toast('试玩传送 · 到了山寺门前，往北走上台地');
});
document.getElementById('viewAll').addEventListener('click',function(){
  if(mode==='temple')exitTemple();
  if(viewMode==='overview'){
    viewMode='follow';
    this.classList.remove('on');
  }else{
    viewMode='overview';
    cam.scale=Math.min(view.w/1370,view.h/1000);
    cam.x=20;cam.z=-5;cam.follow=false;
    this.classList.add('on');
  }
});
document.getElementById('viewPen').addEventListener('click',function(){
  teleport(-97,20);setHeading(0);
});
document.getElementById('soundBtn').addEventListener('click',function(){
  initAudio();soundOn=!soundOn;
  if(master)master.gain.value=soundOn?.9:0;
  this.textContent=soundOn?'🔊':'🔇';
});
document.getElementById('enterBtn').addEventListener('click',function(){initAudio();enterTemple()});
document.getElementById('templeBar').addEventListener('click',function(e){
  var b=e.target.closest('.act');if(!b)return;
  var a=b.dataset.act;
  if(a==='pray')doPray();
  else if(a==='bow')doBow();
  else if(a==='fish')doFish();
  else if(a==='beads')doBeads();
  else if(a==='sit')doSit();
  else if(a==='exit')exitTemple();
  else if(a==='autofish'){
    initAudio();
    temple.autoFish=!temple.autoFish;temple.fishT=0;
    b.classList.toggle('on',temple.autoFish);
    b.textContent=temple.autoFish?'连敲 · 停':'连敲 · 开';
  }
});

/* ================= resize + main loop ================= */
function resize(){
  view.dpr=Math.min(window.devicePixelRatio||1,2);
  view.w=window.innerWidth;view.h=window.innerHeight;
  cv.width=Math.round(view.w*view.dpr);cv.height=Math.round(view.h*view.dpr);
  cv.style.width=view.w+'px';cv.style.height=view.h+'px';
}
window.addEventListener('resize',resize);
resize();
var lastT=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;tNow+=dt;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  if(mode==='map'){
    updatePlayer(dt);
    updateSheep(dt);
    if(viewMode==='follow'){
      yaw+=angDiff(yawT,yaw)*(1-Math.exp(-dt/0.38));
      cam.x=player.x;cam.z=player.z;
      drawFollow();
    }else{
      if(cam.follow){
        cam.x=lerp(cam.x,player.x,1-Math.pow(.0015,dt));
        cam.z=lerp(cam.z,player.z,1-Math.pow(.0015,dt));
      }
      drawOverview();
    }
  }else{
    updateTemple(dt);
    drawTemple();
  }
  drawCompass();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
updateZone();

/* ================= debug hooks ================= */
window.__game={
  player:player,
  sheep:sheep,
  temple:temple,
  enterTemple:enterTemple,
  exitTemple:exitTemple,
  selectedSheep:function(){return selected},
  selectSheep:function(i){if(sheep[i])selectSheep(sheep[i])},
  setTarget:function(x,z){if(mode==='map')setMoveTarget(x,z)},
  teleport:function(x,z){teleport(x,z)},
  knockFish:doFish,
  doBeads:doBeads,
  doBow:doBow,
  doPray:doPray,
  doSit:doSit,
  cam:cam,
  getYaw:function(){return yaw},
  setYaw:function(r){yaw=r;yawT=r;player.heading=r;player.headingTarget=r},
  getMode:function(){return mode==='temple'?'temple':viewMode},
  worldToScreen:function(x,z){if(mode==='temple')return null;var p=worldToScreen(x,z);return {x:p.x,y:p.y}},
  getState:function(){return {mode:mode==='temple'?'temple':viewMode,zone:zoneName,yaw:yaw,
    player:{x:player.x,z:player.z},
    temple:{bow:temple.bow,beads:temple.beads,sitting:temple.sitting},
    selected:selected?selected.name:null}}
};
