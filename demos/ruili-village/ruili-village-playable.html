/* ===================== 2. 工具 ===================== */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function distSeg(px, pz, a, b) {
  const vx = b[0] - a[0], vz = b[1] - a[1];
  const L2 = vx * vx + vz * vz || 1;
  let t = ((px - a[0]) * vx + (pz - a[1]) * vz) / L2;
  t = clamp(t, 0, 1);
  const dx = px - (a[0] + vx * t), dz = pz - (a[1] + vz * t);
  return { d: Math.hypot(dx, dz), ang: Math.atan2(vz, vx) };
}
function distPolyline(pts, x, z) {
  let best = { d: 1e12, ang: 0 };
  for (let i = 1; i < pts.length; i++) {
    const s = distSeg(x, z, pts[i-1], pts[i]);
    if (s.d < best.d) best = s;
  }
  return best;
}
function pointInPoly(pts, x, z) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function along(pts, frac) {
  let tot = 0; const segs = [];
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segs.push(l); tot += l; }
  let want = tot * frac, acc = 0;
  for (let i = 0; i < segs.length; i++) {
    if (acc + segs[i] >= want) { const t = segs[i] ? (want - acc) / segs[i] : 0;
      return { x: pts[i][0] + (pts[i+1][0]-pts[i][0]) * t, z: pts[i][1] + (pts[i+1][1]-pts[i][1]) * t,
               ang: Math.atan2(pts[i+1][1]-pts[i][1], pts[i+1][0]-pts[i][0]) }; }
    acc += segs[i];
  }
  const p = pts[pts.length - 1]; return { x: p[0], z: p[1], ang: 0 };
}

/* ===================== 3. 世界查询 ===================== */
function lakeNorm(x, z, pad) {
  const w = LAKES[0];
  const dx = (x - w.cx) / (w.rx + (pad || 0)), dz = (z - w.cz) / (w.rz + (pad || 0));
  return dx * dx + dz * dz;
}
function isWater(x, z, pad) {
  pad = pad || 0;
  if (lakeNorm(x, z, pad) < 1) return true;
  for (const r of RIVERS) if (distPolyline(r.points, x, z).d < r.width / 2 + pad) return true;
  return false;
}
function nearRoad(x, z) {
  let best = { d: 1e12, ang: 0 };
  for (const r of ROADS) {
    const s = distPolyline(r.points, x, z);
    const edge = s.d - r.w / 2;
    if (edge < best.d) best = { d: edge, ang: s.ang };
  }
  return best;
}
function zoneWeight(x, z) {           // 0.3 坝田 · 0.6 丘陵 · 1 山地/林地
  let w = 0.3;
  for (const zn of ZONES) {
    if (!pointInPoly(zn.points, x, z)) continue;
    if (zn.type === "山地" || zn.type === "林地") w = Math.max(w, 1);
    else if (zn.type === "丘陵") w = Math.max(w, 0.6);
  }
  return w;
}
const LANDMARK_BLOCK = { "瑞丽（勐卯）":0, "畹町":0, "弄岛":0, "姐告":0 };   // 城镇本身不设禁建圈
function landmarkDist(x, z) {
  let best = 1e12, name = "";
  for (const p of PLACES) {
    if (p.name in LANDMARK_BLOCK) continue;
    const r = SITES.includes(p.name) ? 45 : (p.tier === "主要" ? 95 : 55);
    const d = Math.hypot(p.x - x, p.z - z) - r;
    if (d < best) { best = d; name = p.name; }
  }
  return { d: best, name };
}
function inReserved(x, z, pad) {
  for (const e of ELEMS) {
    const b = e.bounds;
    if (x > b.minX - pad && x < b.maxX + pad && z > b.minZ - pad && z < b.maxZ + pad) return e;
  }
  return null;
}

/* ===================== 4. 光照（同参考） ===================== */
function lightAt(h) {
  const K = [[0,"night"],[4.5,"night"],[7,"dawn"],[10,"noon"],[15.5,"noon"],[18,"dusk"],[20.5,"dusk"],[22,"night"],[24,"night"]];
  let a = K[0], b = K[K.length - 1];
  for (let i = 1; i < K.length; i++) if (h <= K[i][0]) { a = K[i-1]; b = K[i]; break; }
  const t = b[0] === a[0] ? 0 : (h - a[0]) / (b[0] - a[0]);
  const A = THEMES[a[1]], B = THEMES[b[1]];
  const mix = (p, q) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t];
  const mixS = (p, q) => p + (q - p) * t;
  return { light: mix(A.light, B.light), amb: mix(A.amb, B.amb), haze: mix(HAZE[a[1]], HAZE[b[1]]),
           win: mixS(A.win, B.win), shK: mixS(A.shK, B.shK) };
}
function shadeRGB(r, g, b, lit, L) {
  const k = 0.20 + 0.62 * Math.pow(lit, 0.85);
  return "rgb(" +
    clamp(Math.round(r * (L.amb[0] + L.light[0] * k)), 0, 255) + "," +
    clamp(Math.round(g * (L.amb[1] + L.light[1] * k)), 0, 255) + "," +
    clamp(Math.round(b * (L.amb[2] + L.light[2] * k)), 0, 255) + ")";
}
const SH = (rgb, lit, L) => shadeRGB(rgb[0], rgb[1], rgb[2], lit, L);
function groundTint(L) {              // 地面昼夜染色（近似参考的逐格着色）
  return [clamp(L.amb[0] + L.light[0] * 0.82, 0.08, 1),
          clamp(L.amb[1] + L.light[1] * 0.82, 0.08, 1),
          clamp(L.amb[2] + L.light[2] * 0.82, 0.08, 1)];
}

/* ===================== 5. OBB（同参考） ===================== */
function obbCorners(b) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang), hw = b.w / 2, hd = b.d / 2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([u, v]) => [b.x + u * c - v * s, b.z + u * s + v * c]);
}
function obbOverlap(A, B, m) {
  const ca = obbCorners(A), cb = obbCorners(B);
  const axes = [[Math.cos(A.ang), Math.sin(A.ang)], [-Math.sin(A.ang), Math.cos(A.ang)],
                [Math.cos(B.ang), Math.sin(B.ang)], [-Math.sin(B.ang), Math.cos(B.ang)]];
  for (const [ax, ay] of axes) {
    let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
    for (const p of ca) { const d = p[0] * ax + p[1] * ay; if (d < a0) a0 = d; if (d > a1) a1 = d; }
    for (const p of cb) { const d = p[0] * ax + p[1] * ay; if (d < b0) b0 = d; if (d > b1) b1 = d; }
    if (a1 + m < b0 || b1 + m < a0) return false;
  }
  return true;
}
function hitOBB(px, pz, r, b) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang);
  const dx = px - b.x, dz = pz - b.z;
  const u = dx * c + dz * s, v = -dx * s + dz * c;
  const du = Math.max(0, Math.abs(u) - b.w / 2), dv = Math.max(0, Math.abs(v) - b.d / 2);
  return du * du + dv * dv < r * r;
}

  }
  plantCluster(-20, 55, 255, 18, [3, 36], 20261118, "mengmao");   // 勐卯：集市周边成街巷
  plantRing(MARKET_POS.x, MARKET_POS.z, 62, 150, 7, [3, 30], 20261125, "mengmao"); // 集市外圈加密：出生即见镇子
  plantCluster(-150, 130, 85, 4, [3, 55], 20261126, "mengmao");   // 集市西南后巷：江畔道与大沟之间的里弄
  plantCluster(3840, 150, 150, 9, [3, 34], 20261119, "wanding"); // 畹町
  plantCluster(-2400, 272, 130, 7, [3, 30], 20261120, "nongdao"); // 弄岛（江北岸）
  plantCluster(70, 368, 95, 7, [3, 30], 20261121, "jiegao");      // 姐告（江南岸）
  plantCluster(1600, 84, 62, 3, [3, 26], 20261122, "farm1");      // 大道农舍·东
  plantCluster(-1000, 148, 62, 3, [3, 26], 20261123, "farm2");    // 大道农舍·西

  for (const [tcx, tcz, tR, tn] of treeSpots) {

      added++;

  // 树：确定性撒点，密于林地/山地，避水/路/地标/集市/预留地
  const R = mulberry32(445566);
  let tries = 0;
  while (trees.length < 560 && tries < 6000) {
    tries++;
    const x = B.minX + 30 + R() * (B.width - 60), z = B.minZ + 30 + R() * (B.height - 60);
    if (isWater(x, z, 7)) continue;
    if (nearRoad(x, z).d < 7) continue;
    if (Math.hypot(x - MARKET_POS.x, z - MARKET_POS.z) < 100) continue;
    if (Math.hypot(x - SPAWN.x, z - SPAWN.z) < 24) continue;
    if (landmarkDist(x, z).d < 4) continue;
    if (inReserved(x, z, 14)) continue;

/* ===================== 7. 地面瓦片（按纯地图画法烘焙） ===================== */
const TILE = 512, TSC = 2;                       // 512 单位/块，2 px/单位
const tileCache = new Map();
const GRASS_TONES = ["#8fc274", "#79b060", "#a5ce8a", "#9cc47c", "#86bd6d", "#d9d09c"];
const FLOWER_COLS = ["#F2A9C4", "#FFF3DC", "#F7D774", "#C3B2E8", "#F28BA8"];
const ROOFS = ["#c86f50", "#8697b0", "#d0835f", "#77879e", "#c9856a", "#93a5ba"];
const FONT = "\"Yuanti SC\",\"Hiragino Maru Gothic ProN\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif";

function tileKey(ti, tj) { return ti + "," + tj; }
function getTile(ti, tj) {
  const k = tileKey(ti, tj);
  let c = tileCache.get(k);
  if (!c) {
    if (tileCache.size > 22) { const first = tileCache.keys().next().value; tileCache.delete(first); }
    c = bakeTile(ti, tj);
    tileCache.set(k, c);
  }
  return c;
}
function softBlobW(g, x, z, rx, rz, color, a) {
  g.save();

  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, color); gr.addColorStop(1, color);
  g.globalAlpha = a;
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill();
  g.restore(); g.globalAlpha = 1;
}
function bakeTile(ti, tj) {
  const ox = B.minX + ti * TILE, oz = B.minZ + tj * TILE;
  const cv2 = document.createElement("canvas");
  cv2.width = TILE * TSC; cv2.height = TILE * TSC;
  const g = cv2.getContext("2d");
  g.setTransform(TSC, 0, 0, TSC, -ox * TSC, -oz * TSC);
  g.lineCap = "round"; g.lineJoin = "round";
  const inT = (x, z, m) => x > ox - m && x < ox + TILE + m && z > oz - m && z < oz + TILE + m;

  // 底草
  g.fillStyle = "#8ec274"; g.fillRect(ox, oz, TILE, TILE);
  // 地貌分区染色
  for (const zn of ZONES) {
    g.beginPath();
    zn.points.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath();
    if (zn.type === "山地") g.fillStyle = "rgba(103,146,88,0.88)";
    else if (zn.type === "林地") g.fillStyle = "rgba(94,148,82,0.66)";
    else if (zn.type === "丘陵") g.fillStyle = "rgba(170,166,106,0.38)";
    else g.fillStyle = "rgba(246,242,196,0.10)";
    g.fill();
  }
  // 草色斑块（90 单位晶格，跨瓦片连续）
  const lat = 90;
  for (let lx = Math.floor((ox - 130) / lat); lx <= Math.floor((ox + TILE + 130) / lat); lx++) {
    for (let lz = Math.floor((oz - 130) / lat); lz <= Math.floor((oz + TILE + 130) / lat); lz++) {
      const bx = lx * lat + hash2(lx, lz, 11) * 46, bz = lz * lat + hash2(lx, lz, 12) * 46;
      const br = 42 + hash2(lx, lz, 13) * 62;
      softBlobW(g, bx, bz, br, br * 0.7, GRASS_TONES[Math.floor(hash2(lx, lz, 14) * GRASS_TONES.length)], 0.16);
    }
  }
  // 细草色晶格（45 单位，叠出草甸的呼吸感；偶有暖黄）
  const lat2 = 45;
  for (let lx = Math.floor((ox - 60) / lat2); lx <= Math.floor((ox + TILE + 60) / lat2); lx++) {
    for (let lz = Math.floor((oz - 60) / lat2); lz <= Math.floor((oz + TILE + 60) / lat2); lz++) {
      const bx = lx * lat2 + hash2(lx, lz, 31) * 24, bz = lz * lat2 + hash2(lx, lz, 32) * 24;
      const br = 20 + hash2(lx, lz, 33) * 30;
      const warm = hash2(lx, lz, 34) > 0.78;
      softBlobW(g, bx, bz, br, br * 0.72, warm ? "#cfe08a" : GRASS_TONES[Math.floor(hash2(lx, lz, 35) * GRASS_TONES.length)], 0.10);
    }
  }
  // 林地/山地树斑纹理（30 单位晶格）
  for (let lx = Math.floor(ox / 30); lx <= Math.floor((ox + TILE) / 30); lx++) {
    for (let lz = Math.floor(oz / 30); lz <= Math.floor((oz + TILE) / 30); lz++) {

  }
}
/* 水面微光（哈希定点 + 时间相位闪烁；先哈希筛掉九成点，再判水，成本可控） */
function drawWaterGlints(L) {
  const lum = (L.light[0] + L.light[1] + L.light[2]) / 3;
  if (lum < 0.25) return;
  const step = 13;
  const x0 = Math.floor((cam.x - VW / 2 / cam.zoom - 4) / step) * step, x1 = cam.x + VW / 2 / cam.zoom + 4;
  const z0 = Math.floor((cam.z - VH * 0.55 / cam.zoom - 4) / step) * step, z1 = cam.z + VH * 0.45 / cam.zoom + 4;
  ctx.fillStyle = "#ffffff";
  for (let wz = z0; wz < z1; wz += step) {
    for (let wx = x0; wx < x1; wx += step) {
      const gx = Math.round(wx / step), gz = Math.round(wz / step);
      const hv = hash2(gx, gz, 913);
      if (hv < 0.90) continue;
      const px = wx + hash2(gx, gz, 914) * step * 0.8, pz = wz + hash2(gx, gz, 915) * step * 0.8;
      if (!isWater(px, pz, -1)) continue;
      const tw = 0.5 + 0.5 * Math.sin(state.t * 2.2 + hv * 47);
      ctx.globalAlpha = 0.10 + 0.30 * tw * lum;
      ctx.beginPath(); ctx.ellipse(SX(px), SY(pz), Math.max(1.2, cam.zoom * 0.5), Math.max(0.7, cam.zoom * 0.16), 0, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
/* 暗角（按尺寸缓存一张渐变图，每帧贴一次） */
let vigCv = null, vigW = 0, vigH = 0;
function drawVignette() {
  if (!vigCv || vigW !== VW || vigH !== VH) {
    vigW = VW; vigH = VH;
    vigCv = document.createElement("canvas"); vigCv.width = Math.max(2, VW); vigCv.height = Math.max(2, VH);
    const x = vigCv.getContext("2d");
    const gr = x.createRadialGradient(VW / 2, VH * 0.46, Math.min(VW, VH) * 0.42, VW / 2, VH * 0.5, Math.max(VW, VH) * 0.78);
    gr.addColorStop(0, "rgba(26,22,30,0)"); gr.addColorStop(1, "rgba(26,22,30,0.21)");
    x.fillStyle = gr; x.fillRect(0, 0, VW, VH);
  }
  ctx.drawImage(vigCv, 0, 0, VW, VH);
}
function render() {
  const L = lightAt(state.hour);
  const tint = groundTint(L);
  const bright = clamp((tint[0] + tint[1] + tint[2]) / 3, 0.42, 1);
  drawGround();
  // 地面昼夜染色
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgb(" + Math.round(tint[0] * 255) + "," + Math.round(tint[1] * 255) + "," + Math.round(tint[2] * 255) + ")";
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
  drawSurfaceDetail(L);
  drawWaterGlints(L);

  const vx0 = cam.x - VW / 2 / cam.zoom - 70, vx1 = cam.x + VW / 2 / cam.zoom + 70;
  const vz0 = cam.z - VH * 0.55 / cam.zoom - 90, vz1 = cam.z + VH * 0.45 / cam.zoom + 70;
  const inView = (x, z) => x > vx0 && x < vx1 && z > vz0 && z < vz1;
  const list = [];
  for (const t of trees) if (inView(t.x, t.z)) list.push({ y: t.z, f: () => drawTree(t, L, bright) });
  for (const h of houses) if (inView(h.x, h.z)) list.push({ y: h.z, f: () => drawBuilding(h, L, bright) });
  for (const p of pens) if (inView(p.x, p.z)) list.push({ y: p.z, f: () => drawPen(p, L) });
  list.push({ y: market.z, f: () => drawBuilding(market, L, bright) });
  for (const a of animals) if (inView(a.x, a.z)) list.push({ y: a.z, f: () => drawAnimal(a, L) });
  if (horse.owned) {
    if (horse.mounted) list.push({ y: player.z - 0.05, f: () => drawHorse(L) });
    else if (inView(horse.x, horse.z)) list.push({ y: horse.z, f: () => drawHorse(L) });
  }
  list.push({ y: player.z, f: () => drawVillager(L) });
  list.sort((p, q) => p.y - q.y);
  for (const o of list) o.f();

  // 集市名牌已烘焙进地面瓦片，此处不再重复绘制

  drawGhost(L);

  // 远雾（同参考：指数 2.15 径向）
  const cx = VW / 2, cy2 = VH / 2;
  const R0 = Math.min(VW, VH) * 0.16, R1 = Math.hypot(VW, VH) * 0.62;
  const g = ctx.createRadialGradient(cx, cy2, R0, cx, cy2, R1);
  const hz = L.haze;
  for (let i = 0; i <= 8; i++) {
    const t = i / 8;
    const blend = 1 - Math.exp(-Math.pow(t * 3.4, 2.15));
    g.addColorStop(t, "rgba(" + Math.round(hz[0]) + "," + Math.round(hz[1]) + "," + Math.round(hz[2]) + "," + (blend * 0.42).toFixed(3) + ")");
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  drawVignette();
}

/* ===================== 11. 交互 ===================== */
let toastT = 0;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on"); toastT = 2.2;
}
function addGood(k, n) { state.inv[k] = (state.inv[k] || 0) + n; }
function nearestPen() {
  let best = null, bd = 1e9;
  for (const p of pens) {
    const d = Math.hypot(p.x - player.x, p.z - player.z);
    if (d < bd) { bd = d; best = p; }
  }
  return bd < Math.max(14, best ? Math.max(best.w, best.d) * 0.75 : 0) ? best : null;
}
function sellGoods() {
  let sum = 0, n = 0; const parts = [];
  for (const k in state.inv) {
    const c = state.inv[k]; if (!c) continue;
    sum += c * SELL[k]; n += c;
    parts.push(GOOD_NAME[k] + "×" + c);
  }
  if (!n) { toast("货筐是空的"); return false; }
  state.money += sum; state.inv = {};
  toast("卖出 " + parts.join(" ") + "  →  +" + sum + " 安币");
  syncBar(); panelSig = ""; save();
  return true;
}
function interact() {
  // 马优先：骑着时 E 先下马；在马边时 E 先上马（避免与集市卖货/栏舍收取抢键）
  if (horse.owned) {
    if (horse.mounted) { dismountHorse(); return; }
    if (!horse.coming && Math.hypot(horse.x - player.x, horse.z - player.z) < 8) { mountHorse(); return; }
  }
  const md = Math.hypot(market.x - player.x, market.z - player.z);
  if (md < 44) { sellGoods(); return; }
  const pen = nearestPen();
  if (pen) {
    let any = false; const parts = [];
    for (const k in pen.goods) {
      const c = pen.goods[k]; if (!c) continue;
      addGood(k, c); parts.push(GOOD_NAME[k] + "×" + c); pen.goods[k] = 0; any = true;
    }
    toast(any ? "收进筐里：" + parts.join(" ") : "还什么都没产出");
  }
}
function buyAnimal(type) {
  const A = ANIMALS[type];
  if (state.money < A.cost) { toast("安币不够，买" + A.name + "要 " + A.cost + " 安币"); return; }
  const ofKind = pens.filter(p => p.penKind === A.pen);
  if (!ofKind.length) { toast("先盖一座" + (A.pen === "coop" ? "鸡舍" : "围栏")); return; }
  const pen = ofKind.find(p => p.animals.length < p.cap);
  if (!pen) { toast((A.pen === "coop" ? "鸡舍" : "围栏") + "都满了（每座 " + FOOT[A.pen].cap + "）"); return; }
  state.money -= A.cost;
  const c = Math.cos(pen.ang), s = Math.sin(pen.ang);
  const u = (Math.random() - 0.5) * (pen.w - 4), v = (Math.random() - 0.5) * (pen.d - 4);
  const a = { type, pen, x: pen.x + u * c - v * s, z: pen.z + u * s + v * c,
              tx: 0, tz: 0, ang: Math.random() * 6.28, timer: Math.random() * A.rate };
  a.tx = a.x; a.tz = a.z;
  animals.push(a); pen.animals.push(a);
  toast("买了一只" + A.name + "  -" + A.cost + " 安币");
  syncBar();
}

/* ===================== 11b. 马 · 测试金 · 出售建筑 · 集市面板 ===================== */
function buyHorse() {
  if (horse.owned) { toast("你已经有一匹马了"); return; }
  if (state.money < HORSE_PRICE) { toast("安币不够，买马要 " + HORSE_PRICE + " 安币"); return; }
  state.money -= HORSE_PRICE;
  horse.owned = true; horse.mounted = false; horse.coming = false; horse.ang = -Math.PI / 2;
  let placed = false;
  for (const [ox, oz] of [[17, 8], [21, 14], [-19, 16], [24, -4], [13, 20], [-24, -8]]) {
    const x = market.x + ox, z = market.z + oz;
    if (walkable(x, z) && !collideStatic(x, z, 2.2)) { horse.x = x; horse.z = z; placed = true; break; }
  }
  if (!placed) { horse.x = market.x + 17; horse.z = market.z + 8; }
  toast("买了一匹马！它在集市边等你——走到跟前按 E 上马");
  syncBar(); panelSig = ""; save();
}
function mountHorse() {
  horse.mounted = true; horse.coming = false;
  player.x = horse.x; player.z = horse.z; player.ang = horse.ang;
  toast("上马 · 远途就靠它了（E 下马）");
}
function dismountHorse() {
  horse.mounted = false; horse.x = player.x; horse.z = player.z; horse.ang = player.ang;
  const ca = Math.cos(player.ang + Math.PI / 2), sa = Math.sin(player.ang + Math.PI / 2);
  for (const s of [1, -1]) {
    const x = player.x + ca * 4.6 * s, z = player.z + sa * 4.6 * s;
    if (walkable(x, z) && !collideStatic(x, z, player.r)) { player.x = x; player.z = z; break; }
  }
  toast("下马 · 马留在原地，HUD「唤马」可叫它过来");
}
function callHorse() {
  if (!horse.owned || horse.mounted) return;
  if (Math.hypot(horse.x - player.x, horse.z - player.z) < 6) { toast("马儿就在身边"); return; }
  horse.coming = true; horse.comeT = 0; horse.stuckT = 0; horse.lastX = horse.x; horse.lastZ = horse.z;
  toast("唤马 · 它正跑过来");
}
function horseRespawnNear() {           // 唤马被地形卡死时的兜底：直接落到玩家身边空地
  for (const [ox, oz] of [[5, 0], [-5, 0], [0, 5], [0, -5], [4, 4], [-4, 4], [4, -4], [-4, -4]]) {
    const x = player.x + ox, z = player.z + oz;
    if (walkable(x, z) && !collideStatic(x, z, 2.2)) { horse.x = x; horse.z = z; break; }
  }
  horse.coming = false; horse.stuckT = 0; horse.comeT = 0;
  toast("马儿绕不过来，直接跑到了你身边");
}
function updateHorseCome(dt) {
  const dx = player.x - horse.x, dz = player.z - horse.z;
  const d = Math.hypot(dx, dz);
  if (d < 5) { horse.coming = false; toast("马儿跑到你身边了"); return; }
  horse.comeT += dt;
  const step = RIDE_SPD * dt, ux = dx / d, uz = dz / d;
  horse.ang = Math.atan2(uz, ux);
  const nx = horse.x + ux * step, nz = horse.z + uz * step;
  if (walkable(nx, horse.z) && !collideStatic(nx, horse.z, 2.2)) horse.x = nx;
  if (walkable(horse.x, nz) && !collideStatic(horse.x, nz, 2.2)) horse.z = nz;
  if (Math.hypot(horse.x - horse.lastX, horse.z - horse.lastZ) < 0.4) {
    horse.stuckT += dt;
    if (horse.stuckT > 1.2 || horse.comeT > 25) horseRespawnNear();
  } else { horse.stuckT = 0; horse.lastX = horse.x; horse.lastZ = horse.z; }
}
function claimGrant() {
  if (state.testClaimed) { toast("测试金已经领过了（每档一次）"); return; }
  state.testClaimed = true;
  state.money += TEST_GRANT;
  toast("领取测试金 +" + TEST_GRANT.toLocaleString("en-US") + " 安币（测试专用）");
  syncBar(); panelSig = ""; save();
}
/* 出售自建建筑：按买价全额返还（宿主规则：售卖所得全额归卖家，不抽成） */
function sellBuilding(b) {
  const fp = FOOT[b.kind];
  if (b.pen) {
    if (b.animals.length) { toast("栏里还有 " + b.animals.length + " 只牲畜，不能出售"); return; }
    const got = [];
    for (const k in b.goods) {
      if (b.goods[k]) { addGood(k, b.goods[k]); got.push(GOOD_NAME[k] + "×" + b.goods[k]); b.goods[k] = 0; }
    }
    if (got.length) toast("先把栏里的 " + got.join(" ") + " 收进筐里");
    pens.splice(pens.indexOf(b), 1);
  } else {
    houses.splice(houses.indexOf(b), 1);
  }
  state.money += fp.cost;
  toast("出售" + fp.name + "  →  +" + fp.cost + " 安币（全额返还）");
  syncBar(); panelSig = ""; save();
}
/* 集市交易面板（靠近集市时显示；状态签名变化才重建，避免每帧重排 DOM） */
const mpEl = document.getElementById("marketPanel"), mpBody = document.getElementById("mpBody");

/* ===================== 12. 建造 ===================== */
function ghostAt() {
  if (buildSel < 0) { ghost = null; return; }
  const kind = BUILD_ORDER[buildSel];
  const fp = FOOT[kind];
  const info = nearRoad(mouse.wx, mouse.wz);
  const x = Math.round(mouse.wx), z = Math.round(mouse.wz);
  const ang = info.d < 130 ? info.ang : 0;
  ghost = { kind, x, z, ang, w: fp.w, d: fp.d, h: fp.h };
  ghost.err = placeError(ghost);
}
function placeError(b) {
  const fp = FOOT[b.kind];
  if (b.x < B.minX + 30 || b.z < B.minZ + 30 || b.x > B.maxX - 30 || b.z > B.maxZ - 30) return "太靠地图边缘";
  const hw = b.w / 2, hd = b.d / 2, c = Math.cos(b.ang), s = Math.sin(b.ang);
  for (const [u, v] of [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd],[0,0]]) {
    if (isWater(b.x + u * c - v * s, b.z + u * s + v * c, 1)) return "这里是水面";
  }
  if (nearRoad(b.x, b.z).d < 3) return "压到路面了";
  const lm = landmarkDist(b.x, b.z);
  if (lm.d < Math.max(hw, hd) * 0.4) return "离地标太近（" + lm.name + "）";
  if (inReserved(b.x, b.z, 6)) return "这里是预留地（牧场/宅地）";
  for (const h of houses) if (obbOverlap(b, h, 2)) return "和建筑重叠";
  if (obbOverlap(b, market, 2.5)) return "和集市重叠";
  for (const p of pens) if (obbOverlap(b, p, 2)) return "和栏舍重叠";
  for (const t of trees) if (Math.hypot(t.x - b.x, t.z - b.z) < t.r + Math.min(hw, hd) * 0.7) return "树挡着";
  if (state.money < fp.cost) return "安币不够（" + fp.cost + " 安币）";
  return null;
}
function attemptBuild() {
  if (!ghost) return;
  ghost.err = placeError(ghost);          // 实时复核，防止同点重复触发建造
  if (ghost.err) { toast(ghost.err); return; }
  const fp = FOOT[ghost.kind];
  state.money -= fp.cost;
  const b = { kind: ghost.kind, x: ghost.x, z: ghost.z, ang: ghost.ang, w: fp.w, d: fp.d, h: fp.h };
  if (fp.pen) {
    b.pen = true; b.penKind = ghost.kind; b.cap = fp.cap; b.animals = []; b.goods = {};
    pens.push(b);
  } else {
    houses.push(b);
  }
  toast("盖好了：" + fp.name + "  -" + fp.cost + " 安币");
  syncBar();
}

/* ===================== 13. 更新 ===================== */
function walkable(x, z) {
  if (x < B.minX + 6 || z < B.minZ + 6 || x > B.maxX - 6 || z > B.maxZ - 6) return false;
  if (isWater(x, z, -0.5)) return false;
  return true;
}
function collideStatic(x, z, r) {
  for (const h of houses) if (hitOBB(x, z, r, h)) return true;
  if (hitOBB(x, z, r, market)) return true;
  for (const t of trees) {
    if (Math.abs(t.x - x) > 14 || Math.abs(t.z - z) > 14) continue;
    if (Math.hypot(t.x - x, t.z - z) < 2.3 + r) return true;
  }
  return false;
}
let joyVec = { x: 0, z: 0 };
function update(dt) {
  state.t += dt;
  state.hour = (state.hour + dt * 24 / DAY_SEC) % 24;

  let mx = 0, mz = 0;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  if (keys["w"] || keys["arrowup"]) mz -= 1;
  if (keys["s"] || keys["arrowdown"]) mz += 1;
  if (joyVec.x || joyVec.z) { mx += joyVec.x; mz += joyVec.z; }
  player.moving = !!(mx || mz);
  if (player.moving) {
    const L = Math.hypot(mx, mz); mx /= L; mz /= L;
    player.ang = Math.atan2(mz, mx);
    player.face = Math.abs(mz) >= Math.abs(mx) ? (mz < 0 ? "N" : "S") : (mx < 0 ? "W" : "E");
    player.walkPh += dt * (horse.mounted ? 13 : 9);
    const step = (horse.mounted ? RIDE_SPD : player.spd) * dt;
    const prad = horse.mounted ? 2.4 : player.r;
    const nx = player.x + mx * step, nz = player.z + mz * step;
    if (walkable(nx, player.z) && !collideStatic(nx, player.z, prad)) player.x = nx;
    if (walkable(player.x, nz) && !collideStatic(player.x, nz, prad)) player.z = nz;
  }
  const k = 1 - Math.pow(0.0025, dt);
  cam.x += (player.x - cam.x) * k;
  cam.z += (player.z - cam.z) * k;

  if (horse.owned) {
    if (horse.mounted) { horse.x = player.x; horse.z = player.z; horse.ang = player.ang; }
    else if (horse.coming) updateHorseCome(dt);
  }

  const daytime = state.hour > 6 && state.hour < 20;
  for (const a of animals) {
    const A = ANIMALS[a.type];
    const d = Math.hypot(a.tx - a.x, a.tz - a.z);
    if (d < 0.8) {
      const p = a.pen, c = Math.cos(p.ang), s = Math.sin(p.ang);
      const u = (Math.random() - 0.5) * (p.w - 5), v = (Math.random() - 0.5) * (p.d - 5);
      a.tx = p.x + u * c - v * s; a.tz = p.z + u * s + v * c;
    } else {
      const spd = 1.1 + A.r * 0.8;
      const ax = (a.tx - a.x) / d, az = (a.tz - a.z) / d;
      a.x += ax * spd * dt; a.z += az * spd * dt;
      a.ang = Math.atan2(az, ax);
    }
    if (daytime) {
      a.timer += dt;
      if (a.timer >= A.rate) {
        a.timer -= A.rate;
        a.pen.goods[A.good] = (a.pen.goods[A.good] || 0) + 1;
      }
    }
  }
  ghostAt();
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) document.getElementById("toast").classList.remove("on");
  }
  updateHUD();
  tickSave(dt);
}

/* ===================== 14. 输入 ===================== */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.max(1, Math.round(VW * DPR));
  cv.height = Math.max(1, Math.round(VH * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "escape") { buildSel = -1; syncBar(); }
  if (k === "e") interact();
  if (k === "r") { if (confirm("清空本演示存档（ruili-village-v1）并重新开局？")) { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} location.reload(); } }
  if (k >= "1" && k <= "8") {
    const n = parseInt(k, 10) - 1;
    if (n < BUILD_ORDER.length) { buildSel = buildSel === n ? -1 : n; syncBar(); }
    else buyAnimal(ANIMAL_ORDER[n - BUILD_ORDER.length]);
  }
  if (" wasd".includes(k) || k.startsWith("arrow")) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  cam.zoom = clamp(cam.zoom * (e.deltaY > 0 ? 0.9 : 1.111), 1.4, 9);
}, { passive: false });
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wz = w.z;
});
cv.addEventListener("mousedown", e => {
  if (e.button !== 0) { buildSel = -1; syncBar(); return; }
  if (buildSel >= 0) attemptBuild();
});
cv.addEventListener("contextmenu", e => { e.preventDefault(); buildSel = -1; syncBar(); });

/* 触摸：左下摇杆 / 点按放置 / 双指缩放 */
const pointers = new Map();
let joyId = null, joyOrigin = null, pinchD = 0;
const joyEl = document.getElementById("joy"), joyKnob = document.getElementById("joyKnob");
cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    pinchD = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    joyId = null; joyEl.classList.remove("on"); joyVec = { x: 0, z: 0 };
    return;
  }
  if (e.pointerType === "touch") {
    document.body.classList.add("touch");
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x; mouse.wz = w.z;
    if (buildSel >= 0) { ghostAt(); attemptBuild(); return; }
    if (e.clientX < VW * 0.45 && e.clientY > VH * 0.4) {
      joyId = e.pointerId; joyOrigin = { x: e.clientX, y: e.clientY };
      joyEl.style.left = (e.clientX - 56) + "px"; joyEl.style.top = (e.clientY - 56) + "px";
      joyEl.classList.add("on");
      joyKnob.style.transform = "translate(-50%,-50%)";
    }
  }
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (pinchD > 0) cam.zoom = clamp(cam.zoom * d / pinchD, 1.4, 9);
    pinchD = d;
    return;
  }
  if (e.pointerId === joyId && joyOrigin) {
    let dx = e.clientX - joyOrigin.x, dz = e.clientY - joyOrigin.y;
    const L = Math.hypot(dx, dz), max = 46;
    if (L > max) { dx *= max / L; dz *= max / L; }
    joyVec = { x: dx / max, z: dz / max };
    joyKnob.style.transform = "translate(calc(-50% + " + dx + "px), calc(-50% + " + dz + "px))";
  } else if (e.pointerType === "touch" && buildSel >= 0) {
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x; mouse.wz = w.z;
  }
});
function pointerEnd(e) {
  pointers.delete(e.pointerId);
  if (e.pointerId === joyId) { joyId = null; joyOrigin = null; joyVec = { x: 0, z: 0 }; joyEl.classList.remove("on"); }
  if (pointers.size < 2) pinchD = 0;
}
cv.addEventListener("pointerup", pointerEnd);
cv.addEventListener("pointercancel", pointerEnd);
document.getElementById("btnAct").addEventListener("click", () => interact());
document.getElementById("btnZin").addEventListener("click", () => { cam.zoom = clamp(cam.zoom * 1.2, 1.4, 9); });
document.getElementById("btnZout").addEventListener("click", () => { cam.zoom = clamp(cam.zoom / 1.2, 1.4, 9); });

/* ===================== 15. HUD ===================== */
const barEl = document.getElementById("bar");
function syncBar() {
  barEl.innerHTML = "";
  BUILD_ORDER.forEach((k, i) => {
    const fp = FOOT[k];
    const d = document.createElement("div");
    d.className = "slot" + (buildSel === i ? " on" : "") + (state.money < fp.cost ? " off" : "");
    d.innerHTML = '<div class="n">' + fp.name + '</div><div class="c">' + fp.cost + " 安币 · " + (i + 1) + "</div>";
    d.onclick = () => { buildSel = buildSel === i ? -1 : i; syncBar(); };
    barEl.appendChild(d);
  });
  ANIMAL_ORDER.forEach((k, j) => {
    const A = ANIMALS[k];
    const d = document.createElement("div");
    d.className = "slot" + (state.money < A.cost ? " off" : "");
    d.innerHTML = '<div class="n">买' + A.name + '</div><div class="c">' + A.cost + " 安币 · " + (6 + j) + "</div>";
    d.onclick = () => buyAnimal(k);
    barEl.appendChild(d);
  });
}
const compassCv = document.getElementById("compass");
function drawCompass() {
  const g = compassCv.getContext("2d");
  const C = 58; g.clearRect(0, 0, 116, 116);
  g.save(); g.translate(C, C); g.scale(2, 2);
  g.beginPath(); g.arc(0, 0, 27, 0, 6.2832);
  g.fillStyle = "rgba(18,24,20,.72)"; g.fill();
  g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1; g.stroke();
  g.fillStyle = "#e8e4d8"; g.font = "700 9px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("北", 0, -20); g.fillText("南", 0, 20); g.fillText("东", 20, 0); g.fillText("西", -20, 0);
  g.fillStyle = "#e2574c";
  g.beginPath(); g.moveTo(0, -15); g.lineTo(3.4, 0); g.lineTo(-3.4, 0); g.closePath(); g.fill();
  const a = player.ang;                            // 玩家朝向（世界系，北 = -z）
  g.save(); g.rotate(a + Math.PI / 2);
  g.fillStyle = "#f5cf6b";
  g.beginPath(); g.arc(11.5, 0, 2.6, 0, 6.2832); g.fill();
  g.restore();
  g.restore();
}
function updateHUD() {
  const m = document.getElementById("money");
  const mt = "安币 " + Math.round(state.money);
  if (m.textContent !== mt) m.textContent = mt;
  const hh = Math.floor(state.hour), mm = Math.floor((state.hour % 1) * 60);
  const phase = state.hour < 5 ? "深夜" : state.hour < 8 ? "清晨" : state.hour < 17 ? "白天" : state.hour < 20 ? "黄昏" : "夜里";
  document.getElementById("clock").textContent =
    String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + "  " + phase + " · 瑞丽勐卯";
  const parts = [];
  for (const k in state.inv) if (state.inv[k]) parts.push(GOOD_NAME[k] + " " + state.inv[k]);
  document.getElementById("bag").textContent = parts.length ? "货筐：" + parts.join(" · ") : "货筐：空";
  const pr = document.getElementById("prompt");
  let msg = "";
  if (horse.mounted) msg = "E  下马 · 骑行中（22 单位/秒）";
  else if (horse.owned && !horse.coming && Math.hypot(horse.x - player.x, horse.z - player.z) < 8) msg = "E  上马";
  else if (Math.hypot(market.x - player.x, market.z - player.z) < 44) msg = "E  卖出货筐里所有东西 · 右侧面板可买马/领测试金/卖建筑";
  else {
    const p = nearestPen();
    if (p) msg = "E  收取 · " + (p.penKind === "coop" ? "鸡舍" : "围栏") + " " + p.animals.length + "/" + p.cap;
  }
  if (ghost && ghost.err) msg = ghost.err;
  else if (ghost) msg = "点击放置：" + FOOT[ghost.kind].name;
  pr.textContent = msg;
  pr.classList.toggle("on", !!msg);
  document.getElementById("btnHorse").classList.toggle("on", horse.owned && !horse.mounted);
  syncMarketPanel();
  drawCompass();
}

/* ===================== 16. 存档 ===================== */
let saveT = 0;
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, money: state.money, inv: state.inv, hour: state.hour,
      testClaimed: state.testClaimed,
      horse: horse.owned ? { x: horse.x, z: horse.z, ang: horse.ang, mounted: horse.mounted } : null,
      player: { x: player.x, z: player.z },
      houses: houses.filter(h => !h.dressing).map(h => ({ kind: h.kind, x: h.x, z: h.z, ang: h.ang })),
      pens: pens.map(p => ({ kind: p.kind, x: p.x, z: p.z, ang: p.ang, goods: p.goods,
        animals: p.animals.map(a => ({ type: a.type, x: a.x, z: a.z })) }))
    }));
  } catch (_) {}
}
function tickSave(dt) { saveT += dt; if (saveT > 6) { saveT = 0; save(); } }
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (_) {}
  if (!d) return false;
  state.money = d.money ?? START_MONEY;
  state.inv = d.inv || {};
  state.hour = d.hour ?? 7.5;
  state.testClaimed = !!d.testClaimed;                    // 旧档无此字段 → 未领取，可正常领
  if (d.player) { player.x = d.player.x; player.z = d.player.z; }
  if (d.horse) {                                          // 旧档无 horse 字段 → 默认无马
    horse.owned = true;
    horse.x = d.horse.x ?? player.x; horse.z = d.horse.z ?? player.z;
    horse.ang = d.horse.ang ?? -Math.PI / 2;
    horse.mounted = !!d.horse.mounted;
    if (horse.mounted) { horse.x = player.x; horse.z = player.z; }
  }
  for (const h of (d.houses || [])) {
    const fp = FOOT[h.kind]; if (!fp) continue;
    houses.push({ kind: h.kind, x: h.x, z: h.z, ang: h.ang, w: fp.w, d: fp.d, h: fp.h });
  }
  pens = []; animals = [];
  for (const p of (d.pens || [])) {
    const fp = FOOT[p.kind]; if (!fp) continue;
    const np = { kind: p.kind, x: p.x, z: p.z, ang: p.ang, w: fp.w, d: fp.d, h: fp.h,
                 pen: true, penKind: p.kind, cap: fp.cap, goods: p.goods || {}, animals: [] };
    pens.push(np);
    for (const a of (p.animals || [])) {
      const na = { type: a.type, pen: np, x: a.x, z: a.z, tx: a.x, tz: a.z, ang: 0, timer: Math.random() * ANIMALS[a.type].rate };
      np.animals.push(na); animals.push(na);
    }
  }
  return true;
}

/* ===================== 17. 主循环与启动 ===================== */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function boot() {
  resize();
  genWorld();
  const loaded = load();
  if (!loaded) { player.x = SPAWN.x; player.z = SPAWN.z; state.hour = 7.5; state.money = START_MONEY; }
  cam.x = player.x; cam.z = player.z;
  // 预烘焙出生点周边瓦片，避免首帧卡顿
  const ti = Math.floor((player.x - B.minX) / TILE), tj = Math.floor((player.z - B.minZ) / TILE);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) getTile(ti + a, tj + b);
  syncBar();
  updateHUD();
  requestAnimationFrame(t => { last = t; frame(t); });
  setTimeout(() => toast("WASD 走动 · 1-5 选建筑 · 6-8 买牲畜 · 靠近集市按 E 卖货"), 600);
}
boot();

/* 测试/调试钩子（功能同正式逻辑；mature/give 仅 ?test=1 时挂载） */
window.__game = {
  state, player, cam, market, horse,
  get houses() { return houses; }, get pens() { return pens; }, get animals() { return animals; }, get trees() { return trees; },
  screenToWorld, placeError, buyAnimal, interact, setHour(h) { state.hour = h; }, saveNow: save,
  buyHorse, claimGrant, sellBuilding, sellGoods, callHorse, mountHorse, dismountHorse,
  version: "ruili-village-v1"
};
if (/[?&]test=1/.test(location.search)) {
  window.__game.test = {
    mature() { for (const a of animals) a.timer = ANIMALS[a.type].rate; },
    give(n) { state.money += n; },
    teleport(x, z) { player.x = x; player.z = z; cam.x = x; cam.z = z; },
    select(i) { buildSel = i; syncBar(); },
    ghostAt: (x, z) => { mouse.wx = x; mouse.wz = z; ghostAt(); return ghost; },
    build() { attemptBuild(); }
  };
}
</script>
