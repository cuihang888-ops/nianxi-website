<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>瑞丽 · 组装试玩</title>
<style>
  :root{
    --paper:#F3EEE2; --ink:#4C4B40; --muted:#8E8C7B;
    --green:#7FA65C; --green-d:#5F8442; --panel:#FBF8F0; --pline:#C8D7B0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#EFE9D6;color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer}
  /* ---------- top HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:8px 12px;background:rgba(251,248,240,.94);border-bottom:1.5px solid var(--pline);
    box-shadow:0 2px 10px rgba(90,100,60,.08);flex-wrap:wrap}
  #hud .ttl{font-size:17px;font-weight:700;letter-spacing:1px;color:#44543A;white-space:nowrap}
  #zone{font-size:13px;color:#5F7247;background:#EDF3DF;border:1px solid var(--pline);
    border-radius:999px;padding:4px 12px;white-space:nowrap}
  #hud .sp{flex:1}
  .tbtn{font:inherit;font-size:13px;color:#54683F;background:#fff;border:1px solid var(--pline);
    border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
  .tbtn:hover{background:#EDF3DF}
  .tbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  #compass{width:46px;height:46px;flex:none}
  /* ---------- hint / toast ---------- */
  #hint{position:fixed;left:12px;bottom:12px;z-index:25;font-size:12.5px;color:#6B7256;
    background:rgba(251,248,240,.88);border:1px solid var(--pline);border-radius:999px;padding:5px 13px;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:40;
    background:rgba(66,74,52,.92);color:#FBF7EC;font-size:14.5px;border-radius:999px;padding:9px 20px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #saveNote{position:fixed;right:14px;bottom:12px;z-index:25;font-size:12.5px;color:#7A8B62;
    opacity:0;transition:opacity .4s;pointer-events:none}
  #saveNote.show{opacity:1}
  /* ---------- enter temple ---------- */
  #enterBtn{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:35;display:none;
    font:inherit;font-size:17px;font-weight:700;letter-spacing:4px;color:#FBF3DC;cursor:pointer;
    background:linear-gradient(180deg,#8A6D3B,#6F5636);border:1.5px solid #D9BC7A;border-radius:14px;
    padding:12px 42px;box-shadow:0 6px 18px rgba(80,60,20,.35)}
  #enterBtn.show{display:block}
  /* ---------- temple action bar ---------- */
  #templeBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:none;
    align-items:center;gap:8px;background:rgba(43,38,30,.88);border:1px solid rgba(217,188,122,.5);
    border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(30,25,15,.4);max-width:96vw;flex-wrap:wrap;justify-content:center}
  #templeBar.show{display:flex}
  .act{font:inherit;font-size:14.5px;color:#F3EAD2;background:rgba(255,250,235,.08);
    border:1px solid rgba(217,188,122,.45);border-radius:12px;padding:9px 15px;cursor:pointer;white-space:nowrap}
  .act:hover{background:rgba(255,250,235,.18)}
  .act.on{background:#B08A4E;color:#FFF7E2;border-color:#D9BC7A}
  .act .cnt{font-size:12px;color:#D9BC7A;margin-left:5px}
  .act.exit{background:rgba(160,61,49,.25);border-color:rgba(220,140,120,.5)}
  /* ---------- wardrobe panel ---------- */
  #panel{position:fixed;top:60px;right:12px;z-index:45;width:302px;max-width:92vw;
    max-height:calc(100% - 84px);overflow-y:auto;background:var(--panel);
    border:1.5px solid var(--pline);border-radius:20px;box-shadow:0 14px 34px rgba(90,100,60,.22);
    padding:16px 16px 14px;transform:translateX(115%);transition:transform .32s cubic-bezier(.2,.8,.25,1)}
  #panel.open{transform:translateX(0)}
  #panel h2{margin:0;font-size:19px;color:#44543A;letter-spacing:1px}
  #panel .sub{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
  #panel .rowlabel{font-size:12px;color:var(--muted);letter-spacing:2px;margin:13px 0 6px}
  #closePanel{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;border:0;
    background:#F0EBD9;color:#8E8C7B;font-size:16px;cursor:pointer;line-height:1}
  #nameInput{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 11px;outline:none}
  #nameInput:focus{border-color:var(--green)}
  .sws{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(140,130,105,.25);cursor:pointer;position:relative;padding:0}
  .sw.on::after{content:"";position:absolute;inset:-4.5px;border-radius:50%;border:1.5px solid #9BB578}
  #colorName{font-size:13px;color:#6B7256;margin-left:2px}
  .hats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .hat{font:inherit;font-size:12.5px;color:#6B6248;border:1px solid #E7E1D0;background:#FFFDF7;
    border-radius:12px;padding:8px 2px 6px;cursor:pointer;text-align:center}
  .hat .ic{display:block;font-size:17px;line-height:1.25}
  .hat.on{border-color:#9BB578;background:#F0F5E4;box-shadow:inset 0 0 0 1px #9BB578}
  #moodSelect{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 10px;outline:none}
  #storyInput{width:100%;font:inherit;font-size:14px;line-height:1.55;color:var(--ink);background:#FFFDF7;
    border:1px solid #E4DECC;border-radius:10px;padding:8px 11px;outline:none;resize:vertical;min-height:58px}
  #storyInput:focus{border-color:var(--green)}
  .storyfoot{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
  #storyCount{font-size:12px;color:var(--muted)}
  .mini{font:inherit;font-size:12.5px;color:#5F7247;background:#EDF3DF;border:1px solid var(--pline);
    border-radius:999px;padding:4px 12px;cursor:pointer}
  #doneBtn{width:100%;margin-top:15px;font:inherit;font-size:15.5px;font-weight:600;letter-spacing:2px;
    color:#FFFDF4;background:var(--green);border:0;border-radius:12px;padding:11px 0;cursor:pointer}
  #doneBtn:hover{background:var(--green-d)}
  #panelSaved{font-size:12px;color:#93A87B;text-align:center;margin-top:8px;min-height:15px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="ttl">瑞丽 · 组装试玩</div>
  <div id="zone">瑞丽大道</div>
  <canvas id="compass" width="108" height="108" title="北向罗盘"></canvas>
  <div class="sp"></div>
  <button class="tbtn" id="gotoPen" type="button">羊圈 · 试玩传送</button>
  <button class="tbtn" id="gotoTemple" type="button">山寺 · 试玩传送</button>
  <button class="tbtn" id="viewAll" type="button">全图</button>
  <button class="tbtn" id="viewPen" type="button">回到羊圈</button>
  <button class="tbtn" id="soundBtn" type="button" title="声音开关">🔊</button>
</div>

<div id="hint">点羊开衣橱 · WASD 朝向走 · 点按移动 · 拖动转视角 · 滚轮缩放</div>
<div id="toast"></div>
<div id="saveNote">小羊的样子，已经记住</div>
<button id="enterBtn" type="button">进 寺</button>

<div id="templeBar">
  <button class="act" data-act="pray" type="button">合掌</button>
  <button class="act" data-act="bow" type="button">拜佛<span class="cnt" id="bowCnt">0 / 108</span></button>
  <button class="act" data-act="fish" type="button">木鱼</button>
  <button class="act" data-act="autofish" type="button" id="autoFishBtn">连敲 · 开</button>
  <button class="act" data-act="beads" type="button">念珠<span class="cnt" id="beadCnt">0 / 108</span></button>
  <button class="act" data-act="sit" type="button" id="sitBtn">静坐</button>
  <button class="act exit" data-act="exit" type="button">出寺</button>
</div>

<aside id="panel">
  <button id="closePanel" type="button" title="关闭">✕</button>
  <h2 id="panelName">小羊的衣橱</h2>
  <div class="sub">给它换个样子，慢慢来。</div>
  <div class="rowlabel">名字</div>
  <input id="nameInput" maxlength="6" autocomplete="off">
  <div class="rowlabel">毛色 · <span id="colorName"></span></div>
  <div class="sws" id="swWrap"></div>
  <div class="rowlabel">配饰</div>
  <div class="hats" id="hatWrap"></div>
  <div class="rowlabel">性格</div>
  <select id="moodSelect"></select>
  <div class="rowlabel">它的小故事</div>
  <textarea id="storyInput" maxlength="80"></textarea>
  <div class="storyfoot">
    <span id="storyCount">0 / 80</span>
    <button class="mini" id="reroll" type="button">换一句</button>
  </div>
  <button id="doneBtn" type="button">好啦</button>
  <div id="panelSaved"></div>
</aside>

<script>
/* ==== 契约层 NXContent (nianxi-modules/content-registry.js, embedded verbatim) ==== */
/*! 念西 · 内容包契约 / content-registry.js
 * 目的：所有模组共用一套注册、存档命名空间和校验。换地区只换数据包。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NXContent = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SCHEMA = 1;
  const packs = Object.create(null);
  const namespaces = Object.create(null);

  function fail(msg) { throw new Error('[NXContent] ' + msg); }

  /**
   * 注册一个内容包。所有模组都走这里，不允许各自往存档根上塞字段。
   * @param {object} p { id, name, version, saveNs, requires?, data }
   */
  function definePack(p) {
    if (!p || !p.id) fail('缺少 id');
    if (packs[p.id]) fail('重复注册: ' + p.id);
    if (!p.saveNs) p.saveNs = p.id;
    if (namespaces[p.saveNs]) fail('存档命名空间冲突: ' + p.saveNs);
    p.version = p.version || 1;
    p.requires = p.requires || [];
    namespaces[p.saveNs] = p.id;
    packs[p.id] = p;
    return p;
  }

  function get(id) { return packs[id] || null; }
  function list() { return Object.keys(packs).map(function (k) { return packs[k]; }); }

  /** 校验依赖的包是否都在。开发期直接抛，生产期只告警。 */
  function resolve(opts) {
    const strict = !opts || opts.strict !== false;
    const missing = [];
    list().forEach(function (p) {
      p.requires.forEach(function (dep) {
        if (!packs[dep]) missing.push(p.id + ' → ' + dep);
      });
    });
    if (missing.length && strict) fail('依赖缺失: ' + missing.join(', '));
    return missing;
  }

  /* ---------- 存档：根只有一个 mods 对象 ---------- */
  function emptySave() { return { schema: SCHEMA, mods: {} }; }

  function ensureSave(save) {
    const s = save || emptySave();
    if (!s.mods) s.mods = {};
    if (typeof s.schema !== 'number') s.schema = SCHEMA;
    return s;
  }

  /** 取某个包的存档分区，首次访问时初始化为默认值 */
  function ns(save, packId) {
    const p = packs[packId];
    if (!p) fail('未注册的包: ' + packId);
    const s = ensureSave(save);
    if (!s.mods[p.saveNs]) {
      s.mods[p.saveNs] = p.defaults ? JSON.parse(JSON.stringify(p.defaults)) : {};
    }
    return s.mods[p.saveNs];
  }

  /** 迁移：只做增量补默认，绝不删字段、绝不改结构 */
  function migrate(save) {
    const s = ensureSave(save);
    list().forEach(function (p) {
      const cur = s.mods[p.saveNs];
      if (cur == null) { s.mods[p.saveNs] = JSON.parse(JSON.stringify(p.defaults || {})); return; }
      const from = cur.__v || 0;
      if (from < p.version) {
        if (typeof p.migrate === 'function') p.migrate(cur, from, p.version);
        cur.__v = p.version;
      }
    });
    s.schema = SCHEMA;
    return s;
  }

  return {
    SCHEMA: SCHEMA, definePack: definePack, get: get, list: list,
    resolve: resolve, emptySave: emptySave, ensureSave: ensureSave,
    ns: ns, migrate: migrate,
  };
});

</script>
<script>
/* ==== 数据层 NXFlora (nianxi-modules/content-flora.js, embedded verbatim) ==== */
/*! 念西 · 植被与农作模组 / content-flora.js
 * 20 种德宏常见植物，同一份数据既用于地图装饰，也用于种养的作物表。
 */
(function (root) {
  const C = root.NXContent;
  if (!C) throw new Error('先加载 content-registry.js');

  const KX = 0.62, KY = 0.34;   // 必须与 house-modules 一致

  const SPECIES = [
    /* id, 名, 画法, 高, 冠幅, 颜色, 生境, 用途 */
    { id: 'banyan',   name: '大青树', kind: 'banyan',  h: 7.0, w: 6.5, c: '#3E5B34', c2: '#557545', biomes: ['寨内', '寺院', '路边'], note: '独树成林，气根垂地' },
    { id: 'bamboo',   name: '凤尾竹', kind: 'clump',   h: 6.0, w: 3.2, c: '#4C6B36', c2: '#6C8C48', biomes: ['寨内', '水边', '路边'], note: '傣家竹楼的材料' },
    { id: 'rubber',   name: '橡胶树', kind: 'rowTree', h: 8.5, w: 4.0, c: '#2E4A32', c2: '#436A46', biomes: ['山地', '坝区'], note: '成排割胶，破晓前作业', row: true },
    { id: 'banana',   name: '芭蕉',   kind: 'banana',  h: 3.2, w: 2.6, c: '#4E7A38', c2: '#79A24A', biomes: ['寨内', '水边'], crop: { item: '芭蕉', yield: 3, days: 40, season: ['雨'] } },
    { id: 'areca',    name: '槟榔',   kind: 'palm',    h: 7.5, w: 2.2, c: '#5A6E38', c2: '#7A9048', biomes: ['寨内'], note: '嚼槟榔的老习惯' },
    { id: 'mango',    name: '芒果',   kind: 'canopy',  h: 4.6, w: 4.4, c: '#3E6034', c2: '#5E8442', biomes: ['寨内', '坝区'], crop: { item: '芒果', yield: 5, days: 90, season: ['干'] } },
    { id: 'jackfruit',name: '菠萝蜜', kind: 'canopy',  h: 5.2, w: 4.8, c: '#33542E', c2: '#4E7439', biomes: ['寨内'], crop: { item: '菠萝蜜', yield: 4, days: 120, season: ['雨'] } },
    { id: 'teak',     name: '柚木',   kind: 'canopy',  h: 9.0, w: 5.0, c: '#4A5E2E', c2: '#6C8440', biomes: ['山地'], note: '落叶，干季光枝' },
    { id: 'tea',      name: '茶',     kind: 'shrub',   h: 1.1, w: 1.6, c: '#37562E', c2: '#527A3C', biomes: ['山地'], crop: { item: '茶叶', yield: 2, days: 30, season: ['雨', '干'] } },
    { id: 'coffee',   name: '咖啡',   kind: 'shrub',   h: 1.9, w: 1.5, c: '#37562E', c2: '#A8402F', biomes: ['山地'], crop: { item: '咖啡豆', yield: 3, days: 60, season: ['干'] } },
    { id: 'rice',     name: '水稻',   kind: 'field',   h: 0.9, w: 3.0, c: '#7E9A3A', c2: '#C0B24E', biomes: ['坝区', '水边'], crop: { item: '稻谷', yield: 8, days: 110, season: ['雨'] } },
    { id: 'sugarcane',name: '甘蔗',   kind: 'cane',    h: 2.8, w: 3.4, c: '#6E8A3A', c2: '#93A84E', biomes: ['坝区'], crop: { item: '甘蔗', yield: 6, days: 240, season: ['干'] } },
    { id: 'dragon',   name: '火龙果', kind: 'post',    h: 1.8, w: 0.9, c: '#4A6B3C', c2: '#C0403A', biomes: ['山地', '坝区'], crop: { item: '火龙果', yield: 4, days: 45, season: ['雨'] } },
    { id: 'dendrobium', name: '石斛', kind: 'epiphyte',h: 0.8, w: 0.7, c: '#5A7A3E', c2: '#C8B24E', biomes: ['山地'], crop: { item: '石斛', yield: 1, days: 150, season: ['雨', '干'] } },
    { id: 'bougain',  name: '三角梅', kind: 'shrub',   h: 2.2, w: 2.2, c: '#3E6034', c2: '#C0507A', biomes: ['寨内', '路边'], note: '几乎全年开' },
    { id: 'lotus',    name: '睡莲',   kind: 'water',   h: 0.35, w: 1.4, c: '#4E7A44', c2: '#E0A0B8', biomes: ['水边'] },
    { id: 'fern',     name: '野蕨',   kind: 'fern',    h: 0.9, w: 1.3, c: '#3E6B34', c2: '#5E8C42', biomes: ['山地', '水边'] },
    { id: 'bodhi',    name: '菩提树', kind: 'banyan',  h: 8.0, w: 7.0, c: '#44603A', c2: '#5E7C4A', biomes: ['寺院'], note: '寺院必有' },
    { id: 'talipot',  name: '贝叶棕', kind: 'palms',   h: 9.5, w: 4.2, c: '#4E6B3A', c2: '#6E8C48', biomes: ['寺院'], note: '贝叶经的叶子' },
    { id: 'kapok',    name: '木棉',   kind: 'canopy',  h: 8.0, w: 4.6, c: '#4A4A30', c2: '#B8443A', biomes: ['路边', '坝区'], note: '干季先花后叶' },
  ];

  const MAP = {};
  SPECIES.forEach(function (s) { MAP[s.id] = s; });

  const BIOMES = ['寨内', '坝区', '山地', '水边', '路边', '寺院'];

  function byBiome(b) { return SPECIES.filter(function (s) { return s.biomes.indexOf(b) >= 0; }); }
  function crops() { return SPECIES.filter(function (s) { return !!s.crop; }); }

  function hash32(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }

  function drawFlora(ctx, spec, o) {
    const sp = typeof spec === 'string' ? MAP[spec] : spec;
    if (!sp) return;
    const s = o.s || 20;
    const wind = o.wind || 0;
    const sway = Math.sin((o.t || 0) * 1.6 + ((o.x || 0) * 0.01)) * wind * 0.06;
    const rnd = (hash32(sp.id + (o.seed || '')) % 1000) / 1000;

    ctx.save();
    ctx.translate(o.x || 0, o.y || 0);
    ctx.scale(s, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    const H = sp.h * (0.85 + rnd * 0.3);
    const W = sp.w * (0.9 + rnd * 0.2);

    // 地面阴影
    ctx.save(); ctx.globalAlpha *= 0.15;
    ctx.beginPath(); ctx.ellipse ? ctx.ellipse(0, 0, W * 0.42, W * 0.16, 0, 0, Math.PI * 2)
      : ctx.arc(0, 0, W * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = '#2A2012'; ctx.fill(); ctx.restore();

    const K = sp.kind;
    if (K === 'banyan') {
      ctx.strokeStyle = '#5A4A34'; ctx.lineWidth = W * 0.13;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(sway * 8, -H * 0.5, sway * 16, -H * 0.72); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * (1.12 + i * 0.19), r = W * (0.34 + (i % 2) * 0.10);
        ctx.beginPath();
        ctx.ellipse ? ctx.ellipse(Math.cos(a) * W * 0.3 + sway * 14, -H * 0.74 + Math.sin(a) * H * 0.10, r, H * 0.13, 0, 0, Math.PI * 2)
          : ctx.arc(Math.cos(a) * W * 0.3, -H * 0.74, r, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 ? sp.c : sp.c2; ctx.fill();
      }
      // 气根
      ctx.strokeStyle = 'rgba(120,98,70,0.55)'; ctx.lineWidth = W * 0.018;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath(); ctx.moveTo(i * W * 0.11, -H * 0.62);
        ctx.quadraticCurveTo(i * W * 0.13 + sway * 4, -H * 0.3, i * W * 0.14, 0); ctx.stroke();
      }
    } else if (K === 'clump' || K === 'cane' || K === 'field') {
      const n = K === 'field' ? 9 : 6;

var FENCES=[
  [PEN.minX,PEN.minZ,PEN.maxX,PEN.minZ],[PEN.minX,PEN.maxZ,PEN.maxX,PEN.maxZ],
  [PEN.minX,PEN.minZ,PEN.minX,PEN.maxZ],
  [PEN.maxX,PEN.minZ,PEN.maxX,PEN.gateZ0],[PEN.maxX,PEN.gateZ1,PEN.maxX,PEN.maxZ]];
function pushSeg(x,z,r,s){
  var dx=s[2]-s[0],dz=s[3]-s[1],L2=dx*dx+dz*dz;
  var t=L2?clamp(((x-s[0])*dx+(z-s[1])*dz)/L2,0,1):0;
  var cx=s[0]+t*dx,cz=s[1]+t*dz,ox=x-cx,oz=z-cz,d=hyp(ox,oz);
  if(d<r){
    if(d<1e-4){ox=-dz;oz=dx;d=hyp(ox,oz)||1}
    x=cx+ox/d*r; z=cz+oz/d*r;
  }
  return [x,z];
}
function pushRect(x,z,r,R){
  var cx=clamp(x,R.minX,R.maxX),cz=clamp(z,R.minZ,R.maxZ);
  var ox=x-cx,oz=z-cz,d=hyp(ox,oz);
  if(d<r){
    if(d<1e-4){
      var dl=x-R.minX,dr=R.maxX-x,dt=z-R.minZ,db=R.maxZ-z,m=Math.min(dl,dr,dt,db);
      if(m===dl)x=R.minX-r;else if(m===dr)x=R.maxX+r;else if(m===dt)z=R.minZ-r;else z=R.maxZ+r;
    }else{x=cx+ox/d*r;z=cz+oz/d*r}
  }
  return [x,z];
}
function pushCircle(x,z,r,c){
  var ox=x-c.x,oz=z-c.z,d=hyp(ox,oz),rr=r+c.r;
  if(d<rr){if(d<1e-4){ox=1;oz=0;d=1}x=c.x+ox/d*rr;z=c.z+oz/d*rr}
  return [x,z];
}
function pushLake(x,z,r){
  var ex=(x-LAKE.cx)/(LAKE.rx+r),ez=(z-LAKE.cz)/(LAKE.rz+r),q=ex*ex+ez*ez;
  if(q<1){var s=1/Math.sqrt(q||1e-6);x=LAKE.cx+ex*s*(LAKE.rx+r);z=LAKE.cz+ez*s*(LAKE.rz+r)}
  return [x,z];
}
function collideMap(x,z,r){
  x=clamp(x,MAP.bounds.minX+r,MAP.bounds.maxX-r);
  z=clamp(z,MAP.bounds.minZ+r,MAP.bounds.maxZ-r);
  var p=pushLake(x,z,r);x=p[0];z=p[1];
  for(var i=0;i<FENCES.length;i++){p=pushSeg(x,z,r,FENCES[i]);x=p[0];z=p[1]}
  p=pushRect(x,z,r,SHED_R);x=p[0];z=p[1];
  p=pushRect(x,z,r,HALL_R);x=p[0];z=p[1];
  p=pushRect(x,z,r,BELL_R);x=p[0];z=p[1];
  p=pushCircle(x,z,r,PAGODA);x=p[0];z=p[1];
  p=pushCircle(x,z,r,TROUGH_W);x=p[0];z=p[1];
  p=pushCircle(x,z,r,TROUGH_F);x=p[0];z=p[1];
  p=pushCircle(x,z,r,HAY);x=p[0];z=p[1];
  return [x,z];
}
function inPen(x,z,m){
  m=m||0;
  return x>PEN.minX+m&&x<PEN.maxX-m&&z>PEN.minZ+m&&z<PEN.maxZ-m;
}
function pointInRect(x,z,R,m){m=m||0;return x>R.minX+m&&x<R.maxX-m&&z>R.minZ+m&&z<R.maxZ-m}

/* ================= sheep behaviour (mood drives it) ================= */
function sheepTargetOK(x,z){
  if(!inPen(x,z,1.7))return false;
  if(pointInRect(x,z,SHED_R,-1.4))return false;
  if(hyp(x-TROUGH_W.x,z-TROUGH_W.z)<3)return false;
  if(hyp(x-TROUGH_F.x,z-TROUGH_F.z)<3)return false;
  if(hyp(x-HAY.x,z-HAY.z)<3.4)return false;
  return true;
}
function startWander(sp){
  var m=MOODS[sp.mood],rad=m.rad*2.3;
  for(var a=0;a<12;a++){
    var ang=Math.random()*TAU,r=.4+Math.random()*rad;
    var nx=sp.x+Math.cos(ang)*r,nz=sp.z+Math.sin(ang)*r;
    if(!sheepTargetOK(nx,nz))continue;
    sp.tx=nx;sp.tz=nz;sp.state='walk';sp.t=8;return;
  }
  sp.state='idle';sp.t=1+Math.random()*1.6;
}
function updateSheep(dt){
  for(var i=0;i<sheep.length;i++){
    var sp=sheep[i];
    if(dragSheep===sp){sp.bob+=dt*2;continue}
    sp.t-=dt;
    if(sp.hopT>0)sp.hopT=Math.max(0,sp.hopT-dt*1.4);
    if(sp.state==='walk'){
      var dx=sp.tx-sp.x,dz=sp.tz-sp.z,d=hyp(dx,dz);
      var spd=MOODS[sp.mood].speed*2.6;
      if(d<.15||sp.t<=0){
        if(d<1.2&&Math.random()<.45){sp.state='graze';sp.t=1.4+Math.random()*1.8}
        else{sp.state='idle';var im=MOODS[sp.mood].idle;sp.t=im[0]+Math.random()*(im[1]-im[0])}
      }else{
        var step=Math.min(d,spd*dt);
        sp.x+=dx/d*step;sp.z+=dz/d*step;
        if(Math.abs(dx)>.05)sp.dir=dx>0?1:-1;
        sp.bob+=dt*6.5;
      }
    }else if(sp.state==='graze'){
      sp.grazeDip=Math.min(1,sp.grazeDip+dt*3);
      sp.bob+=dt*1.1;
      if(sp.t<=0){sp.state='idle';var im2=MOODS[sp.mood].idle;sp.t=(im2[0]+Math.random()*(im2[1]-im2[0]))*.7}
    }else{ /* idle */
      sp.grazeDip=Math.max(0,sp.grazeDip-dt*3);
      sp.bob+=dt*1.25;
      if(sp.t<=0)startWander(sp);
    }
    /* hard containment: fence is a wall for sheep too */
    var p=[sp.x,sp.z];
    for(var f=0;f<FENCES.length;f++)p=pushSeg(p[0],p[1],1.05,FENCES[f]);
    p=pushRect(p[0],p[1],1.05,SHED_R);
    p=pushCircle(p[0],p[1],1.0,TROUGH_W);
    p=pushCircle(p[0],p[1],1.0,TROUGH_F);
    p=pushCircle(p[0],p[1],1.0,HAY);
    sp.x=clamp(p[0],PEN.minX+1.05,PEN.maxX-1.05);
    sp.z=clamp(p[1],PEN.minZ+1.05,PEN.maxZ-1.05);
  }
  /* gentle separation so they don't stack */
  for(var a=0;a<sheep.length;a++)for(var b=a+1;b<sheep.length;b++){
    var A=sheep[a],B=sheep[b],ox=B.x-A.x,oz=B.z-A.z,d=hyp(ox,oz);
    if(d>0.01&&d<1.7){var push=(1.7-d)/2;A.x-=ox/d*push;A.z-=oz/d*push;B.x+=ox/d*push;B.z+=oz/d*push}
  }
  for(var k=0;k<sheep.length;k++){
    sheep[k].x=clamp(sheep[k].x,PEN.minX+1.05,PEN.maxX-1.05);
    sheep[k].z=clamp(sheep[k].z,PEN.minZ+1.05,PEN.maxZ-1.05);
  }
}

/* ================= player movement ================= */
function setMoveTarget(x,z){
  player.wp.length=0;
  var pin=inPen(player.x,player.z),tin=inPen(x,z);
  if(pin!==tin){
    if(pin){player.wp.push([PEN.maxX-3,PEN.cz])}
    player.wp.push([PEN.maxX+2.8,PEN.cz]);
    if(!pin){player.wp.push([PEN.maxX-3,PEN.cz])}
  }
  player.tx=x;player.tz=z;player.stuckT=0;player.lastX=player.x;player.lastZ=player.z;
}
function clearTarget(){player.tx=null;player.tz=null;player.wp.length=0}
function moveToward(dt,px,pz,getPos,setPos,speed,radius,collideFn){
  var dx=px-getPos.x,dz=pz-getPos.z,d=hyp(dx,dz);
  if(d<.25)return true;
  var remain=speed*dt,guard=0;
  while(remain>0&&guard++<24){
    var step=Math.min(remain,d,.45);
    var nx=getPos.x+dx/d*step,nz=getPos.z+dz/d*step;
    var p=collideFn(nx,nz,radius);
    setPos(p[0],p[1]);
    remain-=step;
    dx=px-getPos.x;dz=pz-getPos.z;d=hyp(dx,dz);
    if(d<.25)return true;
  }
  return d<.25;
}
function angDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function movePlayerBy(wx,wz,dt){
  var remain=14*dt,guard=0;
  while(remain>0&&guard++<24){
    var step=Math.min(remain,.45);
    var p=collideMap(player.x+wx*step,player.z+wz*step,.9);
    player.x=p[0];player.z=p[1];remain-=step;
  }
}
function updatePlayer(dt){
  var typing=isTyping(),ix=0,iz=0;
  if(!typing){
    if(keys.ArrowLeft||keys.KeyA)ix-=1;
    if(keys.ArrowRight||keys.KeyD)ix+=1;
    if(keys.ArrowUp||keys.KeyW)iz+=1;
    if(keys.ArrowDown||keys.KeyS)iz-=1;
  }
  player.moving=false;
  if(ix||iz){
    clearTarget();
    var wx,wz;
    if(viewMode==='follow'){wx=Math.cos(yaw)*ix+Math.sin(yaw)*iz;wz=Math.sin(yaw)*ix-Math.cos(yaw)*iz}
    else{wx=ix;wz=-iz}
    var L=hyp(wx,wz);wx/=L;wz/=L;
    movePlayerBy(wx,wz,dt);
    /* forward input turns the avatar (camera follows); pure back/strafe keeps facing (backpedal) */
    if(iz>0)player.headingTarget=Math.atan2(wx,-wz);
    player.moving=true;player.walkPh+=dt*9;
    if(Math.abs(wx)>.1)player.face=wx>0?1:-1;
  }else if(player.tx!==null){
    var goal=player.wp.length?player.wp[0]:[player.tx,player.tz];
    var arrived=moveToward(dt,goal[0],goal[1],player,function(x,z){player.x=x;player.z=z},14,.9,collideMap);
    player.moving=true;player.walkPh+=dt*9;
    var dxg=goal[0]-player.x,dzg=goal[1]-player.z;
    if(hyp(dxg,dzg)>.3){player.headingTarget=Math.atan2(dxg,-dzg);if(Math.abs(dxg)>.3)player.face=dxg>0?1:-1}
    if(arrived){
      if(player.wp.length){player.wp.shift();player.stuckT=0;player.lastX=player.x;player.lastZ=player.z}
      else clearTarget();
    }else{
      player.stuckT+=dt;
      if(player.stuckT>.55){
        if(hyp(player.x-player.lastX,player.z-player.lastZ)<.12){clearTarget()}
        else{player.lastX=player.x;player.lastZ=player.z;player.stuckT=0}
      }
    }
  }
  if(player.moving){
    player.heading+=angDiff(player.headingTarget,player.heading)*(1-Math.exp(-dt/0.09));
    yawT=player.heading;
  }
  updateZone();
}
function distToRoad(x,z,pts){
  var best=1e9;
  for(var i=0;i<pts.length-1;i++){
    var s=[pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]];
    var dx=s[2]-s[0],dz=s[3]-s[1],L2=dx*dx+dz*dz;
    var t=L2?clamp(((x-s[0])*dx+(z-s[1])*dz)/L2,0,1):0;
    best=Math.min(best,hyp(x-(s[0]+t*dx),z-(s[1]+t*dz)));
  }
  return best;
}
function roadById(id){for(var i=0;i<MAP.roads.length;i++)if(MAP.roads[i].id===id)return MAP.roads[i];return null}
function updateZone(){
  var x=player.x,z=player.z,nz;
  if(inPen(x,z))nz='弄莫湖北岸 · 绵绵牧场羊圈';
  else if(pointInRect(x,z,HOUSE))nz='预留宅地 · 等你建房';

/* ================= audio — WebAudio synthesis, ported from sansa-temple ================= */
var actx=null,master=null,windGain=null,soundOn=true;
function initAudio(){
  if(actx){if(actx.resume)actx.resume();return}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{actx=new AC()}catch(e){return}
  master=actx.createGain();master.gain.value=soundOn?.9:0;master.connect(actx.destination);
  try{
    var sr=actx.sampleRate;
    var buf=actx.createBuffer(1,sr*5,sr),d=buf.getChannelData(0),last=0;
    for(var i=0;i<d.length;i++){var wv=Math.random()*2-1;last=last*.988+wv*.012;d[i]=last*3.2}
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=540;lp.Q.value=.35;
    var hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;
    windGain=actx.createGain();windGain.gain.value=.05;
    src.connect(lp);lp.connect(hp);hp.connect(windGain);windGain.connect(master);src.start();
    var lfo=actx.createOscillator();lfo.frequency.value=.045;
    var lg=actx.createGain();lg.gain.value=.02;lfo.connect(lg);lg.connect(windGain.gain);lfo.start();
  }catch(e){}
}
function bellTone(mul){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var parts=[[1,.14],[2.02,.075],[2.76,.05],[4.07,.03],[5.43,.018]];
  for(var i=0;i<parts.length;i++){
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(132*parts[i][0],now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(parts[i][1]*(mul||1),now+.02);
    g.gain.exponentialRampToValueAtTime(.0001,now+7/(1+i*.5));
    o.connect(g);g.connect(master);o.start(now);o.stop(now+8);
  }
}
function woodFish(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain(),bp=actx.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(340,now);
  o.frequency.exponentialRampToValueAtTime(180,now+.10);
  bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.2;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.13,now+.005);
  g.gain.exponentialRampToValueAtTime(.0001,now+.22);
  o.connect(bp);bp.connect(g);g.connect(master);
  o.start(now);o.stop(now+.26);
  var sb=actx.createBuffer(1,600,actx.sampleRate),sd=sb.getChannelData(0);
  for(var i=0;i<sd.length;i++)sd[i]=(Math.random()*2-1)*Math.pow(1-i/sd.length,6);
  var ns=actx.createBufferSource();ns.buffer=sb;
  var ng=actx.createGain();ng.gain.value=.10;
  ns.connect(ng);ng.connect(master);ns.start(now);
}
function beadClick(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=1550+Math.random()*260;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.030,now+.004);
  g.gain.exponentialRampToValueAtTime(.0001,now+.075);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+.09);
}
function prayTone(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(523.25,now);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.040,now+.09);
  g.gain.exponentialRampToValueAtTime(.0001,now+1.6);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+1.7);
}
/* chime + birdCall — ported verbatim from the Sansa demo; they are
   the temple's ambient layers (the wind loop already runs globally,
   as in the original). Scheduled only while inside the temple and
   stopped cleanly on exit. */
function chime(){
  if(!actx||!soundOn)return;
  var scale=[587.33,659.25,783.99,880,987.77,1174.66];
  var f=scale[(Math.random()*scale.length)|0];
  var now=actx.currentTime;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.026,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+1.9);
  o.connect(g);g.connect(master);o.start(now);o.stop(now+2);
}
function birdCall(){
  if(!actx||!soundOn)return;
  var now=actx.currentTime;
  var n=2+((Math.random()*3)|0);
  for(var i=0;i<n;i++){
    var t=now+i*(.12+Math.random()*.09);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';
    var base=2100+Math.random()*1100;
    o.frequency.setValueAtTime(base,t);
    o.frequency.exponentialRampToValueAtTime(base*1.3,t+.05);
    o.frequency.exponentialRampToValueAtTime(base*.82,t+.13);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.020,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.19);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.24);
  }
}
var ambTimers=[];
function startAmbience(){
  stopAmbience();
  temple.ambience=true;
  ambTimers.push(setTimeout(function(){if(mode==='temple')chime()},700));
  ambTimers.push(setInterval(function(){if(mode==='temple'&&soundOn&&Math.random()<.45)chime()},7000));
  ambTimers.push(setInterval(function(){if(mode==='temple'&&soundOn)birdCall()},11000+Math.random()*7000));
}
function stopAmbience(){
  temple.ambience=false;
  for(var i=0;i<ambTimers.length;i++){clearInterval(ambTimers[i]);clearTimeout(ambTimers[i])}
  ambTimers=[];
}

/* ================= temple mode ================= */
var TCOLL={minX:-15.6,maxX:15.6,minZ:-12.2,maxZ:10.6};
var THALL={minX:-11,maxX:11,minZ:-13,maxZ:-6};
var TFISH={minX:5.9,maxX:9.6,minZ:-3.6,maxZ:-.4};
var TBEAD={minX:11.6,maxX:14.4,minZ:1.6,maxZ:4.4};
function collideTemple(x,z,r){
  x=clamp(x,TCOLL.minX+r,TCOLL.maxX-r);
  z=clamp(z,TCOLL.minZ+r,TCOLL.maxZ-r);
  var p=pushRect(x,z,r,THALL);x=p[0];z=p[1];
  p=pushCircle(x,z,r,{x:-8.5,z:0,r:2.3});x=p[0];z=p[1];
  p=pushRect(x,z,r,TFISH);x=p[0];z=p[1];
  p=pushRect(x,z,r,TBEAD);x=p[0];z=p[1];
  return [x,z];
}
function enterTemple(){
  if(mode==='temple')return;
  initAudio();
  mode='temple';
  startAmbience();
  temple.tx=0;temple.tz=7.2;temple.mtx=null;temple.mtz=null;temple.sitting=false;
  document.getElementById('templeBar').classList.add('show');
  document.getElementById('enterBtn').classList.remove('show');
  document.getElementById('hint').textContent='在寺里慢慢走 · 木鱼可以点着敲 · 静坐没有时间限制';

function updateTemple(dt){
  if(temple.fishAnim>0)temple.fishAnim=Math.max(0,temple.fishAnim-dt*3.4);
  if(temple.bowAnim>0)temple.bowAnim=Math.max(0,temple.bowAnim-dt*.62);
  if(temple.prayAnim>0)temple.prayAnim=Math.max(0,temple.prayAnim-dt*.7);
  if(temple.autoFish){
    temple.fishT-=dt;
    if(temple.fishT<=0){temple.fishT=.48;temple.fishAnim=1;temple.fishCount++;woodFish()}
  }
  var vx=0,vz=0;
  if(!isTyping()){
    if(keys.ArrowLeft||keys.KeyA)vx-=1;
    if(keys.ArrowRight||keys.KeyD)vx+=1;
    if(keys.ArrowUp||keys.KeyW)vz-=1;
    if(keys.ArrowDown||keys.KeyS)vz+=1;
  }
  temple.moving=false;
  if(vx||vz){
    temple.mtx=null;
    if(temple.sitting){temple.sitting=false;syncTempleUI()}
    var L=hyp(vx,vz);vx/=L;vz/=L;
    var remain=8.5*dt,guard=0;
    while(remain>0&&guard++<20){
      var step=Math.min(remain,.4);
      var p=collideTemple(temple.tx+vx*step,temple.tz+vz*step,.8);
      temple.tx=p[0];temple.tz=p[1];remain-=step;
    }
    temple.moving=true;temple.walkPh+=dt*8;
    if(Math.abs(vx)>.1)temple.dir=vx>0?1:-1;
  }else if(temple.mtx!==null&&temple.mtx!==undefined){
    var arrived=moveToward(dt,temple.mtx,temple.mtz,temple,function(x,z){temple.tx=x;temple.tz=z},8.5,.8,collideTemple);
    temple.moving=true;temple.walkPh+=dt*8;
    var dxg=temple.mtx-temple.tx;if(Math.abs(dxg)>.3)temple.dir=dxg>0?1:-1;
    if(arrived)temple.mtx=null;
  }
  for(var wi=0;wi<WMONKS.length;wi++){
    var wm=WMONKS[wi];
    if(wm.pause>0){wm.pause-=dt;wm.moving=false;continue}
    var tgt=wm.to?wm.b:wm.a;
    var cur=wm.axis==='z'?wm.z:wm.x,d=tgt-cur;
    if(Math.abs(d)<.12){wm.to=!wm.to;wm.pause=1.6+(wi%3)*.9;wm.moving=false}
    else{
      var stp=(d>0?1:-1)*wm.speed*dt;
      if(wm.axis==='z'){wm.z+=stp;wm.face=stp>0?1:-1}
      else{wm.x+=stp;wm.face=stp>0?2:-2}
      wm.walkPh+=dt*6.5*wm.speed;wm.moving=true;
    }
  }
}

/* ================= drawing helpers ================= */
function w2sX(x){return (x-cam.x)*cam.scale+view.w/2}
function w2sY(z){return (z-cam.z)*cam.scale+view.h/2}
function s2wX(px){return (px-view.w/2)/cam.scale+cam.x}
function s2wY(py){return (py-view.h/2)/cam.scale+cam.z}
function anchorX(){return view.w/2}
function anchorY(){return view.h*.65}
function worldToScreen(x,z){
  if(viewMode==='follow'){
    var dx=x-player.x,dz=z-player.z,cY=Math.cos(yaw),sY=Math.sin(yaw);
    var vx=dx*cY+dz*sY,vf=dx*sY-dz*cY;
    return {x:anchorX()+vx*fov.scale,y:anchorY()-vf*fov.scale,vf:vf};
  }
  return {x:w2sX(x),y:w2sY(z),vf:0};
}
function screenToWorld(px,py){
  if(viewMode==='follow'){
    var vx=(px-anchorX())/fov.scale,vf=(anchorY()-py)/fov.scale,cY=Math.cos(yaw),sY=Math.sin(yaw);
    return {x:player.x+vx*cY+vf*sY, z:player.z+vx*sY-vf*cY};
  }
  return {x:s2wX(px),z:s2wY(py)};
}
function smoothPath(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length-1;i++){
    var mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
  }
  ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
}
function ell(x,z,rx,rz){ctx.beginPath();ctx.ellipse(x,z,rx,rz,0,0,TAU)}
function circ(x,z,r){ctx.beginPath();ctx.arc(x,z,r,0,TAU)}
function rrect(x,z,w,d,r){
  ctx.beginPath();
  ctx.moveTo(x+r,z);ctx.lineTo(x+w-r,z);ctx.quadraticCurveTo(x+w,z,x+w,z+r);
  ctx.lineTo(x+w,z+d-r);ctx.quadraticCurveTo(x+w,z+d,x+w-r,z+d);
  ctx.lineTo(x+r,z+d);ctx.quadraticCurveTo(x,z+d,x,z+d-r);
  ctx.lineTo(x,z+r);ctx.quadraticCurveTo(x,z,x+r,z);ctx.closePath();
}
/* villager: cute round body, hair bun, hemp tunic. pose: {walk,sit,kneel,pray,breath,face} */
function drawVillager(x,z,face,pose){
  var bob=pose.walk?Math.abs(Math.sin(pose.walkPh))*.16:0;
  var lift=pose.sit?.34:(pose.kneel?.3:0);
  ctx.save();ctx.translate(x,z-bob*.3);
  /* shadow */
  var shv=makeShadowSpriteP();
  ctx.globalAlpha=.9;ctx.drawImage(shv,-.95,.52,1.9,.8);ctx.globalAlpha=1;
  ctx.translate(0,lift*.35);
  var bs=pose.sit?1+Math.sin(tNow*1.7)*.028:1; /* breathing while sitting */
  /* legs */
  if(pose.sit){
    ctx.fillStyle='#6E5B43';ell(0,.78,.52,.2);ctx.fill();
  }else if(!pose.kneel){
    ctx.fillStyle='#6E5B43';
    var sw=pose.walk?Math.sin(pose.walkPh)*.16:0;
    rrect(-.3+sw*.4,.5,.2,.45,.07);ctx.fill();
    rrect(.1-sw*.4,.5,.2,.45,.07);ctx.fill();
  }
  ctx.save();ctx.scale(bs,1);
  /* tunic body */
  ctx.fillStyle='#B7A06A';
  ctx.beginPath();
  ctx.moveTo(-.52,.62);ctx.lineTo(.52,.62);ctx.lineTo(.36,-.28);ctx.lineTo(-.36,-.28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#A68F58';ctx.fillRect(-.42,.18,.84,.09); /* belt */
  ctx.fillStyle='#8A6D3B';ctx.fillRect(-.06,.14,.12,.17);
  /* arms */
  ctx.fillStyle='#F2C9A4';
  if(pose.pray){
    circ(-.1,-.02,.11);ctx.fill();circ(.1,-.02,.11);ctx.fill();
  }else{
    var asw=pose.walk?Math.sin(pose.walkPh)*.14:0;
    circ(-.58,.08+asw,.115);ctx.fill();circ(.58,.08-asw,.115);ctx.fill();
  }
  ctx.restore();
  /* head */
  var hy=-.62-(pose.kneel?.1:0)+(pose.pray?.07:0);
  ctx.fillStyle='#F2C9A4';circ(0,hy,.335);ctx.fill();
  ctx.fillStyle='#3A3230';
  ctx.beginPath();ctx.arc(0,hy-.03,.335,Math.PI*1.08,Math.PI*1.92);ctx.fill(); /* hair cap */
  circ(0,hy-.42,.14);ctx.fill(); /* bun */
  ctx.fillStyle='#3A3230';
  circ(-.11*1,hy+.02,.032);ctx.fill();circ(.11,hy+.02,.032);ctx.fill(); /* eyes */
  ctx.fillStyle='rgba(240,140,130,.5)';
  circ(-.19,hy+.11,.055);ctx.fill();circ(.19,hy+.11,.055);ctx.fill();
  ctx.restore();
}
/* sheep: drawn from the ported pre-rendered sprites (cached per
   wool colour × accessory × facing × variant). The sprite itself is
   static, so bob / hop / graze are done by placement: a gentle
   breathing bob, the hop arc lifts it, grazing tips it forward a
   touch around the feet, being carried lifts it and shrinks its
   soft shadow. Ground shadow is the reference's shadow sprite. */
function drawSheepSprite(sp){
  var sc=sp.sc||1;
  var img=makeSheepSpriteP(sp.ci,sp.hat,sp.dir<0,sp.id%3);
  var D=3.3*sc;
  var hop=sp.hopT>0?Math.sin(sp.hopT*Math.PI)*1.0:0;
  var liftY=(sp.lift||0)*1.6+hop;
  var bobY=Math.sin(sp.bob)*0.045;
  var sh=makeShadowSpriteP();
  ctx.save();
  ctx.globalAlpha=0.85-0.35*(sp.lift||0);
  var sw2=2.7*sc*(1-0.18*(sp.lift||0)),sh2=1.05*sc*(1-0.18*(sp.lift||0));
  ctx.drawImage(sh,-sw2/2,0.52-sh2/2,sw2,sh2);
  ctx.restore();
  ctx.save();
  ctx.translate(0,0.55-liftY+bobY);
  if(sp.grazeDip>0.02)ctx.rotate(sp.dir*sp.grazeDip*0.13);
  if((sp.lift||0)>0.05)ctx.rotate(Math.sin(tNow*9+sp.id)*0.035);
  ctx.drawImage(img,-D/2,-D,D,D);
  ctx.restore();
}
function drawSheep(sp){
  ctx.save();ctx.translate(sp.x,sp.z);
  drawSheepSprite(sp);
  ctx.restore();
  if(selected===sp){
    ctx.save();ctx.strokeStyle='rgba(95,132,66,.9)';ctx.lineWidth=3.5/curScale;
    ctx.setLineDash([9/curScale,7/curScale]);
    circ(sp.x,sp.z+.05,1.6);ctx.stroke();ctx.restore();
  }
}
/* ================================================================
   PORTED RENDERING — 绵绵牧场 (user-supplied reference file).
   The sprite makers, noise helpers and terrain colour logic below are
   ported from mianmian-pasture-reference.html (helpers rnd/hash2/
   noise2/fbm, makeSheepSprite with its clustered-wool + gradient
   shading, drawHat, makeTreeSprite, makeBushSprite, makeFlowerSprite,
   makeShadowSprite, terrainColor). Names are P-prefixed only to avoid
   colliding with this file's own helpers; the drawing code itself is
   the reference's, adapted at the call sites to this game's
   coordinates (pen rectangle in game units instead of the island).
   ================================================================ */
function pRnd(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function pSmooth(t){return t*t*(3-2*t)}
function pHash2(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
function pNoise2(x,y){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  var a=pHash2(xi,yi),b=pHash2(xi+1,yi),c=pHash2(xi,yi+1),d=pHash2(xi+1,yi+1);
  var u=pSmooth(xf),v=pSmooth(yf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function pFbm(x,y){

   pen's dirt-path distance (dp) darkening. */
function pTerrainColor(x,z,dp){
  var n=pFbm(x*.40+5.5,z*.40-2.2);
  var r=lerp(124,166,n),gc=lerp(178,205,n),b=lerp(84,112,n);
  var warm=Math.max(0,pFbm(x*.30-9,z*.30+4)-.54)*2.4;
  r+=warm*30;gc+=warm*16;b-=warm*12;
  if(dp<1.9){var dk=(1.9-dp)/1.9*.16;r-=30*dk;gc-=18*dk;b-=6*dk}
  var sh=.84+.26*pFbm(x*.13-4,z*.13+7);
  r*=sh;gc*=sh;b*=sh;

function penPathPts(){
  return [[PEN.maxX,PEN.cz],[PEN.cx+4,PEN.cz-2.5],[PEN.cx-5,PEN.cz-7.5],
    [(SHED_R.minX+SHED_R.maxX)/2,(SHED_R.minZ+SHED_R.maxZ)/2]];
}
function pDistToPath(x,z){
  var pts=penPathPts();
  var best=1e9;
  for(var i=0;i<pts.length-1;i++){
    var ax=pts[i][0],az=pts[i][1],bx=pts[i+1][0],bz=pts[i+1][1];
    var dx=bx-ax,dz=bz-az,L2=dx*dx+dz*dz;
    var t=L2?((x-ax)*dx+(z-az)*dz)/L2:0;t=clamp(t,0,1);

}
/* baked pen ground: noise-varied grass in the reference's palette,
   the worn dirt path gate→shed, flower/tuft scatter at the
   reference's density (its island fits ~520 flowers in a 22.6 span;
   scaled to this 30×32 pen), soft darker edge inside the fence. */
var penBake=null;
function bakePenGround(){
  if(penBake)return penBake;
  var PX=22,cv=document.createElement('canvas');
  cv.width=(PEN.maxX-PEN.minX)*PX;cv.height=(PEN.maxZ-PEN.minZ)*PX;
  var g=cv.getContext('2d');
  var cell=.55;
  for(var wz=PEN.minZ;wz<PEN.maxZ;wz+=cell){
    for(var wx=PEN.minX;wx<PEN.maxX;wx+=cell){
      g.fillStyle=pTerrainColor(wx+cell/2,wz+cell/2,pDistToPath(wx+cell/2,wz+cell/2));
      g.fillRect((wx-PEN.minX)*PX,(wz-PEN.minZ)*PX,cell*PX+1.5,cell*PX+1.5);
    }
  }
  /* dirt path ribbon, drawn like the reference's trail */

  function pathStroke(wd,style){
    g.strokeStyle=style;g.lineWidth=wd*PX;g.lineCap='round';g.lineJoin='round';
    g.beginPath();
    for(var i=0;i<pts.length;i++){
      var X=(pts[i][0]-PEN.minX)*PX,Y=(pts[i][1]-PEN.minZ)*PX;
      if(i===0)g.moveTo(X,Y);else g.lineTo(X,Y);
    }
    g.stroke();
  }
  pathStroke(2.5,'rgba(178,148,94,0.55)');
  pathStroke(1.8,'#DCC292');
  pathStroke(1.0,'#E4CEA3');
  var R=pRnd(4477);
  g.fillStyle='rgba(150,124,84,0.5)';
  for(var p=0;p<46;p++){
    var t=R(),seg=Math.min(2,(t*3)|0),ft=t*3-seg;
    var ax=pts[seg][0],az=pts[seg][1];
    var px2=ax+(pts[seg+1][0]-ax)*ft+(R()-.5)*1.7;
    var pz2=az+(pts[seg+1][1]-az)*ft+(R()-.5)*1.7;
    g.beginPath();g.ellipse((px2-PEN.minX)*PX,(pz2-PEN.minZ)*PX,(1.2+R()*2.2),(0.8+R()*1.4),R()*3,0,TAU);g.fill();
  }
  /* flower + tuft scatter, kept off the path / shed / troughs / hay */
  function clearOf(x,z){
    if(pDistToPath(x,z)<1.15)return false;
    if(x>SHED_R.minX-1&&x<SHED_R.maxX+1&&z>SHED_R.minZ-1&&z<SHED_R.maxZ+1)return false;
    if(hyp(x-TROUGH_W.x,z-TROUGH_W.z)<2.4)return false;
    if(hyp(x-TROUGH_F.x,z-TROUGH_F.z)<2.2)return false;
    if(hyp(x-HAY.x,z-HAY.z)<3)return false;
    return true;
  }
  for(var f=0;f<460;f++){
    var fx=PEN.minX+.8+R()*(PEN.maxX-PEN.minX-1.6);
    var fz=PEN.minZ+.8+R()*(PEN.maxZ-PEN.minZ-1.6);

    var fs=.5*PX;
    g.drawImage(makeFlowerSpriteP(f%5),(fx-PEN.minX)*PX-fs/2,(fz-PEN.minZ)*PX-fs/2,fs,fs);
  }
  for(var tf=0;tf<190;tf++){
    var tx2=PEN.minX+.6+R()*(PEN.maxX-PEN.minX-1.2);
    var tz2=PEN.minZ+.6+R()*(PEN.maxZ-PEN.minZ-1.2);

    g.moveTo(X2-2.2,Y2);g.lineTo(X2-4.4,Y2-s2*.72);

}

function drawWater(Rv){

function drawRoads(Rv){

/* ================= world fill (2026-11-17, geography x4) =================
   Zone-textured ground baked into lazy tiles for the follow view, plus a
   seeded scatter layer (trees / rocks / tufts / reeds) and a small scenery
   hint at every named place, so the countryside reads as a place. */
function pointInPoly(x,z,pts){
  var inside=false;
  for(var i=0,j=pts.length-1;i<pts.length;j=i++){
    var xi=pts[i][0],zi=pts[i][1],xj=pts[j][0],zj=pts[j][1];
    if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))inside=!inside;
  }
  return inside;
}
function zoneTypeAt(x,z){ /* last containing zone wins, matching paint order */
  var t=null;
  for(var i=0;i<MAP.terrainZones.length;i++){
    var zn=MAP.terrainZones[i];
    if(zn.shape==='polygon'){if(pointInPoly(x,z,zn.points))t=zn.type}
    else{var dx=(x-zn.cx)/zn.rx,dz=(z-zn.cz)/zn.rz;if(dx*dx+dz*dz<1)t=zn.type}
  }
  return t;
}
function riverDist(x,z){ /* signed: centreline distance minus half width */
  var best=1e9;
  for(var i=0;i<MAP.rivers.length;i++){
    var d=distToRoad(x,z,MAP.rivers[i].points)-MAP.rivers[i].width/2;
    if(d<best)best=d;
  }
  return best;
}
function lakeDist(x,z){
  var dx=(x-LAKE.cx)/LAKE.rx,dz=(z-LAKE.cz)/LAKE.rz;
  return (Math.sqrt(dx*dx+dz*dz)-1)*130;
}
function waterDist(x,z){return Math.min(riverDist(x,z),lakeDist(x,z))}

var TILE=200,TILEPX=2.5,tileCache={},tileOrder=[];
function groundColor(x,z){
  var t=zoneTypeAt(x,z),n=pFbm(x*.05+5.5,z*.05-2.2)*.78+pFbm(x*.17-3.1,z*.17+6.7)*.22,r,gc,b;
  if(t==='林地'){r=lerp(88,118,n);gc=lerp(128,158,n);b=lerp(62,84,n)}
  else if(t==='山地'){
    var e=pFbm(x*.012+31,z*.012-17),band=.92+.16*Math.abs(Math.sin(e*22));
    r=lerp(126,158,n)*band;gc=lerp(140,168,n)*band;b=lerp(96,118,n)*band;
  }else if(t==='丘陵'){
    r=lerp(160,190,n);gc=lerp(186,212,n);b=lerp(110,134,n);
    var w2=Math.max(0,pFbm(x*.02-3,z*.02+9)-.55)*1.8;r+=w2*22;gc+=w2*10;
  }else{
    r=lerp(140,180,n);gc=lerp(190,216,n);b=lerp(98,126,n);
    if(pFbm(x*.008-21,z*.008+13)>.58){r-=14;gc-=6;b+=4}
    var warm=Math.max(0,pFbm(x*.06-9,z*.06+4)-.54)*2.4;
    r+=warm*30;gc+=warm*16;b-=warm*12;
    var sh=.9+.18*pFbm(x*.05-4,z*.05+7);r*=sh;gc*=sh;b*=sh;
  }
  var wd=waterDist(x,z);
  if(wd<9){
    var sm=clamp((9-wd)/9,0,1)*.75;
    r=lerp(r,216,sm);gc=lerp(gc,199,sm);b=lerp(b,154,sm);
    if(wd<2){r=lerp(r,196,.35);gc=lerp(gc,178,.35);b=lerp(b,132,.35)}
  }
  return 'rgb('+(r|0)+','+(gc|0)+','+(b|0)+')';
}
function groundTile(tx,tz){
  var key=tx+','+tz;
  if(tileCache[key])return tileCache[key];
  var c2=document.createElement('canvas');c2.width=TILE*TILEPX;c2.height=TILE*TILEPX;
  var g=c2.getContext('2d'),cell=2.0,steps=Math.round(TILE/cell);
  var x0=MAP.bounds.minX+tx*TILE,z0=MAP.bounds.minZ+tz*TILE;
  for(var j=0;j<steps;j++)for(var i=0;i<steps;i++){
    var wx=x0+i*cell+cell/2,wz=z0+j*cell+cell/2;
    g.fillStyle=groundColor(wx,wz);
    g.fillRect(i*cell*TILEPX,j*cell*TILEPX,cell*TILEPX+1.2,cell*TILEPX+1.2);
  }
  /* storybook sprinkle: tiny flowers on meadow cells, grass ticks elsewhere */
  var FCOL=['#F6C6D9','#FFFFFF','#F9E08A','#CDBCE8','#F5A8B8'];
  for(var j2=0;j2<steps;j2++)for(var i2=0;i2<steps;i2++){
    var cx2=x0+i2*cell+cell/2,cz2=z0+j2*cell+cell/2;
    if(waterDist(cx2,cz2)<1.5)continue;
    var hh=Math.sin(cx2*127.1+cz2*311.7)*43758.5453;hh-=Math.floor(hh);
    var zt=zoneTypeAt(cx2,cz2),meadow=(zt===null||zt==='坝子平原'||zt==='丘陵');
    if(meadow&&hh<.42){
      var nf=hh<.14?2:1;
      for(var f=0;f<nf;f++){
        var fh=Math.sin((cx2+f*7.3)*311.7+(cz2-f*3.1)*127.1)*43758.5453;fh-=Math.floor(fh);
        g.fillStyle=FCOL[Math.floor(fh*FCOL.length)%FCOL.length];
        g.beginPath();g.arc((i2*cell+fh*cell)*TILEPX,(j2*cell+((fh*7)%1)*cell)*TILEPX,.34*TILEPX,0,TAU);g.fill();
      }
    }else if(hh>.82){
      g.strokeStyle='rgba(84,128,58,0.5)';g.lineWidth=1;
      var gx=(i2*cell+cell*.3)*TILEPX,gy=(j2*cell+cell*.75)*TILEPX;
      g.beginPath();g.moveTo(gx,gy);g.lineTo(gx-1.4,gy-3.4);g.moveTo(gx+1.6,gy);g.lineTo(gx+2.6,gy-3);g.stroke();
    }
  }
  tileCache[key]=c2;tileOrder.push(key);
  if(tileOrder.length>56){delete tileCache[tileOrder.shift()]}
  return c2;
}
function drawGroundTiles(Rv){
  ctx.fillStyle='#E3EFC9';
  ctx.fillRect(MAP.bounds.minX,MAP.bounds.minZ,MAP.bounds.width,MAP.bounds.height);
  var tx0=Math.floor((player.x-Rv-MAP.bounds.minX)/TILE),tx1=Math.floor((player.x+Rv-MAP.bounds.minX)/TILE);
  var tz0=Math.floor((player.z-Rv-MAP.bounds.minZ)/TILE),tz1=Math.floor((player.z+Rv-MAP.bounds.minZ)/TILE);
  for(var tz=tz0;tz<=tz1;tz++)for(var tx=tx0;tx<=tx1;tx++){
    var gx=MAP.bounds.minX+tx*TILE,gz=MAP.bounds.minZ+tz*TILE;
    if(gx>MAP.bounds.maxX||gz>MAP.bounds.maxZ||gx+TILE<MAP.bounds.minX||gz+TILE<MAP.bounds.minZ)continue;
    ctx.drawImage(groundTile(tx,tz),gx,gz,TILE,TILE);
  }

/* ---- seeded scatter: deterministic, kept off water / roads / implants ---- */
var SC={trees:[],rocks:[],tufts:[],reeds:[],falls:[],pools:[],planks:[]};
(function buildScatter(){
  var R=pRnd(20261117);
  function ok(x,z,roadGap,waterGap){
    if(x<MAP.bounds.minX+12||x>MAP.bounds.maxX-12||z<MAP.bounds.minZ+12||z>MAP.bounds.maxZ-12)return false;
    var qx=(x-LAKE.cx)/LAKE.rx,qz=(z-LAKE.cz)/LAKE.rz;
    if(qx*qx+qz*qz<1.04)return false;
    if(riverDist(x,z)<waterGap)return false;
    for(var i=0;i<MAP.roads.length;i++)if(distToRoad(x,z,MAP.roads[i].points)<roadGap)return false;
    if(pointInRect(x,z,PEN,-3)||pointInRect(x,z,HOUSE,-3)||pointInRect(x,z,TERR,-3))return false;
    return true;
  }
  function bbox(pts){
    var xs=pts.map(function(p){return p[0]}),zs=pts.map(function(p){return p[1]});
    return [Math.min.apply(null,xs),Math.max.apply(null,xs),Math.min.apply(null,zs),Math.max.apply(null,zs)];
  }
  MAP.terrainZones.forEach(function(zn){
    var n=0,tries=0,a,rr,x,z;
    if(zn.type==='林地'){
      while(n<650&&tries++<4200){
        a=R()*TAU;rr=Math.sqrt(R())*.97;
        x=zn.cx+Math.cos(a)*rr*zn.rx;z=zn.cz+Math.sin(a)*rr*zn.rz;
        if(ok(x,z,6,3)){SC.trees.push({x:x,z:z,seed:1+((R()*8)|0),s:.8+R()*.5});n++}
      }
    }else if(zn.type==='山地'||zn.type==='丘陵'){
      var want=zn.type==='山地'?230:80,bb=zn.shape==='polygon'?bbox(zn.points):null;
      while(n<want&&tries++<4200){
        if(zn.shape==='ellipse'){
          a=R()*TAU;rr=Math.sqrt(R())*.97;
          x=zn.cx+Math.cos(a)*rr*zn.rx;z=zn.cz+Math.sin(a)*rr*zn.rz;
        }else{
          x=bb[0]+R()*(bb[1]-bb[0]);z=bb[2]+R()*(bb[3]-bb[2]);
          if(!pointInPoly(x,z,zn.points))continue;
        }
        if(ok(x,z,5,2)){SC.rocks.push({x:x,z:z,s:.7+R()*1.1,v:(R()*3)|0});n++}
      }
      if(zn.type==='丘陵'){
        var m=0,t2=0;
        while(m<55&&t2++<1000){
          a=R()*TAU;rr=Math.sqrt(R())*.95;
          x=zn.cx+Math.cos(a)*rr*zn.rx;z=zn.cz+Math.sin(a)*rr*zn.rz;
          if(ok(x,z,6,3)){SC.trees.push({x:x,z:z,seed:1+((R()*8)|0),s:.75+R()*.45});m++}
        }
      }
    }
  });
  var basin=MAP.terrainZones[0],bbb= bbox(basin.points),bn=0,bt=0,bx,bz;
  while(bn<200&&bt++<6000){
    bx=bbb[0]+R()*(bbb[1]-bbb[0]);bz=bbb[2]+R()*(bbb[3]-bbb[2]);
    if(!pointInPoly(bx,bz,basin.points))continue;
    if(ok(bx,bz,7,4)){SC.trees.push({x:bx,z:bz,seed:1+((R()*8)|0),s:.8+R()*.5});bn++}
  }
  var tn=0,tt=0;
  while(tn<850&&tt++<8000){
    bx=bbb[0]+R()*(bbb[1]-bbb[0]);bz=bbb[2]+R()*(bbb[3]-bbb[2]);
    if(!pointInPoly(bx,bz,basin.points))continue;
    if(ok(bx,bz,3.4,1.5)){SC.tufts.push({x:bx,z:bz,v:(R()*3)|0});tn++}
  }
  for(var la=0;la<170;la++){
    var ang=la/170*TAU+(R()-.5)*.03,rf=1.012+R()*.045;
    var lx=LAKE.cx+Math.cos(ang)*LAKE.rx*rf,lz=LAKE.cz+Math.sin(ang)*LAKE.rz*rf;
    if(riverDist(lx,lz)<1)continue;
    SC.reeds.push({x:lx,z:lz,v:(R()*3)|0});
  }
  MAP.rivers.forEach(function(rv){
    var pts=rv.points;
    for(var i=0;i<pts.length-1;i++){
      var ax=pts[i][0],az=pts[i][1],ex=pts[i+1][0],ez=pts[i+1][1];
      var segL=hyp(ex-ax,ez-az),steps=Math.max(1,Math.floor(segL/26));
      for(var s2=0;s2<steps;s2++){
        var t=(s2+R()*.6)/steps,cxp=ax+(ex-ax)*t,czp=az+(ez-az)*t;
        var nx=-(ez-az)/segL,nz=(ex-ax)/segL,side=R()<.5?-1:1,off=rv.width/2+2+R()*2.5;
        var rx2=cxp+nx*off*side,rz2=czp+nz*off*side;
        var qx=(rx2-LAKE.cx)/LAKE.rx,qz=(rz2-LAKE.cz)/LAKE.rz;
        if(qx*qx+qz*qz<1.02)continue;
        SC.reeds.push({x:rx2,z:rz2,v:(R()*3)|0});
        if(R()<.55)SC.reeds.push({x:cxp-nx*off*side+(R()-.5)*2,z:czp-nz*off*side+(R()-.5)*2,v:(R()*3)|0});
      }
    }
  });
  MAP.places.forEach(function(p){
    if(p.name==='弄莫湖')return;
    if(p.name==='独树成林')SC.trees.push({x:p.x,z:p.z,seed:4,s:2.3,big:true});
    if(p.name==='莫里瀑布'||p.name==='雨林瀑布'){SC.falls.push({x:p.x,z:p.z});return}
    if(p.name==='莫里温泉'){SC.pools.push({x:p.x,z:p.z});return}
    if(p.name==='姐告桥 · 古渡')SC.planks.push({x:p.x,z:p.z});
    var cnt=p.tier==='主要'?6:4;
    for(var c2=0;c2<cnt;c2++){
      var a4=R()*TAU,rd2=8+R()*13,px3=p.x+Math.cos(a4)*rd2,pz3=p.z+Math.sin(a4)*rd2;
      if(ok(px3,pz3,6,3))SC.trees.push({x:px3,z:pz3,seed:1+((R()*8)|0),s:.85+R()*.5});
    }
  });
})();

/* ===== NXFlora-driven vegetation (data layer): species by biome, 2-3 per biome, first pass =====

var FLORA_CACHE=null;
(function buildFlora(){

  FLORA_CACHE=NXFlora.createFloraCache({max:260,size:12});
  var R=pRnd(20261118);
  function okF(x,z,roadGap,waterGap){
    if(x<MAP.bounds.minX+12||x>MAP.bounds.maxX-12||z<MAP.bounds.minZ+12||z>MAP.bounds.maxZ-12)return false;
    var qx=(x-LAKE.cx)/LAKE.rx,qz=(z-LAKE.cz)/LAKE.rz;
    if(qx*qx+qz*qz<1.04)return false;
    if(riverDist(x,z)<waterGap)return false;
    for(var i=0;i<MAP.roads.length;i++)if(distToRoad(x,z,MAP.roads[i].points)<roadGap)return false;
    if(pointInRect(x,z,PEN,-3)||pointInRect(x,z,HOUSE,-3)||pointInRect(x,z,TERR,-3))return false;
    return true;
  }
  MAP.terrainZones.forEach(function(zn){
    var sp=null,want=0;
    if(zn.type==='坝子平原'){sp=['mango','sugarcane','kapok'];want=360;}
    else if(zn.type==='山地'){sp=['teak','rubber','fern'];want=170;}
    else if(zn.type==='丘陵'){sp=['teak','fern','rubber'];want=150;}
    else return;
    var n=0,t=0;
    while(n<want&&t++<3200){
      var x=zn.cx+(R()*2-1)*zn.rx*.95,z=zn.cz+(R()*2-1)*zn.rz*.95;
      if(!pointInPoly(x,z,zn.points))continue;
      if(!okF(x,z,6,3))continue;
      SC.flora.push({x:x,z:z,id:sp[(R()*3)|0],seed:(R()*97)|0});n++;
    }
  });
  /* 水边: lotus on the lake surface near shore */
  for(var li=0;li<44;li++){
    var a=R()*TAU,q=.90+R()*.08;
    SC.flora.push({x:LAKE.cx+Math.cos(a)*LAKE.rx*q,z:LAKE.cz+Math.sin(a)*LAKE.rz*q,id:'lotus',seed:(R()*97)|0,water:true});
  }
  /* 水边: bamboo/fern on the lake bank */
  for(var bi=0;bi<160;bi++){
    var a2=R()*TAU,q2=1.04+R()*.10;
    var bx=LAKE.cx+Math.cos(a2)*LAKE.rx*q2,bz=LAKE.cz+Math.sin(a2)*LAKE.rz*q2;
    if(okF(bx,bz,4,1))SC.flora.push({x:bx,z:bz,id:R()<.6?'bamboo':'fern',seed:(R()*97)|0});
  }
  /* 水边: bamboo/fern along riverbanks */
  MAP.rivers.forEach(function(rv){

    for(var gi=0;gi<pts.length-1;gi++){
      var ax=pts[gi][0],az=pts[gi][1],bx2=pts[gi+1][0],bz2=pts[gi+1][1];

        var px=ax+(bx2-ax)*tt+nx*off*side,pz=az+(bz2-az)*tt+nz*off*side;
        if(okF(px,pz,4,1))SC.flora.push({x:px,z:pz,id:R()<.65?'bamboo':'fern',seed:(R()*97)|0});
      }
    }
  });
  /* 路边: bougainvillea/bamboo/kapok along roads */
  MAP.roads.forEach(function(rd){
    var pts=rd.points;
    for(var gi2=0;gi2<pts.length-1;gi2++){
      var ax2=pts[gi2][0],az2=pts[gi2][1],bx3=pts[gi2+1][0],bz3=pts[gi2+1][1];
      var L2=hyp(bx3-ax2,bz3-az2),steps2=Math.floor(L2/18);
      for(var sj2=0;sj2<steps2;sj2++){

        var nx2=-(bz3-az2)/L2,nz2=(bx3-ax2)/L2,off2=6.5+R()*4;
        var px2=ax2+(bx3-ax2)*tt2+nx2*off2*side2,pz2=az2+(bz3-az2)*tt2+nz2*off2*side2;
        if(okF(px2,pz2,2,2))SC.flora.push({x:px2,z:pz2,id:['bougain','bamboo','kapok'][(R()*3)|0],seed:(R()*97)|0});
      }
    }
  });
  /* 寨内: banyan/banana/bougainvillea around named places */
  MAP.places.forEach(function(pl){
    if(pl.name==='弄莫湖')return;
    var n3=3+((R()*3)|0);
    for(var k=0;k<n3;k++){
      var a3=R()*TAU,rr=10+R()*15;
      var px3=pl.x+Math.cos(a3)*rr,pz3=pl.z+Math.sin(a3)*rr;
      if(okF(px3,pz3,5,3))SC.flora.push({x:px3,z:pz3,id:['banyan','banana','bougain'][(R()*3)|0],seed:(R()*97)|0});

  /* road corridor: backdrop trees + grass tufts hugging every road */
  MAP.roads.forEach(function(rd){

      var ax3=pts[ci][0],az3=pts[ci][1],bx4=pts[ci+1][0],bz4=pts[ci+1][1];

  SC.flowers=[];

  [[TERR.minX-9,TERR.cz-6,'bodhi'],[TERR.maxX+9,TERR.cz-6,'talipot'],[TERR.minX-8,TERR.maxZ+9,'talipot'],[TERR.maxX+8,TERR.maxZ+9,'bodhi']].forEach(function(pt,i){

  });
})();

  ctx.beginPath();
  for(i=0;i<SC.tufts.length;i++){var tf=SC.tufts[i];

function drawBillboards(Rv){
  var s=fov.scale,items=[];
  function vfOf(x,z){return (x-player.x)*Math.sin(yaw)-(z-player.z)*Math.cos(yaw)}
  if(nearC(PEN.cx,PEN.cz,Rv,28)){
    items.push({x:(SHED_R.minX+SHED_R.maxX)/2,z:SHED_R.maxZ,k:'hut'});

  }
  if(nearC(HOUSE.cx,HOUSE.cz,Rv,26))
    items.push({x:HOUSE.cx,z:HOUSE.cz+3.2,k:'sign',t1:'预留宅地',t2:'等你建房'});
  for(var ti2=0;ti2<SC.trees.length;ti2++){
    var st=SC.trees[ti2];
    if(hyp(st.x-player.x,st.z-player.z)>Rv+10)continue;

  }
  for(var fi3=0;fi3<SC.flora.length;fi3++){
    var sf=SC.flora[fi3];
    if(sf.water)continue;
    if(hyp(sf.x-player.x,sf.z-player.z)>Rv+10)continue;
    items.push({x:sf.x,z:sf.z,k:'flora',id:sf.id,seed:sf.seed});
  }
  for(var pi2=0;pi2<MAP.places.length;pi2++){
    var pl=MAP.places[pi2];
    if(pl.name==='弄莫湖')continue;

    items.push({x:pl.x,z:pl.z,k:'sign',t1:pl.name});
  }
  if(nearC(TERR.cx,TERR.cz,Rv,36)){

  for(var n=0;n<items.length;n++){

    ctx.fillStyle='#9A917F';ctx.fillRect(-.55,-.75,1.1,.85);
    ctx.fillStyle='#FFD98A';ctx.fillRect(-.34,-.58,.68,.52);
    ctx.fillStyle='#776E5E';ctx.beginPath();ctx.moveTo(-.75,-.75);ctx.lineTo(.75,-.75);ctx.lineTo(0,-1.35);ctx.closePath();ctx.fill();
    ctx.restore();
  });
  /* pines — the ported tree sprite, dimmed for dusk */
  [[-15.8,-9.5,4],[15.8,-9.5,6],[15.8,8.6,2]].forEach(function(T){
    ctx.save();
    ctx.filter='brightness(.78) saturate(.9)';
    var timg2=makeTreeSpriteP(T[2]),tw2=6.2;
    ctx.drawImage(timg2,T[0]-tw2/2,T[1]-tw2*340/300+2.6,tw2,tw2*340/300);
    ctx.restore();
  });
  /* actors */
  var tActors=MONKS.map(function(m){return {z:m.z,f:function(){drawMonk(m)}}});
  WMONKS.forEach(function(w){tActors.push({z:w.z,f:function(){drawMonkWalk(w)}})});
  tActors.push({z:temple.tz,f:function(){
    var kneelA=temple.bowAnim>0?Math.sin((1-temple.bowAnim)*Math.PI):0;
    drawVillager(temple.tx,temple.tz,temple.dir,
      {walk:temple.moving,walkPh:temple.walkPh,sit:temple.sitting,kneel:kneelA>.25,pray:temple.prayAnim>0});
  }});
  tActors.sort(function(a,b){return a.z-b.z});
  tActors.forEach(function(a){a.f()});
  /* sitting breath light */
  if(temple.sitting){
    var bp=(Math.sin(tNow*1.7)+1)/2;
    var gr2=ctx.createRadialGradient(temple.tx,temple.tz-.4,0,temple.tx,temple.tz-.4,2.6+bp*1.2);
    gr2.addColorStop(0,'rgba(255,220,150,'+(0.10+bp*.13)+')');gr2.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=gr2;circ(temple.tx,temple.tz-.4,3.8);ctx.fill();
  }
  /* drifting warm dust motes in the courtyard air */
  for(var mi=0;mi<22;mi++){
    var mbx=(pHash2(mi,3)-.5)*30,mbz=-8+pHash2(mi,5)*18;
    var mx2=mbx+Math.sin(tNow*.3+mi)*.6,mz2=mbz+Math.cos(tNow*.22+mi*1.3)*.4;
    ctx.fillStyle='rgba(255,224,160,'+(0.07+0.1*(0.5+0.5*Math.sin(tNow*.8+mi*2))).toFixed(3)+')';
    circ(mx2,mz2,.05+.05*pHash2(mi,17));ctx.fill();
  }
  ctx.restore();
  txt3('合掌 · 礼拜 · 木鱼 · 念珠 · 静坐 —— 都不急，慢慢来',view.w/2,view.h-118,14.5,'rgba(243,234,210,.85)','center','400');
}
function txt3(str,x,y,size,color,align,weight){
  ctx.font=(weight||'500')+' '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle=color;ctx.fillText(str,x,y);
}

/* ================= wardrobe panel ================= */
var panel=document.getElementById('panel'),
  nameInput=document.getElementById('nameInput'),
  swWrap=document.getElementById('swWrap'),
  hatWrap=document.getElementById('hatWrap'),
  moodSelect=document.getElementById('moodSelect'),
  storyInput=document.getElementById('storyInput'),
  storyCount=document.getElementById('storyCount'),
  colorName=document.getElementById('colorName');
(function buildPanel(){
  COLORS.forEach(function(c,i){
    var b=document.createElement('button');b.className='sw';b.type='button';
    b.dataset.ci=i;b.title=c.n;b.style.background=c.base;swWrap.appendChild(b);
  });
  HATS.forEach(function(h){
    var b=document.createElement('button');b.className='hat';b.type='button';
    b.dataset.hat=h.key;
    b.innerHTML='<span class="ic">'+h.ic+'</span>'+h.label;hatWrap.appendChild(b);
  });
  MOODS.forEach(function(m,i){
    var op=document.createElement('option');op.value=i;op.textContent=m.name;moodSelect.appendChild(op);
  });
})();
function syncPanel(){
  if(!selected)return;
  document.getElementById('panelName').textContent=selected.name+' 的衣橱';
  nameInput.value=selected.name;
  storyInput.value=selected.story;
  storyCount.textContent=selected.story.length+' / 80';
  moodSelect.value=selected.mood;
  colorName.textContent=COLORS[selected.ci].n;
  for(var i=0;i<swWrap.children.length;i++)
    swWrap.children[i].classList.toggle('on',i===selected.ci);
  for(var j=0;j<hatWrap.children.length;j++)
    hatWrap.children[j].classList.toggle('on',hatWrap.children[j].dataset.hat===selected.hat);
  document.getElementById('panelSaved').textContent='';
}
function selectSheep(sp,open){
  selected=sp;
  if(sp){sp.hopT=1;if(open!==false){panel.classList.add('open');syncPanel()}}
}
function closePanelFn(){panel.classList.remove('open');selected=null}
swWrap.addEventListener('click',function(e){
  var el=e.target.closest('.sw');if(!el||!selected)return;
  selected.ci=+el.dataset.ci;syncPanel();debounceSave();
});
hatWrap.addEventListener('click',function(e){
  var el=e.target.closest('.hat');if(!el||!selected)return;
  selected.hat=el.dataset.hat;syncPanel();debounceSave();
});
nameInput.addEventListener('input',function(){
  if(!selected)return;
  selected.name=nameInput.value.slice(0,6)||'小羊';
  document.getElementById('panelName').textContent=selected.name+' 的衣橱';
  debounceSave();
});
nameInput.addEventListener('change',function(){if(selected&&!nameInput.value)syncPanel()});
storyInput.addEventListener('input',function(){
  if(!selected)return;
  selected.story=storyInput.value.slice(0,80);
  storyCount.textContent=selected.story.length+' / 80';
  debounceSave();
});
moodSelect.addEventListener('change',function(){
  if(!selected)return;
  selected.mood=+moodSelect.value;selected.t=0;selected.state='idle';
  debounceSave();
});
document.getElementById('reroll').addEventListener('click',function(){
  if(!selected)return;
  var pool=STORIES.filter(function(s){return s!==selected.story});
  selected.story=pool[Math.floor(Math.random()*pool.length)];
  storyInput.value=selected.story;
  storyCount.textContent=selected.story.length+' / 80';
  debounceSave();
});
document.getElementById('doneBtn').addEventListener('click',function(){closePanelFn();saveState()});
document.getElementById('closePanel').addEventListener('click',closePanelFn);

/* ================= input ================= */
var ptr={down:false,sx:0,sy:0,moved:false,panning:false,panCamX:0,panCamZ:0,downSheep:null};
function evPos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function hitSheep(wx,wz){
  var best=null,bd=1.9;
  for(var i=sheep.length-1;i>=0;i--){
    var d=hyp(sheep[i].x-wx,sheep[i].z-wz);
    if(d<bd){bd=d;best=sheep[i]}
  }
  return best;
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  var p=evPos(e);
  ptr.down=true;ptr.moved=false;ptr.panning=false;ptr.sx=p.x;ptr.sy=p.y;ptr.lastX=p.x;
  ptr.panCamX=cam.x;ptr.panCamZ=cam.z;ptr.downSheep=null;
  if(mode==='map'){
    var w=screenToWorld(p.x,p.y);
    var sp=hitSheep(w.x,w.z);
    if(sp){ptr.downSheep=sp;dragSheep=null}
  }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!ptr.down)return;
  var p=evPos(e);
  var dx=p.x-ptr.sx,dy=p.y-ptr.sy;
  if(!ptr.moved&&hyp(dx,dy)>6)ptr.moved=true;
  if(ptr.moved){
    if(ptr.downSheep){
      dragSheep=ptr.downSheep;dragSheep.lift=Math.min(1,dragSheep.lift+.12);
      var w=screenToWorld(p.x,p.y);
      dragSheep.x=clamp(w.x,PEN.minX+1.2,PEN.maxX-1.2);
      dragSheep.z=clamp(w.z,PEN.minZ+1.2,PEN.maxZ-1.2);
      if(pointInRect(dragSheep.x,dragSheep.z,SHED_R,-1)){
        dragSheep.x=SHED_R.maxX+1.6;
      }
      dragSheep.tx=dragSheep.x;dragSheep.tz=dragSheep.z;
      dragSheep.state='idle';dragSheep.t=1.2;
    }else if(mode==='map'){
      if(viewMode==='follow'){
        /* drag-look: horizontal drag turns the camera */
        yaw+=(p.x-ptr.lastX)*0.0055;
        yawT=yaw;
      }else{
        ptr.panning=true;cam.follow=false;
        cam.x=ptr.panCamX-dx/cam.scale;
        cam.z=ptr.panCamZ-dy/cam.scale;
      }
    }
  }
  ptr.lastX=p.x;
});
cv.addEventListener('pointerup',function(e){
  var p=evPos(e);
  if(dragSheep){dragSheep.lift=0;dragSheep=null;saveState()}
  if(!ptr.moved){
    if(mode==='map'){
      var w=screenToWorld(p.x,p.y);
      var sp=hitSheep(w.x,w.z);
      if(sp){selectSheep(sp)}
      else{
        if(viewMode==='overview'){
          viewMode='follow';
          document.getElementById('viewAll').classList.remove('on');
        }
        setMoveTarget(w.x,w.z);
      }
    }else{
      /* temple: click fish / beads / ground */
      var tS=tScale,tx2=(p.x-view.w/2)/tS, tz2=(p.y-(view.h/2+10))/tS-1;
      if(hyp(tx2-7.75,tz2-(-.4))<2.1){doFish()}
      else if(hyp(tx2-13,tz2-3)<2.1){doBeads()}
      else{temple.mtx=clamp(tx2,TCOLL.minX+.8,TCOLL.maxX-.8);temple.mtz=clamp(tz2,TCOLL.minZ+.8,TCOLL.maxZ-.8)}
    }
  }
  ptr.down=false;ptr.downSheep=null;ptr.panning=false;
});
cv.addEventListener('pointercancel',function(){
  if(dragSheep){dragSheep.lift=0;dragSheep=null}
  ptr.down=false;ptr.downSheep=null;
});
cv.addEventListener('wheel',function(e){
  if(mode!=='map')return;
  e.preventDefault();
  var f=e.deltaY<0?1.13:0.885;
  if(viewMode==='follow'){
    fov.scale=clamp(fov.scale*f,12,44);
  }else{
    var p=evPos(e),wx=s2wX(p.x),wz=s2wY(p.y);
    cam.scale=clamp(cam.scale*f,.12,16);
    cam.x=wx-(p.x-view.w/2)/cam.scale;
    cam.z=wz-(p.y-view.h/2)/cam.scale;
    cam.follow=false;
  }
},{passive:false});
window.addEventListener('keydown',function(e){
  if(isTyping())return;
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==='Space'&&mode==='temple')doBow();
  if(mode==='map'&&viewMode==='overview'&&
     (e.code==='KeyW'||e.code==='KeyA'||e.code==='KeyS'||e.code==='KeyD'||e.code.indexOf('Arrow')===0)){
    viewMode='follow';
    document.getElementById('viewAll').classList.remove('on');
  }
});
window.addEventListener('keyup',function(e){keys[e.code]=false});
window.addEventListener('blur',function(){keys={}});

/* ================= HUD buttons ================= */
function setHeading(h){player.heading=h;player.headingTarget=h;yaw=h;yawT=h}
function teleport(x,z){
  if(mode==='temple')exitTemple();
  viewMode='follow';
  document.getElementById('viewAll').classList.remove('on');
  player.x=x;player.z=z;clearTarget();
  cam.x=x;cam.z=z;cam.follow=true;
  updateZone();
}
document.getElementById('gotoPen').addEventListener('click',function(){
  teleport(TP_PEN.x,TP_PEN.z);setHeading(0);toast('试玩传送 · 到了羊圈门口');
});
document.getElementById('gotoTemple').addEventListener('click',function(){
  teleport(TP_TEMPLE.x,TP_TEMPLE.z);setHeading(0);toast('试玩传送 · 到了山寺门前，往北走上台地');
});
document.getElementById('viewAll').addEventListener('click',function(){
  if(mode==='temple')exitTemple();
  if(viewMode==='overview'){
    viewMode='follow';
    this.classList.remove('on');
  }else{
    viewMode='overview';
    cam.scale=Math.min(view.w/(MAP.bounds.width+200),view.h/(MAP.bounds.height+150));
    cam.x=(MAP.bounds.minX+MAP.bounds.maxX)/2;cam.z=(MAP.bounds.minZ+MAP.bounds.maxZ)/2;cam.follow=false;
    this.classList.add('on');
  }
});
document.getElementById('viewPen').addEventListener('click',function(){
  teleport(TP_PEN.x,TP_PEN.z);setHeading(0);
});
document.getElementById('soundBtn').addEventListener('click',function(){
  initAudio();soundOn=!soundOn;
  if(master)master.gain.value=soundOn?.9:0;
  this.textContent=soundOn?'🔊':'🔇';
});
document.getElementById('enterBtn').addEventListener('click',function(){initAudio();enterTemple()});
document.getElementById('templeBar').addEventListener('click',function(e){
  var b=e.target.closest('.act');if(!b)return;
  var a=b.dataset.act;
  if(a==='pray')doPray();
  else if(a==='bow')doBow();
  else if(a==='fish')doFish();
  else if(a==='beads')doBeads();
  else if(a==='sit')doSit();
  else if(a==='exit')exitTemple();
  else if(a==='autofish'){
    initAudio();
    temple.autoFish=!temple.autoFish;temple.fishT=0;
    b.classList.toggle('on',temple.autoFish);
    b.textContent=temple.autoFish?'连敲 · 停':'连敲 · 开';
  }
});

/* ================= resize + main loop ================= */
function resize(){
  view.dpr=Math.min(window.devicePixelRatio||1,2);
  view.w=window.innerWidth;view.h=window.innerHeight;
  cv.width=Math.round(view.w*view.dpr);cv.height=Math.round(view.h*view.dpr);
  cv.style.width=view.w+'px';cv.style.height=view.h+'px';
}
window.addEventListener('resize',resize);
resize();
var lastT=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;tNow+=dt;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  if(mode==='map'){
    updatePlayer(dt);
    updateSheep(dt);
    if(viewMode==='follow'){
      yaw+=angDiff(yawT,yaw)*(1-Math.exp(-dt/0.38));
      cam.x=player.x;cam.z=player.z;
      drawFollow();
    }else{
      if(cam.follow){
        cam.x=lerp(cam.x,player.x,1-Math.pow(.0015,dt));
        cam.z=lerp(cam.z,player.z,1-Math.pow(.0015,dt));
      }
      drawOverview();
    }
  }else{
    updateTemple(dt);
    drawTemple();
  }
  drawCompass();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
updateZone();

/* ================= debug hooks ================= */
window.__game={
  player:player,
  sheep:sheep,
  temple:temple,
  enterTemple:enterTemple,
  exitTemple:exitTemple,
  selectedSheep:function(){return selected},
  selectSheep:function(i){if(sheep[i])selectSheep(sheep[i])},
  setTarget:function(x,z){if(mode==='map')setMoveTarget(x,z)},
  teleport:function(x,z){teleport(x,z)},
  knockFish:doFish,
  doBeads:doBeads,
  doBow:doBow,
  doPray:doPray,
  doSit:doSit,
  cam:cam,
  getYaw:function(){return yaw},
  setYaw:function(r){yaw=r;yawT=r;player.heading=r;player.headingTarget=r},
  getMode:function(){return mode==='temple'?'temple':viewMode},
  worldToScreen:function(x,z){if(mode==='temple')return null;var p=worldToScreen(x,z);return {x:p.x,y:p.y}},
  getState:function(){return {mode:mode==='temple'?'temple':viewMode,zone:zoneName,yaw:yaw,
    player:{x:player.x,z:player.z},
    temple:{bow:temple.bow,beads:temple.beads,fish:temple.fishCount,sitting:temple.sitting,
      ambience:temple.ambience,audio:actx?actx.state:'none',
      monks:MONKS.map(function(m){return {x:m.x,z:m.z}}),
      wmonks:WMONKS.map(function(m){return {x:m.x,z:m.z,moving:m.moving}})},
    selected:selected?selected.name:null}}
};
