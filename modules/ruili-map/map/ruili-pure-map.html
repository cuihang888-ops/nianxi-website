function txt(t, x, y, size, color, align, weight, spacing){

function along(pts, frac){
  let tot = 0; const segs = [];

  for (let i = 0; i < segs.length; i++){ if (acc + segs[i] >= want){ const t = segs[i] ? (want-acc)/segs[i] : 0;

function ridgeBand(zone, opt){
  const { ridges = 5, seed = 1, far = '#B7D2BE', near = '#74AC66', tex = 3000, flip = false, mist = '#dcebe6', mistA = 0.30 } = opt || {};
  const xs = zone.points.map(p=>p[0]), zs = zone.points.map(p=>p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), minz = Math.min(...zs), maxz = Math.max(...zs);
  const depth = maxz - minz, step = depth / ridges;
  ctx.save(); polyPath(zone.points); ctx.clip();
  for (let i = 0; i < ridges; i++){
    const t = ridges === 1 ? 1 : i / (ridges - 1);
    const baseZ = flip ? maxz - (i + 0.55) * step : minz + (i + 0.55) * step;
    const amp = step * 0.46;
    const ph1 = hash(seed*13.7 + i*7.1) * 10, ph2 = hash(seed*29.3 + i*3.9) * 10;
    const crest = x => baseZ + Math.sin(x*0.0016 + ph1) * amp * 0.6 + Math.sin(x*0.0043 + ph2) * amp * 0.38
                        + (hash(Math.floor((x-minx)/90) + seed*101 + i*17) - .5) * amp * 0.3;
    const colTop = lerpC(flip ? near : far, flip ? far : near, flip ? 1 - t : t);
    const g = ctx.createLinearGradient(0, Y(baseZ - amp), 0, Y(baseZ + step * (flip ? -1.3 : 1.3)));
    g.addColorStop(0, colTop); g.addColorStop(1, lerpC(colTop, '#3e6b34', 0.28));
    ctx.beginPath();
    for (let x = minx; x <= maxx; x += 45){ const xx = Math.min(x, maxx); ctx.lineTo(X(xx), Y(crest(xx))); if (x === minx) { ctx.moveTo(X(xx), Y(crest(xx))); } }
    if (flip){ ctx.lineTo(X(maxx), Y(minz - 60)); ctx.lineTo(X(minx), Y(minz - 60)); }
    else { ctx.lineTo(X(maxx), Y(maxz + 60)); ctx.lineTo(X(minx), Y(maxz + 60)); }
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    /* canopy texture on the slope */
    const R = rng(seed * 1000 + i * 77);
    const per = Math.round(tex / ridges);
    for (let k = 0; k < per; k++){
      const x = minx + R() * (maxx - minx);
      const cy = crest(x), off = Math.pow(R(), 1.4) * step * 1.25;
      const z = flip ? cy - off : cy + off;
      if (!inPoly(zone.points, x, z)) continue;
      const r = 2.6 + R() * 4.4;
      const CC = ['#4a7f3e', '#58924a', '#6fa758', '#79b060', '#8bbf66'];
      ctx.fillStyle = R() < 0.72 ? rgba(CC[Math.floor(R() * CC.length)], 0.5) : 'rgba(220,240,200,0.45)';
      ctx.beginPath(); ctx.arc(X(x), Y(z), r, 0, Math.PI*2); ctx.fill();
    }
    /* sunlit crest line */
    ctx.beginPath();
    for (let x = minx; x <= maxx; x += 45){ const xx = Math.min(x, maxx); x === minx ? ctx.moveTo(X(xx), Y(crest(xx))) : ctx.lineTo(X(xx), Y(crest(xx))); }
    ctx.strokeStyle = 'rgba(255,252,230,0.35)'; ctx.lineWidth = 2.6; ctx.stroke();
    /* mist band below crest (not on the nearest ridge) */
    if (i < ridges - 1){
      const mz = flip ? baseZ - step * 0.85 : baseZ + step * 0.85;
      for (let m = 0; m < 5; m++){
        const mx = minx + (m + 0.5 + (hash(seed*7+m*3.1+i) - .5) * 0.5) * (maxx - minx) / 5;
        softBlob(mx, mz + (hash(seed*11+m*7.7+i*3) - .5) * step * 0.3, 200 + hash(seed*13+m*5.9) * 260, 26 + hash(seed*17+m) * 22, mist, mistA);
      }
    }
  }
  ctx.restore();
  /* soften the zone edge with a wide low-alpha stroke */
  polyPath(zone.points); ctx.strokeStyle = rgba(near, 0.16); ctx.lineWidth = 30; ctx.stroke();
}

function treeCluster(x, z, R, seed, blossom){

    ctx.beginPath(); ctx.arc(X(cx), Y(cz), cr, 0, Math.PI*2); ctx.fill();
  }

  ctx.beginPath(); ctx.arc(X(x - R * 0.3), Y(z - R * 0.45), R * 0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(X(x + R * 0.35), Y(z - R * 0.1), R * 0.2, 0, Math.PI*2); ctx.fill();
  if (blossom){
    for (let i = 0; i < 26; i++){
      const a = Rr() * Math.PI * 2, d = Math.sqrt(Rr()) * R * 0.8;
      ctx.fillStyle = blossom;

    }
  }
}
function forestZone(zone, count, seed){
  const xs = zone.points.map(p=>p[0]), zs = zone.points.map(p=>p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), minz = Math.min(...zs), maxz = Math.max(...zs);
  const R = rng(seed);
  for (let i = 0; i < count; i++){
    const clu = Math.floor(i / 5);
    const bx = minx + hash(seed + clu * 3.3) * (maxx - minx), bz = minz + hash(seed * 2 + clu * 6.9) * (maxz - minz);

}

/* ---------- backdrop towns: tiny rooftop clusters ---------- */
function distToPolyline(pts, x, z){
  let m = 1e9;
  for (let i = 0; i < pts.length-1; i++){
    const [x1,z1] = pts[i], [x2,z2] = pts[i+1];
    const dx = x2-x1, dz = z2-z1, L2 = dx*dx + dz*dz;
    let t = L2 ? ((x-x1)*dx + (z-z1)*dz) / L2 : 0; t = Math.max(0, Math.min(1, t));
    m = Math.min(m, Math.hypot(x - (x1 + dx*t), z - (z1 + dz*t)));
  } return m;
}
function drawTown(cx, cz, R, count, seed){
  softBlob(cx, cz, R * 1.05, R * 0.8, '#e2d6be', 0.4);

    ctx.fillStyle = ROOFS[Math.floor(Rr() * ROOFS.length)];
    rr(X(x - w/2 - 0.7), Y(z - dpt/2 - 0.7), w + 1.4, dpt + 1.4, 1.6); ctx.fill();

function drawPagoda(x, z, baseW, tiers, tierH){

  g.addColorStop(0, '#F2CE5F'); g.addColorStop(1, '#C79A2B');
  for (let i = 0; i < tiers; i++){
    const wBot = baseW * (1 - i * 0.13), wTop = baseW * (1 - (i + 1) * 0.13) + 1.2;
    const yBot = z - i * tierH, yTop = z - (i + 1) * tierH;
    ctx.beginPath();
    ctx.moveTo(X(x - wBot/2), Y(yBot)); ctx.lineTo(X(x + wBot/2), Y(yBot));
    ctx.lineTo(X(x + wTop/2), Y(yTop)); ctx.lineTo(X(x - wTop/2), Y(yTop));

    ctx.strokeStyle = 'rgba(122,84,16,0.6)'; ctx.lineWidth = 0.9; ctx.stroke();
    ctx.strokeStyle = 'rgba(122,84,16,0.75)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(X(x - wBot/2 - 1), Y(yBot)); ctx.lineTo(X(x + wBot/2 + 1), Y(yBot)); ctx.stroke();
  }
  const topY = z - tiers * tierH;
  ctx.beginPath(); ctx.moveTo(X(x - 2), Y(topY)); ctx.lineTo(X(x + 2), Y(topY)); ctx.lineTo(X(x), Y(topY - 4.5)); ctx.closePath();
  ctx.fillStyle = '#A87C1E'; ctx.fill();
