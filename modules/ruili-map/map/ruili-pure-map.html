function hash(n){ let h = Math.sin(n * 127.1) * 43758.5453; return h - Math.floor(h); }
function poly(pts){ ctx.beginPath(); pts.forEach((p,i)=> i ? ctx.lineTo(X(p[0]),Y(p[1])) : ctx.moveTo(X(p[0]),Y(p[1]))); ctx.closePath(); }
function path(pts){ ctx.beginPath(); pts.forEach((p,i)=> i ? ctx.lineTo(X(p[0]),Y(p[1])) : ctx.moveTo(X(p[0]),Y(p[1]))); }
function txt(t,x,y,size,color,align,weight,spacing){
  ctx.font = (weight||'600') + ' ' + size + 'px "Yuanti SC","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = align||'left'; ctx.textBaseline = 'middle';

  if(size>=20){ ctx.strokeStyle = 'rgba(253,249,238,0.88)'; ctx.lineWidth = Math.max(3, size/5.5); }
  const draw = (cx2, ch) => { if(size>=20) ctx.strokeText(ch, cx2, y); ctx.fillStyle = color; ctx.fillText(ch, cx2, y); };
  if(spacing){ let cx = x; const ws = [...t].map(ch=>ctx.measureText(ch).width); const tot = ws.reduce((a,b)=>a+b,0) + spacing*(t.length-1);
    if((align||'left')==='center') cx = x - tot/2; [...t].forEach((ch,i)=>{ draw(cx, ch); cx += ws[i] + spacing; }); }
  else { if(size>=20) ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y); }
}

/* mountain relief speckle + forest speckle (deterministic) */
DATA.terrainZones.forEach((z,zi)=>{
  const xs = z.points.map(p=>p[0]), zs = z.points.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), minz=Math.min(...zs), maxz=Math.max(...zs);
  function inPoly(x,zz){ let inside=false; const pts=z.points;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      if(((pts[i][1]>zz)!==(pts[j][1]>zz)) && (x < (pts[j][0]-pts[i][0])*(zz-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0])) inside=!inside; }
    return inside; }
  if(z.type==='山地'||z.type==='丘陵'){
    /* soft rolling mounds: pale base + lighter top, no hard edges */
    for(let i=0;i<210;i++){
      const x = minx + hash(zi*10000+i*3.7)*(maxx-minx), zz = minz + hash(zi*20000+i*7.3)*(maxz-minz);
      if(!inPoly(x,zz)) continue;
      const r = 16 + hash(zi*30000+i*5.1)*26;
      ctx.fillStyle = 'rgba(148,190,118,0.35)';
      ctx.beginPath(); ctx.ellipse(X(x),Y(zz),r,r*0.52,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(214,238,182,0.5)';
      ctx.beginPath(); ctx.ellipse(X(x)-r*0.18,Y(zz)-r*0.16,r*0.62,r*0.3,0,0,Math.PI*2); ctx.fill();
    }
  }
  if(z.type==='林地'){
    /* puffy rounded canopy clusters, two-tone soft greens */
    for(let i=0;i<300;i++){
      const x = minx + hash(zi*50000+i*3.3)*(maxx-minx), zz = minz + hash(zi*60000+i*6.9)*(maxz-minz);
      if(!inPoly(x,zz)) continue;
      const r = 9 + hash(zi*70000+i*4.3)*11;
      ctx.fillStyle = 'rgba(84,138,72,0.55)';
      ctx.beginPath(); ctx.arc(X(x),Y(zz),r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(140,196,110,0.75)';
      ctx.beginPath(); ctx.arc(X(x)-r*0.3,Y(zz)-r*0.3,r*0.62,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(X(x)+r*0.42,Y(zz)+r*0.1,r*0.45,0,Math.PI*2); ctx.fill();
    }
  }
  if(z.type==='坝子平原'){
    /* tiny storybook flowers sprinkled through the meadow */
    const FC = ['#F2A9C4','#FFF6E8','#F7D774','#C3B2E8','#F28BA8'];
    for(let i=0;i<1500;i++){
      const x = minx + hash(zi*80000+i*2.9)*(maxx-minx), zz = minz + hash(zi*90000+i*6.1)*(maxz-minz);
      if(!inPoly(x,zz)) continue;
      ctx.fillStyle = FC[i%FC.length];
      ctx.beginPath(); ctx.arc(X(x),Y(zz),2.6,0,Math.PI*2); ctx.fill();
    }
  }
});

/* road name labels: trunk repeated ~every 1100 units, branch once; exit labels */
function along(pts, frac){
  let tot=0; const segs=[];
  for(let i=0;i<pts.length-1;i++){ const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); segs.push(l); tot+=l; }
  let want=tot*frac, acc=0;
  for(let i=0;i<segs.length;i++){ if(acc+segs[i]>=want){ const t=segs[i]?(want-acc)/segs[i]:0;
    return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; } acc+=segs[i]; }
  return pts[pts.length-1];
}
DATA.roads.forEach(r=>{
  let tot=0; for(let i=0;i<r.points.length-1;i++) tot+=Math.hypot(r.points[i+1][0]-r.points[i][0],r.points[i+1][1]-r.points[i][1]);
  if(r.level==='trunk'){
    const n = Math.max(2, Math.round(tot/1100));
    for(let k=0;k<n;k++){ const p = along(r.points,(k+0.5)/n);
      txt(r.name, X(p[0]), Y(p[1])-16, 27, '#8A6D3B', 'center', '700'); }

      txt(r.name, X(p[0]), Y(p[1])-13, 21, '#96793F', 'center', '600'); }
  }
  if(r.ends && r.ends[0]) txt(r.ends[0], X(r.points[0][0]), Y(r.points[0][1])+30, 25, '#6D5A2E', 'center', '700');
  if(r.ends && r.ends[1]){ const lp=r.points[r.points.length-1]; txt(r.ends[1], X(lp[0]), Y(lp[1])+30, 25, '#6D5A2E', 'center', '700'); }
