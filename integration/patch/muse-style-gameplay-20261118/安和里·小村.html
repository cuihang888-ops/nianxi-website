<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安和里 · 小村</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1410;color:#e8e4d8;
    font:13px/1.5 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;

  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

<body>
<canvas id="c"></canvas>
<div id="hud"><div class="big" id="money">¥0</div><div class="dim" id="clock">—</div></div>
<div id="bag"></div>
<a href="UH素材说明/来源与许可.txt" style="position:fixed;right:14px;bottom:12px;color:#e8e4d8;font-size:11px;opacity:.65">美术：Unknown Horizons · CC BY-SA 3.0</a><div id="keys">WASD 走 · 滚轮缩放<br>1-5 选建筑 · 6-8 买牲畜<br>E 交互 · R 重置存档</div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="bar"></div>
<script>
"use strict";
/* ===================== 1. 常量 ===================== */
const MAP = 240, CW = 120, CS = MAP / CW;
const DAY_SEC = 300;                 // 现实秒 → 游戏一天
const SUN = (() => { const v = [-0.62, -0.78], L = Math.hypot(v[0], v[1]); return [v[0]/L, v[1]/L]; })();

const THEMES = {
  dawn : { light:[1.00,0.87,0.76], amb:[0.26,0.26,0.32] },
  noon : { light:[1.00,0.99,0.95], amb:[0.20,0.21,0.26] },
  dusk : { light:[1.00,0.74,0.55], amb:[0.22,0.20,0.28] },
  night: { light:[0.36,0.44,0.64], amb:[0.09,0.11,0.19] }
};
const HAZE = { dawn:[232,208,186], noon:[214,224,216], dusk:[206,158,128], night:[28,38,58] };

const FOOT = {
  cottage  : { w:4.8, d:4.0, h:2.7, cost:600,  name:"木屋"  },
  twostorey: { w:4.6, d:4.2, h:4.5, cost:900,  name:"两层"  },
  townhouse: { w:7.3, d:3.7, h:5.2, cost:1250, name:"联排"  },
  barn     : { w:6.8, d:4.9, h:3.3, cost:420,  name:"谷仓"  },
  shed     : { w:2.7, d:2.3, h:2.0, cost:180,  name:"棚"    },
  coop     : { w:4.0, d:3.0, h:2.2, cost:250,  name:"鸡舍", pen:true, cap:6 },
  pen      : { w:7.0, d:5.0, h:0.5, cost:300,  name:"围栏", pen:true, cap:5 }
};
const BUILD_ORDER = ["cottage","barn","shed","coop","pen"];

const ANIMALS = {
  chicken: { name:"鸡", cost:60,  good:"egg",  rate:8,  price:8,  pen:"coop", r:0.28, col:[240,236,226] },
  pig    : { name:"猪", cost:180, good:"pork", rate:12, price:20, pen:"pen",  r:0.42, col:[214,170,168] },
  cow    : { name:"牛", cost:450, good:"milk", rate:10, price:30, pen:"pen",  r:0.60, col:[238,232,220] }
};
const ANIMAL_ORDER = ["chicken","pig","cow"];
const GOOD_NAME = { egg:"蛋", pork:"猪肉", milk:"奶" };

/* ===================== 2. 噪声与地形 ===================== */
function hash2(x, y, s) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s),
        c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, s) {
  let t = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { t += amp * vnoise(x * f, y * f, s + i * 17); f *= 2; amp *= 0.5; }
  return t;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 道路：折线 + 弧长采样 */
const roads = [];
function routeLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  return L;
}
function routeSample(pts, s) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i-1], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    if (acc + L >= s || i === pts.length - 1) {
      const t = L > 1e-6 ? Math.max(0, Math.min(1, (s - acc) / L)) : 0;
      return { x: a.x + dx * t, y: a.y + dy * t, dx: L > 1e-6 ? dx / L : 1, dy: L > 1e-6 ? dy / L : 0 };
    }
    acc += L;
  }
  const p = pts[pts.length - 1];
  return { x: p.x, y: p.y, dx: 1, dy: 0 };
}
function nearRoad(x, y) {
  let best = 1e9, ang = 0;
  for (const r of roads) {
    for (let i = 1; i < r.pts.length; i++) {
      const a = r.pts[i-1], b = r.pts[i];
      const vx = b.x - a.x, vy = b.y - a.y;
      const len2 = vx * vx + vy * vy || 1;
      let t = ((x - a.x) * vx + (y - a.y) * vy) / len2;
      t = Math.max(0, Math.min(1, t));
      const dx = x - (a.x + vx * t), dy = y - (a.y + vy * t);
      const d = Math.hypot(dx, dy) - r.w * 0.5;
      if (d < best) { best = d; ang = Math.atan2(vy, vx); }
    }
  }
  return { d: best, ang };
}

/* ===================== 3. 世界 ===================== */
const ELEV = new Float32Array(CW * CW);
const GC   = new Uint32Array(CW * CW);
const GL   = new Float32Array(CW * CW);
const ISW  = new Uint8Array(CW * CW);
let houses = [], trees = [], pens = [], animals = [], market = null;

function ci(cx, cy) { return cy * CW + cx; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function heightAt(x, y) {
  const fx = x / CS - 0.5, fy = y / CS - 0.5;
  const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  const g = (a, b) => ELEV[ci(clamp(a, 0, CW - 1), clamp(b, 0, CW - 1))];
  const h00 = g(x0, y0), h10 = g(x0 + 1, y0), h01 = g(x0, y0 + 1), h11 = g(x0 + 1, y0 + 1);
  return (h00 * (1 - tx) + h10 * tx) * (1 - ty) + (h01 * (1 - tx) + h11 * tx) * ty;
}

function buildRoads() {
  roads.length = 0;
  const main = [];
  for (let x = 6; x <= 234; x += 4) {
    const y = 118 + Math.sin(x * 0.026) * 10 + (fbm(x * 0.045, 3.1, 33) - 0.5) * 13;
    main.push({ x, y });
  }
  roads.push({ id: "avenue", pts: main, w: 7, dust: [126, 112, 92] });

  const branchA = [], p0 = routeSample(main, routeLen(main) * 0.34);
  for (let k = 0; k <= 14; k++) {
    const t = k / 14;
    branchA.push({ x: p0.x + Math.sin(t * 2.2) * 5 + (p0.dy) * -t * 44, y: p0.y + (p0.dx) * -t * 44 });
  }
  roads.push({ id: "north", pts: branchA, w: 5, dust: [120, 106, 86] });

  const branchB = [], p1 = routeSample(main, routeLen(main) * 0.63);
  for (let k = 0; k <= 12; k++) {
    const t = k / 12;
    branchB.push({ x: p1.x - Math.sin(t * 1.9) * 4 + (p1.dy) * t * 38, y: p1.y + (p1.dx) * t * 38 });
  }
  roads.push({ id: "south", pts: branchB, w: 5, dust: [120, 106, 86] });
}

function genTerrain() {
  const rd = new Float32Array(CW * CW);
  for (let cy = 0; cy < CW; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      rd[ci(cx, cy)] = nearRoad((cx + 0.5) * CS, (cy + 0.5) * CS).d;
    }
  }
  for (let cy = 0; cy < CW; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const wx = (cx + 0.5) * CS, wy = (cy + 0.5) * CS;
      let e = fbm(wx * 0.021, wy * 0.021, 7) * 0.78 + fbm(wx * 0.075, wy * 0.075, 91) * 0.22;
      e = e * 1.12 - 0.12;
      const d = rd[ci(cx, cy)];
      if (d < 16) e = Math.max(e, 0.46 + (16 - d) * 0.0035);
      ELEV[ci(cx, cy)] = e;
    }
  }
  for (let cy = 0; cy < CW; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const i = ci(cx, cy), e = ELEV[i];
      let r, g, b, lit;
      if (e < 0.355) {
        const deep = clamp((0.355 - e) / 0.09, 0, 1);
        r = 62 + 20 * (1 - deep); g = 96 + 22 * (1 - deep); b = 108 + 26 * (1 - deep);
        lit = 0.74; ISW[i] = 1;
      } else if (e < 0.415) {
        const t = (e - 0.355) / 0.06;
        r = 156 + 26 * t; g = 146 + 24 * t; b = 118 + 14 * t; lit = 0.86; ISW[i] = 0;
      } else {
        const v = fbm(cx * 0.14, cy * 0.14, 55);
        const dry = clamp((e - 0.62) / 0.3, 0, 1);
        r = (92 + 34 * v) * (1 - dry) + (150 + 22 * v) * dry;
        g = (118 + 32 * v) * (1 - dry) + (150 + 18 * v) * dry;
        b = (74 + 26 * v) * (1 - dry) + (108 + 14 * v) * dry;
        lit = 0.80 + 0.24 * (e - 0.42);
        ISW[i] = 0;
      }
      GC[i] = (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
      GL[i] = lit;
    }
  }
}

/* ===================== 4. 街屋（沿路弧长生成） ===================== */
function obbCorners(b) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang), hw = b.w / 2, hd = b.d / 2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([u, v]) => [b.x + u * c - v * s, b.y + u * s + v * c]);
}
function obbOverlap(A, B, m) {
  const ca = obbCorners(A), cb = obbCorners(B);
  const axes = [[Math.cos(A.ang), Math.sin(A.ang)], [-Math.sin(A.ang), Math.cos(A.ang)],
                [Math.cos(B.ang), Math.sin(B.ang)], [-Math.sin(B.ang), Math.cos(B.ang)]];
  for (const [ax, ay] of axes) {
    let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
    for (const p of ca) { const d = p[0] * ax + p[1] * ay; if (d < a0) a0 = d; if (d > a1) a1 = d; }
    for (const p of cb) { const d = p[0] * ax + p[1] * ay; if (d < b0) b0 = d; if (d > b1) b1 = d; }
    if (a1 + m < b0 || b1 + m < a0) return false;
  }
  return true;
}
function hitOBB(px, py, r, b) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang);
  const dx = px - b.x, dy = py - b.y;
  const u = dx * c + dy * s, v = -dx * s + dy * c;
  const du = Math.max(0, Math.abs(u) - b.w / 2), dv = Math.max(0, Math.abs(v) - b.d / 2);
  return du * du + dv * dv < r * r;
}

function buildFrontage(road, side, R, out) {
  const total = routeLen(road.pts), half = road.w / 2;
  let s = 6 + R() * 7;
  let run = 1 + ((R() * 3) | 0), tall = R() < 0.42;
  while (s < total - 6) {
    if (run-- <= 0) { tall = R() < 0.42; run = 1 + ((R() * 3) | 0); }
    const roll = R();
    const kind = tall ? (roll < 0.38 ? "townhouse" : "twostorey")
                      : (roll < 0.20 ? "shed" : roll < 0.34 ? "barn" : "cottage");
    const fp = FOOT[kind];
    if (s + fp.w > total - 3) break;
    const p = routeSample(road.pts, s + fp.w / 2);
    const nx = -p.dy * side, ny = p.dx * side;
    const setback = half + 0.7 + R() * R() * 1.5;
    const off = setback + fp.d / 2;
    const x = p.x + nx * off, y = p.y + ny * off;
    if (heightAt(x, y) > 0.43 && x > 8 && x < MAP - 8 && y > 8 && y < MAP - 8) {
      out.push({ kind, x, y, ang: Math.atan2(p.dy, p.dx), w: fp.w, d: fp.d, h: fp.h, rot: R() * 0.06 - 0.03 });
    }
    s += fp.w + (R() < 0.55 ? 0.95 : 2.7 + R() * 1.3);
  }
  return out;
}

function genWorld() {
  buildRoads();
  genTerrain();
  houses = []; trees = []; pens = []; animals = []; market = null;

  const avenue = roads[0];
  buildFrontage(avenue,  1, mulberry32(20261117), houses);
  buildFrontage(avenue, -1, mulberry32(88117),    houses);

  // 集市：大道中点一侧
  const total = routeLen(avenue.pts);
  const mp = routeSample(avenue.pts, total * 0.5);
  const mx = mp.x + (-mp.dy) * -(avenue.w / 2 + 2.6), my = mp.y + (mp.dx) * -(avenue.w / 2 + 2.6);
  market = { kind: "stall", x: mp.x - mp.dy * (avenue.w / 2 + 2.4), y: mp.y + mp.dx * (avenue.w / 2 + 2.4),
             ang: Math.atan2(mp.dy, mp.dx), w: 5.0, d: 3.6, h: 2.6, isMarket: true };

  // 树
  const R = mulberry32(445566);
  for (let i = 0; i < 900; i++) {
    const x = 4 + R() * (MAP - 8), y = 4 + R() * (MAP - 8);
    if (heightAt(x, y) < 0.44) continue;
    if (nearRoad(x, y).d < 2.2) continue;
    let bad = false;
    for (const h of houses) if (Math.hypot(h.x - x, h.y - y) < 6.2) { bad = true; break; }
    if (bad || Math.hypot(market.x - x, market.y - y) < 7) continue;
    trees.push({ x, y, r: 1.0 + R() * 0.9, kind: R() < 0.3 ? "pine" : "broad", hue: R() });
  }
}

/* ===================== 5. 状态 ===================== */
const player = { x: 0, y: 0, ang: -Math.PI / 2, r: 0.34, spd: 4.6 };
const state = { money: 800, inv: {}, hour: 7.5, t: 0 };
let cam = { x: 0, y: 0, z: 26 };
let buildSel = -1, mouse = { x: 0, y: 0, wx: 0, wy: 0 }, ghost = null;

/* ===================== 6. 输入 ===================== */
const keys = Object.create(null);
let VW = 0, VH = 0, DPR = 1;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.max(1, Math.round(VW * DPR));
  cv.height = Math.max(1, Math.round(VH * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "escape") { buildSel = -1; syncBar(); }
  if (k === "e") interact();
  if (k === "r") { if (confirm("清空存档并重新开局？")) { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} location.reload(); } }
  if (k >= "1" && k <= "8") {
    const n = parseInt(k, 10) - 1;
    if (n < BUILD_ORDER.length) { buildSel = n; syncBar(); }
    else buyAnimal(ANIMAL_ORDER[n - BUILD_ORDER.length]);
  }
  if (" wwasd".includes(k)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  cam.z = clamp(cam.z * (e.deltaY > 0 ? 0.9 : 1.111), 13, 52);
}, { passive: false });
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  mouse.wx = (mouse.x - VW / 2) / cam.z + cam.x;
  mouse.wy = (mouse.y - VH / 2) / cam.z + cam.y;
});
cv.addEventListener("mousedown", e => {
  if (e.button !== 0) { buildSel = -1; syncBar(); return; }
  if (buildSel >= 0) attemptBuild();
});
cv.addEventListener("contextmenu", e => { e.preventDefault(); buildSel = -1; syncBar(); });

/* ===================== 7. 交互 ===================== */
let toastT = 0;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on"); toastT = 2.2;
}
function addGood(k, n) { state.inv[k] = (state.inv[k] || 0) + n; }
function invTotal() { let s = 0; for (const k in state.inv) s += state.inv[k]; return s; }

function nearestPen() {
  let best = null, bd = 1e9;
  for (const p of pens) {
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < bd) { bd = d; best = p; }
  }
  return bd < Math.max(2.6, best ? Math.max(best.w, best.d) * 0.5 : 0) ? best : null;
}

function interact() {
  const md = Math.hypot(market.x - player.x, market.y - player.y);
  if (md < 5.2) {
    let sum = 0, n = 0, parts = [];
    for (const k in state.inv) {
      const c = state.inv[k]; if (!c) continue;
      sum += c * (k === "egg" ? 8 : k === "pork" ? 20 : 30); n += c;
      parts.push(GOOD_NAME[k] + "×" + c);
    }
    if (!n) { toast("货筐是空的"); return; }
    state.money += sum; state.inv = {};
    toast("卖出 " + parts.join(" ") + "  →  ¥" + sum);
    return;
  }
  const pen = nearestPen();
  if (pen) {
    let any = false, parts = [];
    for (const k in pen.goods) {
      const c = pen.goods[k]; if (!c) continue;
      addGood(k, c); parts.push(GOOD_NAME[k] + "×" + c); pen.goods[k] = 0; any = true;
    }
    toast(any ? "收进筐里：" + parts.join(" ") : "还什么都没产出");
  }
}

function buyAnimal(type) {
  const A = ANIMALS[type];
  if (state.money < A.cost) { toast("钱不够，¥" + A.cost + " 一头"); return; }
  const pen = pens.find(p => p.penKind === A.pen && p.animals.length < p.cap);
  if (!pen) { toast("先盖一座" + (A.pen === "coop" ? "鸡舍" : "围栏") + "，而且还得有空位"); return; }
  state.money -= A.cost;
  const c = Math.cos(pen.ang), s = Math.sin(pen.ang);
  const u = (Math.random() - 0.5) * (pen.w - 1.4), v = (Math.random() - 0.5) * (pen.d - 1.4);
  const a = {
    type, pen, x: pen.x + u * c - v * s, y: pen.y + u * s + v * c,
    tx: 0, ty: 0, ang: Math.random() * 6.28, timer: Math.random() * A.rate
  };
  a.tx = a.x; a.ty = a.y;
  animals.push(a); pen.animals.push(a);
  toast("买了一只" + A.name + "  ¥-" + A.cost);
  syncBar();
}

/* ===================== 8. 建造 ===================== */
function ghostAt() {
  if (buildSel < 0) { ghost = null; return; }
  const kind = BUILD_ORDER[buildSel];
  const fp = FOOT[kind];
  const info = nearRoad(mouse.wx, mouse.wy);
  const snap = 0.25;
  const x = Math.round(mouse.wx / snap) * snap, y = Math.round(mouse.wy / snap) * snap;
  ghost = { kind, x, y, ang: info.ang, w: fp.w, d: fp.d, h: fp.h };
  ghost.err = placeError(ghost);
}

function placeError(b) {
  const fp = FOOT[b.kind];
  if (b.x < 8 || b.y < 8 || b.x > MAP - 8 || b.y > MAP - 8) return "太靠地图边缘";
  const hw = b.w / 2, hd = b.d / 2, c = Math.cos(b.ang), s = Math.sin(b.ang);
  for (const [u, v] of [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd],[0,0]]) {
    if (heightAt(b.x + u * c - v * s, b.y + u * s + v * c) < 0.40) return "这里是水面";
  }
  const nr = nearRoad(b.x, b.y);
  if (nr.d < 0.6) return "压到路面了";
  if (nr.d > hd + 6.5) return "离路太远，街不成街";
  for (const h of houses) if (obbOverlap(b, h, 0.45)) return "和房子重叠";
  if (obbOverlap(b, market, 0.6)) return "和集市重叠";
  for (const p of pens) if (obbOverlap(b, p, 0.45)) return "和围栏重叠";
  for (const t of trees) if (Math.hypot(t.x - b.x, t.y - b.y) < t.r + hd * 0.7) return "树挡着";
  if (state.money < fp.cost) return "钱不够（¥" + fp.cost + "）";
  return null;
}

function attemptBuild() {
  if (!ghost) return;
  if (ghost.err) { toast(ghost.err); return; }
  const fp = FOOT[ghost.kind];
  state.money -= fp.cost;
  const b = {
    kind: ghost.kind, x: ghost.x, y: ghost.y, ang: ghost.ang,
    w: fp.w, d: fp.d, h: fp.h, rot: 0
  };
  if (fp.pen) {
    b.pen = true; b.penKind = ghost.kind; b.cap = fp.cap; b.animals = []; b.goods = {};
    pens.push(b);
  } else {
    houses.push(b);
  }
  toast("盖好了：" + fp.name + "  ¥-" + fp.cost);
  syncBar();
}

/* ===================== 9. 更新 ===================== */
function walkable(x, y) {
  if (x < 2 || y < 2 || x > MAP - 2 || y > MAP - 2) return false;
  if (heightAt(x, y) < 0.385) return false;
  return true;
}
function collideStatic(x, y, r) {
  for (const h of houses) if (hitOBB(x, y, r, h)) return true;
  if (hitOBB(x, y, r, market)) return true;
  for (const t of trees) {
    const rr = t.r * 0.42;
    if (Math.hypot(t.x - x, t.y - y) < rr + r) return true;
  }
  return false;
}

function update(dt) {
  state.t += dt;
  state.hour = (state.hour + dt * 24 / DAY_SEC) % 24;

  // 移动
  let mx = 0, my = 0;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  if (keys["w"] || keys["arrowup"]) my -= 1;
  if (keys["s"] || keys["arrowdown"]) my += 1;
  if (mx || my) {
    const L = Math.hypot(mx, my); mx /= L; my /= L;
    player.ang = Math.atan2(my, mx);
    const step = player.spd * dt;
    const nx = player.x + mx * step, ny = player.y + my * step;
    if (walkable(nx, player.y) && !collideStatic(nx, player.y, player.r)) player.x = nx;
    if (walkable(player.x, ny) && !collideStatic(player.x, ny, player.r)) player.y = ny;
  }

  // 相机跟随（软）
  const k = 1 - Math.pow(0.0025, dt);
  cam.x += (player.x - cam.x) * k;
  cam.y += (player.y - cam.y) * k;

  // 动物
  const daytime = state.hour > 6 && state.hour < 20;
  for (const a of animals) {
    const A = ANIMALS[a.type];
    const d = Math.hypot(a.tx - a.x, a.ty - a.y);
    if (d < 0.25) {
      const p = a.pen, c = Math.cos(p.ang), s = Math.sin(p.ang);
      const u = (Math.random() - 0.5) * (p.w - 1.6), v = (Math.random() - 0.5) * (p.d - 1.6);
      a.tx = p.x + u * c - v * s; a.ty = p.y + u * s + v * c;
    } else {
      const spd = 0.45 + A.r * 0.6;
      const ax = (a.tx - a.x) / d, ay = (a.ty - a.y) / d;
      a.x += ax * spd * dt; a.y += ay * spd * dt;
      a.ang = Math.atan2(ay, ax);
    }
    if (daytime) {
      a.timer += dt;
      if (a.timer >= A.rate) {
        a.timer -= A.rate;
        a.pen.goods[A.good] = (a.pen.goods[A.good] || 0) + 1;
      }
    }
  }

  ghostAt();

  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) document.getElementById("toast").classList.remove("on");
  }
  updateHUD();
  tickSave(dt);
}

/* ===================== 10. 光照 ===================== */
function lightAt(h) {
  const K = [[0,"night"],[4.5,"night"],[7,"dawn"],[10,"noon"],[15.5,"noon"],[18,"dusk"],[20.5,"dusk"],[23,"night"],[24,"night"]];
  let a = K[0], b = K[K.length - 1];
  for (let i = 1; i < K.length; i++) if (h <= K[i][0]) { a = K[i-1]; b = K[i]; break; }
  const t = b[0] === a[0] ? 0 : (h - a[0]) / (b[0] - a[0]);
  const A = THEMES[a[1]], B = THEMES[b[1]];
  const mix = (p, q) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t];
  return { light: mix(A.light, B.light), amb: mix(A.amb, B.amb), haze: mix(HAZE[a[1]], HAZE[b[1]]) };
}

// ← 那个 0.20：环境光底噪。调低阴影更重更贴地。
function shadeRGB(r, g, b, lit, L) {
  const k = 0.20 + 0.62 * Math.pow(lit, 0.85);
  return "rgb(" +
    clamp(Math.round(r * (L.amb[0] + L.light[0] * k)), 0, 255) + "," +
    clamp(Math.round(g * (L.amb[1] + L.light[1] * k)), 0, 255) + "," +
    clamp(Math.round(b * (L.amb[2] + L.light[2] * k)), 0, 255) + ")";
}
const SH = (rgb, lit, L) => shadeRGB(rgb[0], rgb[1], rgb[2], lit, L);

function SX(x) { return (x - cam.x) * cam.z + VW / 2; }
function SY(y) { return (y - cam.y) * cam.z + VH / 2; }

/* ===================== 11. 绘制 ===================== */
function drawGround(L) {
  const x0 = Math.max(0, Math.floor((cam.x - VW / 2 / cam.z) / CS) - 1);
  const x1 = Math.min(CW - 1, Math.ceil((cam.x + VW / 2 / cam.z) / CS) + 1);
  const y0 = Math.max(0, Math.floor((cam.y - VH / 2 / cam.z) / CS) - 1);
  const y1 = Math.min(CW - 1, Math.ceil((cam.y + VH / 2 / cam.z) / CS) + 1);
  const cwpx = CS * cam.z + 1.2;                 // +1.2 消缝
  for (let cy = y0; cy <= y1; cy++) {
    for (let cx = x0; cx <= x1; cx++) {
      const i = ci(cx, cy), v = GC[i];
      let lit = GL[i];
      if (ISW[i]) lit = 0.70 + 0.11 * Math.sin(state.t * 1.3 + (cx + cy) * 0.55);
      ctx.fillStyle = shadeRGB((v >> 16) & 255, (v >> 8) & 255, v & 255, lit, L);
      ctx.fillRect(Math.round(SX(cx * CS)), Math.round(SY(cy * CS)), cwpx, cwpx);
    }
  }
}

function drawRoads(L) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const r of roads) {
    ctx.beginPath();
    for (let i = 0; i < r.pts.length; i++) {
      const p = r.pts[i];
      if (i === 0) ctx.moveTo(SX(p.x), SY(p.y)); else ctx.lineTo(SX(p.x), SY(p.y));
    }
    ctx.strokeStyle = SH(r.dust, 0.95, L);
    ctx.lineWidth = r.w * cam.z + 1;
    ctx.stroke();
    ctx.strokeStyle = SH([r.dust[0] + 26, r.dust[1] + 22, r.dust[2] + 16], 0.95, L);
    ctx.lineWidth = r.w * cam.z * 0.55;
    ctx.stroke();
  }
}

function quad(p, fill) {
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = fill; ctx.lineWidth = 0.6; ctx.stroke();   // ← 消缝：同色描边
}

function drawBuilding(b, L) {
  const index=b.kind==='townhouse'?3:b.kind==='twostorey'?2:b.kind==='cottage'?0:b.kind==='shed'?1:-1;
  if(index>=0 && uhDraw(UH_SPRITES[index],b.x,b.y,Math.max(b.w,b.d)*1.32)) return;
  const cs = obbCorners(b);
  const P = cs.map(p => [SX(p[0]), SY(p[1])]);
  const H = Math.max(2, b.h * cam.z * 0.40);

  // 影子
  const off = b.h * 0.28;
  ctx.beginPath();
  const sh = cs.map(p => [SX(p[0] + off * 0.9), SY(p[1] + off)]);
  ctx.moveTo(sh[0][0], sh[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(sh[i][0], sh[i][1]);
  ctx.closePath();
  ctx.fillStyle = "rgba(30,38,30," + (0.30 * Math.min(1, L.light[0] + 0.25)) + ")";
  ctx.fill();

  // 侧面：按屏幕中线 y 从后往前
  const edges = [];
  for (let i = 0; i < 4; i++) {
    const a = P[i], c = P[(i + 1) % 4];
    edges.push({ a, c, mid: (a[1] + c[1]) / 2, w0: cs[i], w1: cs[(i + 1) % 4] });
  }
  edges.sort((p, q) => p.mid - q.mid);

  let front = null, bestMid = -1e9;
  for (const e of edges) {
    const dx = e.w1[0] - e.w0[0], dy = e.w1[1] - e.w0[1];
    let nx = -dy, ny = dx;
    const L2 = Math.hypot(nx, ny) || 1; nx /= L2; ny /= L2;
    const mx_ = (e.w0[0] + e.w1[0]) / 2 - b.x, my_ = (e.w0[1] + e.w1[1]) / 2 - b.y;
    if (nx * mx_ + ny * my_ < 0) { nx = -nx; ny = -ny; }
    const lit = 0.42 + 0.58 * Math.max(0, nx * SUN[0] + ny * SUN[1]);
    const col = b.kind === "stall" ? [196, 168, 130] : WALL;
    quad([e.a, e.c, [e.c[0], e.c[1] + H], [e.a[0], e.a[1] + H]], SH(col, lit * 0.92, L));
    if (e.mid > bestMid) { bestMid = e.mid; front = e; }
  }

  // 屋顶：沿长边做脊
  const longU = b.w >= b.d;
  const inset = Math.min(b.w, b.d) * 0.08;
  const c0 = Math.cos(b.ang), s0 = Math.sin(b.ang);
  const toW = (u, v) => [b.x + u * c0 - v * s0, b.y + u * s0 + v * c0];
  const hw = b.w / 2, hd = b.d / 2;
  const roofPoly = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([u, v]) => {
    const su = u * (1 - inset / hw), sv = v * (1 - inset / hd);
    const wpt = toW(su, sv); return [SX(wpt[0]), SY(wpt[1])];
  });

  if (b.kind === "pen" || b.kind === "stall" && false) { /* 不走到这里 */ }

  if (b.h < 1.0) {
    // 围栏：只画地面与栏杆
    quad(roofPoly, SH(SOIL, 0.85, L));
    return;
  }

  const ridgeA = toW(-(hw - inset), 0), ridgeB = toW(hw - inset, 0);
  const rA = [SX(ridgeA[0]), SY(ridgeA[1])], rB = [SX(ridgeB[0]), SY(ridgeB[1])];
  const litN = 0.42 + 0.58 * Math.max(0, (-Math.sin(b.ang + Math.PI)) * SUN[1] + 0.5);
  quad([roofPoly[0], roofPoly[1], rB, rA], SH(ROOF_A, 0.86, L));
  quad([roofPoly[3], roofPoly[2], rB, rA], SH(ROOF_B, 0.62, L));

  // 细瓦线沿屋面铺开，保持原有屋顶轮廓。
  ctx.save();
  ctx.strokeStyle=SH([77,57,47],.7,L);ctx.globalAlpha=.28;ctx.lineWidth=.65;
  for(let j=1;j<7;j++) {
    const t=j/7;
    for(const edge of [[roofPoly[0],roofPoly[1]],[roofPoly[3],roofPoly[2]]]) {
      const a=[edge[0][0]*(1-t)+rA[0]*t,edge[0][1]*(1-t)+rA[1]*t];
      const c=[edge[1][0]*(1-t)+rB[0]*t,edge[1][1]*(1-t)+rB[1]*t];
      ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...c);ctx.stroke();
    }
  }
  ctx.restore();
  // 前墙窗（远看的一点细节）
  if (front && b.w > 3) {
    const a = front.a, c = front.c;
    for (let i = 0; i < 2; i++) {
      const t = 0.30 + i * 0.40;
      const px = a[0] + (c[0] - a[0]) * t, py = a[1] + (c[1] - a[1]) * t + H * 0.42;
      const ww = Math.max(2, cam.z * 0.34), hh = Math.max(3, cam.z * 0.5);
      ctx.fillStyle = SH([70, 92, 104], 0.55, L);
      ctx.fillRect(px - ww / 2, py - hh / 2, ww, hh);
    }
  }
}

function drawPen(p, L) {
  const cs = obbCorners(p);
  const P = cs.map(q => [SX(q[0]), SY(q[1])]);
  quad(P, SH(SOIL, 0.9, L));
  // 栏杆
  ctx.strokeStyle = SH(FENCE, 0.8, L);
  ctx.lineWidth = Math.max(1.5, cam.z * 0.10);
  ctx.beginPath();
  ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(P[i][0], P[i][1]);
  ctx.closePath(); ctx.stroke();
  // 栅栏柱
  for (let i = 0; i < 4; i++) {
    const a = P[i], c = P[(i + 1) % 4];
    const n = Math.max(2, Math.round(Math.hypot(c[0] - a[0], c[1] - a[1]) / (cam.z * 0.55)));
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      ctx.fillStyle = SH(FENCE, 0.7, L);
      ctx.fillRect(a[0] + (c[0] - a[0]) * t - 1.2, a[1] + (c[1] - a[1]) * t - 1.2, 2.6, 2.6);
    }
  }
}

function drawTree(t, L) {
  if(t.kind==='broad' && uhDraw(UH_SPRITES[4],t.x,t.y,t.r*2.5)) return;
  const sx = SX(t.x), sy = SY(t.y), rr = t.r * cam.z;
  ctx.beginPath();
  ctx.ellipse(sx + rr * 0.30, sy + rr * 0.26, rr * 0.72, rr * 0.34, 0, 0, 6.2832);
  ctx.fillStyle = "rgba(28,36,28,.34)"; ctx.fill();
  ctx.fillStyle = SH([92, 68, 52], 0.8, L);
  ctx.fillRect(sx - rr * 0.09, sy - rr * 0.10, rr * 0.18, rr * 0.32);
  const base = t.kind === "pine" ? [58, 92, 72] : [76, 108, 72];
  const v = 0.82 + t.hue * 0.34;
  const blobs = t.kind === "pine"
    ? [[0, -0.30, 0.60], [0.06, -0.62, 0.44], [-0.04, -0.90, 0.28]]
    : [[-0.26, -0.34, 0.50], [0.26, -0.38, 0.48], [0, -0.66, 0.46]];
  for (let i = 0; i < blobs.length; i++) {
    const [bx, by, br] = blobs[i];
    const lit = 0.52 + 0.42 * (1 - i / blobs.length);
    ctx.beginPath();
    ctx.arc(sx + bx * rr, sy + by * rr - rr * 0.18, br * rr, 0, 6.2832);
    ctx.fillStyle = SH(base.map(c => c * v), lit, L);
    ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke();
  }
}

function drawAnimal(a, L) {
  const A = ANIMALS[a.type];
  const sx = SX(a.x), sy = SY(a.y), rr = A.r * cam.z;
  ctx.beginPath();
  ctx.ellipse(sx + rr * 0.28, sy + rr * 0.30, rr * 0.90, rr * 0.42, 0, 0, 6.2832);
  ctx.fillStyle = "rgba(28,36,28,.30)"; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(sx, sy, rr * 0.92, rr * 0.72, a.ang, 0, 6.2832);
  ctx.fillStyle = SH(A.col, 0.88, L); ctx.fill();
  ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx + Math.cos(a.ang) * rr * 0.72, sy + Math.sin(a.ang) * rr * 0.72, rr * 0.34, 0, 6.2832);
  ctx.fillStyle = SH(A.col.map(c => c * 0.92), 0.80, L); ctx.fill();
}

function drawPlayer(L) {
  const sx = SX(player.x), sy = SY(player.y), rr = player.r * cam.z * 1.5;
  ctx.beginPath();
  ctx.ellipse(sx + rr * 0.25, sy + rr * 0.30, rr * 0.85, rr * 0.40, 0, 0, 6.2832);
  ctx.fillStyle = "rgba(24,32,26,.38)"; ctx.fill();
  ctx.beginPath(); ctx.arc(sx, sy, rr, 0, 6.2832);
  ctx.fillStyle = SH([214, 196, 160], 0.92, L); ctx.fill();
  ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx + Math.cos(player.ang) * rr * 0.42, sy + Math.sin(player.ang) * rr * 0.42, rr * 0.40, 0, 6.2832);
  ctx.fillStyle = SH([120, 92, 70], 0.9, L); ctx.fill();
}

function drawGhost(L) {
  if (!ghost) return;
  const ok = !ghost.err;
  const cs = obbCorners(ghost);
  const P = cs.map(p => [SX(p[0]), SY(p[1])]);
  const H = Math.max(2, ghost.h * cam.z * 0.40);
  for (let i = 0; i < 4; i++) {
    const a = P[i], c = P[(i + 1) % 4];
    quad([a, c, [c[0], c[1] + H], [a[0], a[1] + H]],
      ok ? "rgba(160,208,140,.30)" : "rgba(214,110,90,.30)");
  }
  quad(P, ok ? "rgba(190,230,160,.24)" : "rgba(230,140,120,.24)");
  ctx.strokeStyle = ok ? "rgba(200,240,170,.9)" : "rgba(240,150,130,.9)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(P[i][0], P[i][1]);
  ctx.closePath(); ctx.stroke();
}

function drawSurfaceDetail(L) {
  const left=Math.max(0,Math.floor(cam.x-VW/2/cam.z-2)), right=Math.min(MAP,Math.ceil(cam.x+VW/2/cam.z+2));
  const top=Math.max(0,Math.floor(cam.y-VH/2/cam.z-2)), bottom=Math.min(MAP,Math.ceil(cam.y+VH/2/cam.z+2));
  ctx.lineCap='round';
  for(let y=top;y<bottom;y++) for(let x=left;x<right;x++) {
    const v=hash2(x,y,421), wx=x+hash2(x,y,42), wy=y+hash2(x,y,43), e=heightAt(wx,wy);
    if(e<0.415) continue;
    const rd=nearRoad(wx,wy).d;
    if(rd<-0.6) {
      if(v>.72){ctx.fillStyle=SH([162,145,117],.85,L);ctx.beginPath();ctx.ellipse(SX(wx),SY(wy),cam.z*.055,cam.z*.025,0,0,Math.PI*2);ctx.fill();}
    } else if(rd>0.5 && v>.22) {
      ctx.strokeStyle=SH(v>.65?[147,168,102]:[87,115,70],.85,L);ctx.lineWidth=Math.max(.6,cam.z*.023);
      const px=SX(wx),py=SY(wy),h=cam.z*(.06+v*.08);
      ctx.beginPath();ctx.moveTo(px-h*.4,py-h*.7);ctx.lineTo(px,py);ctx.lineTo(px+h*.35,py-h);ctx.stroke();
      if(v>.985){ctx.fillStyle=SH([226,210,160],1,L);ctx.beginPath();ctx.arc(px,py-h,Math.max(.8,cam.z*.035),0,7);ctx.fill();}
    }
  }
}
function render() {
  const L = lightAt(state.hour);
  drawGround(L);
  drawRoads(L);
  drawSurfaceDetail(L);

  // 统一 y 排序
  const list = [];
  for (const t of trees) list.push({ y: t.y, f: () => drawTree(t, L) });
  for (const h of houses) list.push({ y: h.y, f: () => drawBuilding(h, L) });
  for (const p of pens) list.push({ y: p.y, f: () => drawPen(p, L) });
  list.push({ y: market.y, f: () => drawBuilding(market, L) });
  for (const a of animals) list.push({ y: a.y, f: () => drawAnimal(a, L) });
  list.push({ y: player.y, f: () => drawPlayer(L) });
  list.sort((p, q) => p.y - q.y);
  for (const o of list) o.f();

  drawGhost(L);

  // 雾：指数 2.15 —— 近处几乎不衰减，远处骤然消失
  const cx = VW / 2, cy2 = VH / 2;
  const R0 = Math.min(VW, VH) * 0.16, R1 = Math.hypot(VW, VH) * 0.62;
  const g = ctx.createRadialGradient(cx, cy2, R0, cx, cy2, R1);
  const hz = L.haze;
  for (let i = 0; i <= 8; i++) {
    const t = i / 8;
    const blend = 1 - Math.exp(-Math.pow(t * 3.4, 2.15));
    g.addColorStop(t, "rgba(" + Math.round(hz[0]) + "," + Math.round(hz[1]) + "," + Math.round(hz[2]) +
                     "," + (blend * 0.42).toFixed(3) + ")");
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

/* ===================== 12. HUD ===================== */
const barEl = document.getElementById("bar");
function syncBar() {
  barEl.innerHTML = "";
  BUILD_ORDER.forEach((k, i) => {
    const fp = FOOT[k];
    const d = document.createElement("div");
    d.className = "slot" + (buildSel === i ? " on" : "") + (state.money < fp.cost ? " off" : "");
    d.innerHTML = '<div class="n">' + fp.name + '</div><div class="c">¥' + fp.cost + " · " + (i + 1) + "</div>";
    d.onclick = () => { buildSel = buildSel === i ? -1 : i; syncBar(); };
    barEl.appendChild(d);
  });
  ANIMAL_ORDER.forEach((k, j) => {
    const A = ANIMALS[k];
    const d = document.createElement("div");
    d.className = "slot" + (state.money < A.cost ? " off" : "");
    d.innerHTML = '<div class="n">买' + A.name + '</div><div class="c">¥' + A.cost + " · " + (6 + j) + "</div>";
    d.onclick = () => buyAnimal(k);
    barEl.appendChild(d);
  });
}
function updateHUD() {
  const m = document.getElementById("money");
  if (m.textContent !== "¥" + Math.round(state.money)) m.textContent = "¥" + Math.round(state.money);
  const hh = Math.floor(state.hour), mm = Math.floor((state.hour % 1) * 60);
  const phase = state.hour < 5 ? "深夜" : state.hour < 8 ? "清晨" : state.hour < 17 ? "白天" : state.hour < 20 ? "黄昏" : "夜里";
  document.getElementById("clock").textContent =
    String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + "  " + phase;

  const parts = [];
  for (const k in state.inv) if (state.inv[k]) parts.push(GOOD_NAME[k] + " " + state.inv[k]);
  document.getElementById("bag").textContent = parts.length ? "货筐：" + parts.join(" · ") : "货筐：空";

  // 交互提示
  const pr = document.getElementById("prompt");
  let msg = "";
  if (Math.hypot(market.x - player.x, market.y - player.y) < 5.2) msg = "E  卖出货筐里所有东西";
  else {
    const p = nearestPen();
    if (p) {
      const n = p.animals.length;
      msg = "E  收取 · " + (p.penKind === "coop" ? "鸡舍" : "围栏") + " " + n + "/" + p.cap;
    }
  }
  if (ghost && ghost.err) msg = ghost.err;
  pr.textContent = msg;
  pr.classList.toggle("on", !!msg);
  if (!barEl.firstChild || barEl.childElementCount !== BUILD_ORDER.length + ANIMAL_ORDER.length) syncBar();
}

/* ===================== 13. 存档 ===================== */
const SAVE_KEY = "anheli-village-v1";
let saveT = 0;
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money: state.money, inv: state.inv, hour: state.hour,
      player: { x: player.x, y: player.y },
      houses, pens: pens.map(p => ({ kind: p.kind, x: p.x, y: p.y, ang: p.ang, w: p.w, d: p.d,
        h: p.h, penKind: p.penKind, cap: p.cap, goods: p.goods,
        animals: p.animals.map(a => ({ type: a.type, x: a.x, y: a.y })) }))
    }));
  } catch (_) {}
}
function tickSave(dt) { saveT += dt; if (saveT > 6) { saveT = 0; save(); } }

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (_) {}
  if (!d) return false;
  state.money = d.money ?? 800;
  state.inv = d.inv || {};
  state.hour = d.hour ?? 7.5;
  player.x = d.player?.x ?? 0; player.y = d.player?.y ?? 0;
  for (const h of (d.houses || [])) {
    if (!houses.some(q => Math.abs(q.x - h.x) < 0.01 && Math.abs(q.y - h.y) < 0.01)) houses.push(h);
  }
  pens = []; animals = [];
  for (const p of (d.pens || [])) {
    const np = Object.assign({}, p, { animals: [], goods: p.goods || {} });
    pens.push(np);
    for (const a of (p.animals || [])) {
      const na = { type: a.type, pen: np, x: a.x, y: a.y, tx: a.x, ty: a.y,
                   ang: 0, timer: 0 };
      np.animals.push(na); animals.push(na);
    }
  }
  return true;
}

/* ===================== 14. 主循环 ===================== */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function boot() {
  resize();
  genWorld();
  const loaded = load();

  if (!loaded || Math.hypot(player.x, player.y) < 1) {
    const total = routeLen(roads[0].pts);
    const sp = routeSample(roads[0].pts, total * 0.5);
    player.x = sp.x - sp.dy * 0;
    player.y = sp.y + 1.5;
    player.ang = -Math.PI / 2;
  }
  cam.x = player.x; cam.y = player.y;
  syncBar();
  updateHUD();
  requestAnimationFrame(t => { last = t; frame(t); });
  setTimeout(() => toast("WASD 走动 · 1-5 选建筑 · 6-8 买牲畜 · 靠近集市按 E 卖货"), 600);
}
boot();
</script>
